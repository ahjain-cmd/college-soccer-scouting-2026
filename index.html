/* ==================================================================
   ADMIN — manage players, reports, seasons; save to GitHub
   ================================================================== */
const POS_FULL={ST:'Striker',CF:'Center Forward',CAM:'Attacking Mid',AMF:'Attacking Mid',CM:'Central Mid',
 CMF:'Central Mid',CDM:'Defensive Mid',DMF:'Defensive Mid',LW:'Left Wing',RW:'Right Wing',LM:'Left Mid',
 RM:'Right Mid',W:'Winger',LB:'Left Back',RB:'Right Back',LWB:'Left Wingback',RWB:'Right Wingback',
 FB:'Fullback',WB:'Wingback',CB:'Center Back',LCB:'Left Center Back',RCB:'Right Center Back',GK:'Goalkeeper',SW:'Sweeper'};
const CLASSES=['Freshman','R-Freshman','Sophomore','R-Sophomore','Junior','R-Junior','Senior','R-Senior','5th Year','Grad Student'];
const GT='[A-Da-d][+\\-]{0,3}';
function parseGrade(raw){
  let g=(raw||'').trim().replace(/[:.\s]+$/,'');
  const m=g.match(new RegExp('^('+GT+')(?:\\s*[\\/\\-]\\s*('+GT+'))?$'));
  if(!m) return {grade:null,present:null,future:null};
  const pr=m[1].toUpperCase(), fu=(m[2]||m[1]).toUpperCase();
  return {grade: m[2]?pr+'/'+fu:pr, present:pr, future:fu};
}
function slug(name){ return (name||'').normalize('NFKD').replace(/[̀-ͯ]/g,'')
  .replace(/[^a-zA-Z ]/g,'').toLowerCase().replace(/\s+/g,' ').trim(); }
function nonUSA(c){ return c && !['usa','united states','us','u.s.a.'].includes(c.toLowerCase()); }
function parseDates(s){ const out=[]; const re=/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/g; let m,ys=new Set();
  while((m=re.exec(s||''))){ let y=+m[3]; if(y<100)y+=2000; if(y>=2018&&y<=2032){ out.push(`${(+m[1]+'').padStart(2,'0')}/${(+m[2]+'').padStart(2,'0')}/${y}`); ys.add(y);} }
  return {dates:out, years:[...ys]}; }

function recomputePlayer(p){
  const reps=(p.reports||[]);
  reps.forEach(r=>{ const g=parseGrade(r.grade); if(g.grade){ r.grade=g.grade; r.grade_present=g.present; r.grade_future=g.future; } });
  const graded=reps.filter(r=>gradeVal(r.grade_future)!=null);
  const best=graded.length? graded.reduce((a,b)=>gradeVal(b.grade_future)>gradeVal(a.grade_future)?b:a) : (reps[0]||{});
  p.grade=best.grade||null; p.grade_present=best.grade_present||null; p.grade_future=best.grade_future||null;
  p.grade_val=gradeVal(p.grade_future); p.grade_val_present=gradeVal(p.grade_present);
  const positions=[]; reps.forEach(r=>{ if(r.position&&!positions.includes(r.position)) positions.push(r.position); });
  if(positions.length){ p.positions=positions; p.position=positions[0];
    p.position_full=positions[0].split('/').map(x=>POS_FULL[x]||x).join(' / '); }
  const yrs=[...new Set(reps.map(r=>+r.year).filter(Boolean))].sort();
  p.years=yrs; p.year=yrs[yrs.length-1]||null;
  const last=reps[reps.length-1]||{};
  ['foot','class','team','status'].forEach(k=>{ const v=[...reps].reverse().find(r=>r[k]); if(v) p[k]=v[k]; });
  const ctry=reps.find(r=>r.country); if(ctry){ p.country=ctry.country; p.intl=nonUSA(ctry.country); }
  p.n_reports=reps.filter(r=>r.body).length;
}
function ensureOnBoard(p, year){
  year=String(year); if(!posTabs().includes(year)) return;
  const b=canonicalBoard(year); if(Object.values(b).some(a=>a.includes(p.key))) return;
  const id=boardBucket(p); if(id) b[id].push(p.key);   // GKs have no lane
}

      ${fField('Team / School','f_team',p&&(p.school||p.team))}
      ${fField('Status (e.g. 25 Dr LAFC, Graduated)','f_status',p&&p.status)}

    target.school=val('f_team')||null; target.team=target.school;
    target.status=val('f_status')||null; target.dob=val('f_dob')||null;
    recomputePlayer(target); markDirty(); closeForm();
    if(isNew) openReportForm(target,null); else { render(); openPlayer(target.key); }
  };
}
/* ---- report form ---- */

      ${fField('Position','r_pos',r.position|| p.position)}
      ${fField('Foot','r_foot',r.foot||p.foot,'select',['','Right','Left','Both'])}
      ${fField('Date(s) (MM/DD/YYYY)','r_dates',(r.dates||[]).join(' & '))}
      ${fField('Source','r_source',r.source,'select',['','Live','Stream','Video','Wyscout'])}
      ${fField('Match / opponent','r_match',r.match)}

      ${fField('Report','r_body',r.body,'textarea')}
    </div></div>
    <div class="form-foot"><button class="btn ghost" id="r_cancel">Cancel</button>
      <button class="btn primary" id="r_save">Save report</button></div>`;
  formOverlay.classList.add('show');
  const rn=()=>{ const n=roleName(val('r_role')); document.getElementById('r_rolename').textContent=n||'— (enter a code like 9-FWD1)'; };
  document.getElementById('r_role').addEventListener('input',rn); rn();
  document.getElementById('r_cancel').onclick=()=>{ closeForm(); openPlayer(p.key); };
  document.getElementById('r_body').focus();
  document.getElementById('r_save').onclick=()=>{
    const g=parseGrade(val('r_grade'));
    const dd=parseDates(val('r_dates'));
    const year=+val('r_year');
    const pos=val('r_pos').toUpperCase().replace(/\s+/g,'');
    const rec={ year, grade:g.grade, grade_present:g.present, grade_future:g.future,
      position:pos||null, position_full:pos?pos.split('/').map(x=>POS_FULL[x]||x).join(' / '):null,
      foot:val('r_foot')||null, dates:dd.dates, match:val('r_match')||null,
      source:val('r_source')||null, role_code:val('r_role')||null, role_name:roleName(val('r_role')),
      jersey:(val('r_role').match(/^\s*(\d{1,2})/)||[])[1]?+val('r_role').match(/^\s*(\d{1,2})/)[1]:null,
      body:val('r_body'), class:p.class, country:p.country, team:p.team,
      status:p.status, file:'manual entry' };
    if(ri!=null) p.reports[ri]=rec; else { p.reports=p.reports||[]; p.reports.push(rec); }
    recomputePlayer(p); ensureOnBoard(p, year); markDirty(); closeForm();
    render(); openPlayer(p.key);
  };
}
function deleteReport(p, ri){
  if(!confirm('Delete this report?')) return;
  p.reports.splice(ri,1); recomputePlayer(p); markDirty(); render();
  if(p.n_reports>0) openPlayer(p.key); else overlay.classList.remove('show');
}
function deletePlayer(p){
  if(!confirm(`Delete ${p.name} and all their reports? This cannot be undone (until you leave without saving).`)) return;
  const i=players.findIndex(x=>x.key===p.key); if(i>=0) players.splice(i,1); delete byKey[p.key];
  for(const y in DB.boards) for(const id in DB.boards[y]) DB.boards[y][id]=DB.boards[y][id].filter(k=>k!==p.key);
  markDirty(); overlay.classList.remove('show'); render();
}
function addSeason(){
  let y=prompt('New season year (e.g. 2026):', String(Math.max(...YEARS.map(Number))+1));
  if(!y) return; y=y.trim(); if(!/^\d{4}$/.test(y)){ toast('Enter a 4-digit year','err'); return; }
  if(!YEARS.includes(y)) YEARS.unshift(y);
  YEARS.sort((a,b)=>b-a);
  if(!DB.boards[y]){ DB.boards[y]={}; POSITIONS.forEach(pp=>DB.boards[y][pp.id]=[]); }
  markDirty(); curTab=y; buildTabs(); render();
  toast('Season '+y+' added — add players with a '+y+' report and they land here');
}

/* ---- GitHub save ---- */
function utf8b64(str){ const bytes=new TextEncoder().encode(str); let bin='';
  const CH=0x8000; for(let i=0;i<bytes.length;i+=CH) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(bin); }
function b64utf8(b64){ const bin=atob((b64||'').replace(/\n/g,'')); const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function serializeDB(){
  DB.years=YEARS.slice(); DB.rev=(DB.rev||0)+1; DB.edited_via_ui=true;
  DB.n_reports=players.reduce((s,p)=>s+(p.n_reports||0),0);
  POSITIONS&&Object.keys(DB.boards).forEach(y=>normalizeBoard(DB.boards[y]));
  return JSON.stringify(DB);
}
function ghToken(){ return localStorage.getItem('gh_token')||''; }
function setToken(){
  const t=prompt('Paste your GitHub fine-grained token (Contents: read+write on the repo). Stored only in this browser.', ghToken());
  if(t!=null){ localStorage.setItem('gh_token', t.trim()); toast('Token saved on this device'); }
}
async function githubSave(){
  const token=ghToken(); if(!token){ setToken(); if(!ghToken()) return; }
  const repo=DB.repo||{owner:'ahjain-cmd',name:'college-soccer-scouting',path:'data.json'};
  const api=`https://api.github.com/repos/${repo.owner}/${repo.name}/contents/${repo.path}`;
  const H={Authorization:`Bearer ${ghToken()}`, Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  const btn=document.getElementById('saveBtn'); btn.disabled=true; const old=btn.textContent; btn.textContent='Saving…';
  try{
    let sha=null;
    const g=await fetch(api+'?ref=main',{headers:H});
    if(g.status===200){
      const gj=await g.json(); sha=gj.sha;
      // stale-overwrite guard: if the published data is newer than what this
      // tab loaded, another tab/device saved in between. Don't silently clobber
      // it — give an informed choice (overwrite vs reload) instead of blocking.
      let remote=null; try{ remote=JSON.parse(b64utf8(gj.content)); }catch(e){}
      const remoteRev=(remote&&remote.rev)||0;
      if(remoteRev>baseRev){
        const rp=(remote&&remote.players)?remote.players.length:'?';
        const ok=confirm(
          'The live board was updated after you opened this tab (another tab or device saved).\n\n'+
          'Live now:   '+rp+' players\n'+
          'This tab:   '+players.length+' players\n\n'+
          'OK  = publish YOUR version now (replaces the live one; its newer edits are lost)\n'+
          'Cancel = stop — reload the page to keep the live edits, then redo yours');
        if(!ok){ btn.disabled=false; btn.textContent=old; return; }
        DB.rev=remoteRev;   // overwrite chosen: bump above the live rev so this wins cleanly
      }
    }
    else if(g.status===401||g.status===403){ toast('Token rejected — check it (🔑)','err'); btn.disabled=false; btn.textContent=old; return; }
    const content=utf8b64(serializeDB());     // bumps DB.rev
    const body=JSON.stringify({message:`Update scouting data (rev ${DB.rev})`, content, sha:sha||undefined, branch:'main'});
    const put=await fetch(api,{method:'PUT',headers:H,body});
    if(put.ok){ baseRev=DB.rev; clearDirty(); toast('Saved ✓ — live in ~1 min','ok'); }
    else { const e=await put.json().catch(()=>({})); toast('Save failed: '+(e.message||put.status),'err'); }
  }catch(e){ toast('Save failed: '+e.message,'err'); }
  btn.disabled=false; btn.textContent=old;
}

/* ---- edit-mode toggle + toast ---- */
let toastT;
function toast(msg,kind){ const t=document.getElementById('toast'); t.textContent=msg;
  t.className=(kind||'')+' show'; clearTimeout(toastT); toastT=setTimeout(()=>t.className=t.className.replace('show',''),3200); }
function setAdmin(on){
  ADMIN=on; document.body.classList.toggle('admin',on);
  document.getElementById('adminToolbar').style.display=on?'flex':'none';
  document.getElementById('adminBtn').textContent=on?'✎ Editing':'✎ Edit';
  buildTabs(); render();
}
// Verify the token actually has write access to the repo. Editing is gated on
// this, so nobody without a valid write-capable fine-grained token can change
// the board/database. (Also catches read-only tokens before you waste edits.)
async function validateToken(token){
  if(!token) return {ok:false, reason:'No token set.'};
  const repo=DB.repo||{owner:'ahjain-cmd',name:'college-soccer-scouting',path:'data.json'};
  try{
    const r=await fetch(`https://api.github.com/repos/${repo.owner}/${repo.name}`,
      {headers:{Authorization:`Bearer ${token}`, Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
    if(r.status===401) return {ok:false, reason:'Token is invalid or expired.'};
    if(r.status===404) return {ok:false, reason:'Token has no access to this repository — re-create it with the repo selected.'};
    if(!r.ok) return {ok:false, reason:'GitHub error '+r.status};
    const j=await r.json();
    if(!j.permissions || !j.permissions.push)
      return {ok:false, reason:'Token is read-only. Set Contents → Read and write.'};
    return {ok:true};
  }catch(e){ return {ok:false, reason:'Network error: '+e.message}; }
}
async function enterEdit(){
  let tok=ghToken();
  if(!tok){
    if(!confirm('Editing is restricted to the owner and requires your GitHub access token (Contents: Read and write).\n\nSet it now?')) return;
    setToken(); tok=ghToken(); if(!tok) return;
  }
  toast('Verifying access…');
  const v=await validateToken(tok);
  if(!v.ok){ toast('Edit access denied — '+v.reason+' (🔑 to fix)','err'); return; }
  setAdmin(true); toast('Access verified — edit mode on','ok');
}

/* ==================================================================
   SELECT players -> export a clean PDF report packet
   ================================================================== */
function updateSelCount(){ const el=document.getElementById('selCount');
  if(el) el.textContent=selected.size+' selected'; }
function toggleSelect(key){ if(selected.has(key)) selected.delete(key); else selected.add(key); updateSelCount(); render(); }
function setSelectMode(on){
  selectMode=on; document.body.classList.toggle('selecting',on);
  document.getElementById('selectBar').style.display=on?'flex':'none';
  document.getElementById('selectBtn').textContent=on?'☑ Selecting':'☑ Select';

}
function selectVisible(){
  const b=getPos(curTab); const onBoard=Object.values(b).flat();
  onBoard.map(k=>byKey[k]).filter(p=>p&&matchesFilter(p)).forEach(p=>selected.add(p.key));
  updateSelCount(); render();
}

function exportPDF(){
  if(!selected.size){ toast('Select at least one player first','err'); return; }
  const list=[...selected].map(k=>byKey[k]).filter(Boolean)
    .sort((a,b)=>(b.grade_val??-1)-(a.grade_val??-1)||a.name.localeCompare(b.name));
  const today=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  const sections=list.map(p=>{
    const clsNow=classForYear(p,curTab);
    const bio=[ clsNow, p.position_full||p.position, p.foot&&p.foot+'-footed', p.school||p.team,
      p.country, p.dob&&('DOB '+p.dob), p.status, p.intl&&'International',
      p.years&&p.years.length&&('Scouted '+p.years.join(', ')) ].filter(Boolean).map(esc).join(' &nbsp;•&nbsp; ');
    const reps=(p.reports||[]).slice().sort((a,b)=>(b.year||0)-(a.year||0)
        ||((b.dates&&b.dates[0])||'').localeCompare((a.dates&&a.dates[0])||'')).map(r=>{
      const dt=(r.dates&&r.dates.length)?r.dates.join(' & '):(r.year||'');
      const role=r.role_name||roleName(r.role_code);
      const meta=[ dt, r.match, r.source, role, r.role_code&&('#'+r.role_code) ].filter(Boolean).map(esc).join(' &nbsp;•&nbsp; ');
      return `<div class="rp">
        <div class="rphead"><span class="rgr">${esc(r.grade||'—')}</span><span class="rpmeta">${meta}</span></div>
        <div class="rpbody">${esc(r.body||'')}</div></div>`;
    }).join('') || '<div class="norep">No written report on file.</div>';
    return `<section class="pl">
      <div class="plhead"><div><h2>${esc(p.name)}</h2><div class="plbio">${bio}</div></div>
        <div class="plgrade">${esc(p.grade||'—')}</div></div>
      ${reps}</section>`;
  }).join('');
  const doc=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Scouting Reports — ${today}</title>
  <style>
    @page{margin:14mm 14mm 16mm}
    *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    body{font:11.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#14181d;margin:0}
    .top{border-bottom:2px solid #14181d;padding-bottom:8px;margin-bottom:14px}
    .top h1{margin:0;font-size:17px}
    .top .sub{color:#6b7480;font-size:11px;margin-top:2px}
    .pl{border:1px solid #d7dde3;border-radius:8px;padding:12px 14px;margin-bottom:12px;break-inside:avoid}
    .plhead{display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid #eceff2;padding-bottom:7px;margin-bottom:8px}
    .plhead h2{margin:0;font-size:16px}
    .plbio{color:#5b636d;font-size:10.5px;margin-top:3px}
    .plgrade{margin-left:auto;font-size:20px;font-weight:800;color:#0b3d91;border:2px solid #0b3d91;border-radius:8px;padding:2px 10px;white-space:nowrap}
    .rp{margin:8px 0;break-inside:avoid}
    .rphead{display:flex;gap:8px;align-items:baseline;margin-bottom:2px}
    .rgr{font-weight:800;color:#0b3d91;font-size:12px;white-space:nowrap}
    .rpmeta{color:#6b7480;font-size:10px}
    .rpbody{text-align:justify;white-space:pre-wrap}
    .norep{color:#8a929b;font-style:italic}
    .foot{margin-top:6px;color:#9aa2ab;font-size:9.5px;text-align:center}
    @media print{.noprint{display:none}}
    .noprint{position:fixed;top:10px;right:10px}
    .noprint button{font:600 13px system-ui;padding:8px 14px;border-radius:8px;border:0;background:#0b3d91;color:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  </style></head><body>
    <div class="noprint"><button onclick="window.print()">⭳ Save as PDF / Print</button></div>
    <div class="top"><h1>⚽ Ahan Jain — College Soccer Scouting Reports</h1>
      <div class="sub">${list.length} player${list.length>1?'s':''} • Generated ${today}</div></div>
    ${sections}
    <div class="foot">Ahan Jain College Soccer Scouting Database</div>
    <script>addEventListener('load',function(){setTimeout(function(){try{window.focus();window.print();}catch(e){}},400);});<\/script>
  </body></html>`;
  // open a real navigated document (blob URL) — reliable in Safari/Chrome,
  // unlike window.open('')+document.write which prints blank in Safari.
  const url=URL.createObjectURL(new Blob([doc],{type:'text/html'}));
  const w=window.open(url,'_blank');
  if(!w){ toast('Allow pop-ups for this site, then click Export PDF again','err'); URL.revokeObjectURL(url); return; }
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
  toast(list.length+' report'+(list.length>1?'s':'')+' opened — choose "Save as PDF"','ok');
}

/* ---------- controls ---------- */
function buildTabs(){
  const tabsEl=document.getElementById('tabs');
  const list=posTabs();
  if(!list.includes(curTab)) curTab=list[0];
  tabsEl.innerHTML=list.map(t=>`<button data-t="${t}" class="${t===curTab?'on':''}">${t}</button>`).join('');
  tabsEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{curTab=b.dataset.t;
    tabsEl.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); render();});
}
function updateMode(){
  document.getElementById('legend').style.display='flex';
  document.getElementById('modeHint').textContent =
    'Formation board by college season — drag players between positions & up/down; use + to add or × to remove.'
    + (ADMIN?' Editing the shared board — remember to Save & Publish.':' Your changes save in this browser.');
}
function build(){
  document.getElementById('hdr-sub').textContent=`${players.length} players · ${DB.n_reports} reports · positional boards by college season`;
  const pf=document.getElementById('posFilter');
  pf.innerHTML='<option value="">All positions</option>'+Object.keys(POS_GROUPS).map(g=>`<option>${g}</option>`).join('');
  pf.onchange=()=>{f.pos=pf.value;render();};
  const cf=document.getElementById('classFilter');
  const order=['Freshman','R-Freshman','Sophomore','R-Sophomore','Junior','R-Junior','Senior','R-Senior','5th Year','Grad Student'];
  const classes=[...new Set(players.map(p=>p.class).filter(Boolean))].sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  cf.innerHTML='<option value="">All classes</option>'+classes.map(c=>`<option>${c}</option>`).join('');
  cf.onchange=()=>{f.cls=cf.value;render();};
  let t; document.getElementById('search').addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>{f.q=e.target.value;render();},120);});
  document.getElementById('resetBtn').onclick=()=>{
    if(ADMIN){ if(confirm(`Reset the ${curTab} board to its auto-arrangement (grade order)? Your manual arrangement for ${curTab} is replaced.`)){
        DB.boards[curTab]=autoSeed(curTab); markDirty(); render(); } return; }
    if(confirm(`Reset your personal ${curTab} board back to the published arrangement?`)){
      delete store.pos[curTab]; save(); render(); }
  };
  document.getElementById('exportBtn').onclick=()=>{
    const b=curBoard(); const rows=[];
    POSITIONS.forEach(l=>{(b[l.id]||[]).forEach((k,i)=>{const p=byKey[k];if(p)rows.push({position:l.name,rank:i+1,name:p.name,grade:p.grade,class:p.class,school:p.school||p.team,status:p.status});});});
    const blob=new Blob([JSON.stringify(rows,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`board_${curTab}.json`;a.click();
  };
  // admin wiring
  document.getElementById('adminBtn').onclick=()=>{ ADMIN?setAdmin(false):enterEdit(); };
  document.getElementById('exitEditBtn').onclick=()=>{
    if(DIRTY && !confirm('You have unsaved changes. Leave edit mode without publishing?')) return;
    setAdmin(false); };
  document.getElementById('addPlayerBtn').onclick=()=>openPlayerForm(null);
  document.getElementById('addSeasonBtn').onclick=addSeason;
  document.getElementById('saveBtn').onclick=githubSave;
  document.getElementById('tokenBtn').onclick=setToken;
  document.getElementById('selectBtn').onclick=()=>setSelectMode(!selectMode);
  document.getElementById('selDoneBtn').onclick=()=>setSelectMode(false);
  document.getElementById('selClearBtn').onclick=()=>{ selected.clear(); updateSelCount(); render(); };
  document.getElementById('selVisibleBtn').onclick=selectVisible;
  document.getElementById('exportPdfBtn').onclick=exportPDF;
  window.addEventListener('beforeunload',e=>{ if(DIRTY){ e.preventDefault(); e.returnValue=''; } });
  buildTabs(); updateMode(); render();
}
build();
