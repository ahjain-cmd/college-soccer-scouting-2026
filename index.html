ment off the shoulder. Final product needs polish and potency but has the technique. (AJ)","category":null,"status":null,"role_name":"Chalk-on-Boots Winger"}]},{"key":"jefferson amaya","name":"Jefferson Amaya","class":"Senior","position":"RCB","positions":["RCB","CDM"],"position_full":"Right Center Back","foot":null,"country":"USA","dob":null,"team":"High Point","school":"High Point Panthers","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2024,2025],"year":2025,"category":null,"status":null,"rolenum":6,"n_reports":2,"reports":[{"dates":["09/25/2024"],"match":"High Point Panthers vs UNCG Spartans","team":"High Point Panthers","source":"Live","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"6-CMF-6 1","jersey":6,"position":"RCB","position_full":"Right Center Back","foot":null,"class":"Junior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"Was playing RCB this game. Passing range was on full display. Just a great right foot and great technique. Thought he defended very well and didn’t make any mistakes or have any poor moments. Could project decent at RCB. Need to see more. Technical and tactical projects, athletic ability is a question mark unless he continues to show well at RCB. Needs another year in college regardless. USL starter after his senior year. (AJ)","category":null,"status":null,"role_name":"True #6 (Double Pivot)"},{"dates":["10/28/2025"],"match":"High Point vs Davidson","team":"High Point","source":"Live","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Senior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6’1’, skinny build. Clean feet. Technically sound. Excellent technique and passing range. Good connector that can bounce and bump passes out of tight spaces with one or two touches. Doesn’t vacate his position centrally in the center of the park and shields the backline adequately with timing into challenges. Can dictate the tempo and rhythm of the match more with his technical and tactical qualities. USL C starter with room to physically grow into an MLS player. (AJ)","category":null,"status":null,"role_name":"True #6 (Double Pivot)"}]},{"key":"jemone barclay","name":"Jemone Barclay","class":"Junior","position":"LW","positions":["LW"],"position_full":"Left Wing","foot":null,"country":"Jamaica","dob":null,"team":"USF Bulls","school":"USF Bulls","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2024],"year":2024,"category":null,"status":null,"rolenum":11,"n_reports":1,"reports":[{"dates":["09/21/2024"],"match":"USF Bulls vs Charlotte 49ers","team":"USF Bulls","source":"Live","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"11-W1","jersey":11,"position":"LW","position_full":"Left Wing","foot":null,"class":"Junior","country":"Jamaica","year":2024,"file":"match-year: 2024 report","body":"6’0”, lean, thick build. Great close ball control. Excellent dribbler. Can drive at backlines. High soccer IQ and makes good decisions. Smooth on the ball, smooth dribbler, fluid, natural. 1v1 ability. Lively on and off the ball. Didn’t see final product or weak foot. USL C bench/USL L1 starter. (AJ)","category":null,"status":null,"role_name":"Chalk-on-Boots Winger"}]},{"key":"jeremy sharp","name":"Jeremy Sharp","class":"Junior","position":"RB","positions":["RB"],"position_full":"Right Back","foot":null,"country":"USA","dob":null,"team":"Michigan State","school":"Michigan State","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2024],"year":2024,"category":null,"status":null,"rolenum":2,"n_reports":2,"reports":[{"dates":["11/08/2024"],"match":"Michigan State vs Washington Huskies","team":"Michigan State","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"2-FB1","jersey":2,"position":"RB","position_full":"Right Back","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5'11\", Strong, lean build with balanced upper and lower body strength. Loose, fluid mover with quick feet, good coordination, and excellent balance. Right-foot dominant with clean touch and secure control in tight spaces; can carry forward with medium stride length and smooth changes of pace. Limited weak-foot use narrows passing and crossing options. Sees forward passes well and links play simply and effectively. Defends 1v1 with sharp first step, good acceleration, and recovery speed, but can step too high and be exposed in behind. Tackles with intent but sometimes arrives off-balance. Overlaps are well-timed, though service from wide areas is inconsistent due to setup and delivery. 1v1 attacking tools are basic, relying mainly on a change of pace or shoulder dip. Possesses the athletic base and defensive profile to compete at the next level; refining weak-foot use, crossing accuracy, and decision speed in transition will unlock greater overall impact","category":null,"status":null,"role_name":"Wing Back"},{"dates":["11/08/2024"],"match":"Michigan State vs Washington Huskies","team":"Michigan State","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"2-FB1","jersey":2,"position":"RB","position_full":"Right Back","foot":null,"class":"Junior","country":null,"year":2024,"file":"match-year: 2024 report","body":"5'11\", thick, lean build. Good build and size. Loose and fluid athlete. Excellent feet and good close ball control. Great balance. Technically sound, and soft feet. Good technique and right foot. Excellent curved channel ball. Poor weak foot. Can play forward and out of things. Sees the forward pass solidly and connects the game fluidly. Carries, glides, and dribbles forward nicely. Medium length strides and drive. Average defensive IQ. Can step too high and not make a full recovery. Offensive IQ is just okay as well, can play simple more often. A bit indecisive with the ball in transition moments. Process the game and has above-average speed of play. Tough and sharp into the challenge, but technique is just okay. Tackles a bit off-balance and dives in. Athletic and good engine. Has the athletic tools to defend 1v1 at the pro level. Projects forward cleanly and has good coverage up and down the line. Needs to provide more service and 1v1 ability is limited. Just has a change of pace/dip of the shoulder. Quality first step and good nose for the ball. Can fill out a bit more. Fringe MLS bench and USL C starter. Transfer to Rutgers in 2025 for his senior year. (AJ)","category":null,"status":null,"role_name":"Wing Back"}]},{"key":"jesus di vicente","name":"Jesus Di Vicente","class":"R-Senior","position":"LB","positions":["LB"],"position_full":"Left Back","foot":null,"country":"Spain","dob":null,"team":"UIC Flames","school":"UIC Flames","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2024],"year":2024,"category":null,"status":"Graduated","rolenum":5,"n_reports":1,"reports":[{"dates":["09/21/2024"],"match":"UIC Flames vs Missouri State Bears","team":"UIC Flames","source":"Stream","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"5-FB1","jersey":5,"position":"LB","position_full":"Left Back","foot":null,"class":"R-Senior","country":"Spain","year":2024,"file":"match-year: 2024 report","body":"5’11”, skinny, lean build. Good athlete. Excellent in the air. Wins most of his aerial duels. Defensively solid. Hard to beat 1v1. Sharp into the challenge and patient defender. Doesn’t dive in. Good strength to hold off attackers. Reads the game and is first to many loose balls and 50/50s. Attacking wise, good left foot. Good range of passing with accuracy, long and short. Can break pressure with his vision and passing. Can skip out of things through his progressive ball carrying ability as well. High IQ player. Always seems to make the right decision. Can project forward but can provide more service. Not entirely his fault as UIC struggle to hold the ball long enough to allow him to get forward. But hasn’t shown consistent final product. Can be a bit wasteful and go long too often. Has all the tools, needs to show more and ideally put up some assists. USLC starter/bench at wingback. (AJ)","category":null,"status":"Graduated","role_name":"Wing Back"}]},{"key":"juan moreno","name":"Juan Moreno","class":"Sophomore","position":"AMF","positions":["AMF"],"position_full":"Attacking Mid","foot":null,"country":"Columbia","dob":null,"team":"Oral Roberts Golden Eagles","school":"Oral Roberts Golden Eagles","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2023],"year":2023,"category":null,"status":null,"rolenum":11,"n_reports":1,"reports":[{"dates":["08/25/2023"],"match":"Oral Roberts Golden Eagles vs UC Santa Barbara Gauchos","team":"Oral Roberts Golden Eagles","source":null,"grade":"B/B","grade_present":"B","grade_future":"B","role_code":"11-W3-7","jersey":11,"position":"AMF","position_full":"Attacking Mid","foot":null,"class":"Sophomore","country":"Columbia","year":2023,"file":"match-year: 2023 report","body":"Very tricky, technical, smooth player. Great technical quality. Has multiple gears of pace. Nice change of direction with the ball. Good vision for the pass. Great technique. Solid in tight spaces. Good range of passing.","category":null,"status":null,"role_name":"Inverted Winger"}]},{"key":"julien le bourdoulous","name":"Julien Le Bourdoulous","class":"Grad Student","position":"CM","positions":["CM","CDM"],"position_full":"Central Mid","foot":null,"country":"France","dob":null,"team":"UNC Greensboro","school":"UMKC","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2024,2025],"year":2025,"category":null,"status":null,"rolenum":6,"n_reports":2,"reports":[{"dates":["12/01/2024","11/25/2024"],"match":"UMKC vs Pittsburgh","team":"UMKC","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"6-CMF-6 2","jersey":6,"position":"CM","position_full":"Central Mid","foot":null,"class":"Junior","country":"France","year":2024,"file":"match-year: 2024 report","body":"5’9”, skinny build. Great feet, bouncy, agile, and low center of gravity. High level agility. Covers ground for 90 minutes. Buzzes around the park. Makes plays and impacts the game defensively. Excellent feel for the game and good off-ball movement. Fluid. Checks and shows for the ball in the pocket. Plays with good tempo and is efficient. Can overdribble and turn it over cheaply. Excellent technical quality and fantastic technique. Smooth passer. Provides excellent curvature and texture with his ball striking. Precious right foot. Press resistant. Has some lock-picking ability but isn’t a true creative midfielder. Big threat on set-pieces with his service. Can hit a wide variety of passes. Has excellent passing range. Can lack weight and precision with his passing and can overhit or under-hit longer passes, but it’s not for a lack of technique. Occasionally can step late defensively and not react quick enough. Has the work-rate and athletic ability to defensively be a net-positive but can lack a bit of bite and ruthlessness. Can grind defensively for longer stretches and has all the technical and tactical tools. Projects nicely at the MLS level for a CM who can impact the game in and out of possession. Is on the older side and is a would be one of the better USL CMs immediately. Ideal systemic fit is as a holder in a single or double pivot. Can also be an 8 in a 433. Projects best as 6. (AJ)","category":null,"status":null,"role_name":"Single Pivot Holder"},{"dates":["09/13/2025"],"match":"UNC Greensboro vs South Carolina","team":"UNC Greensboro","source":"Live","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Grad Student","country":"France","year":2025,"file":"match-year: 2025 report","body":"5’7”, lean build. Excellent burst and acceleration with sharp feet and good agility. Covers ground well with sideline-to-sideline mobility. Energetic, with strong endurance and solid pace. Very good balance. Can be a bit casual going into tackles but can tackle sharply with bite, using his great feet. Works back defensively and reliably covers gaps in midfield. Shows good defensive positioning, though doesn’t often step out aggressively from the pocket. Excellent connector with smooth technique and high football IQ. Has some tempo-setting qualities. A fantastic ball carrier, using his burst and composure to glide past pressure and break lines. Can slip 5–15-yard entries between the lines. However, his speed of play can be inconsistent. Passing progression is limited: tends to overhit longer diagonals and balls in behind and struggles to consistently find line-splitting passes. Lacks a true final ball. Overall, a press-resistant midfielder with range, mobility, and quality on the dribble, but his lack of ball progression through passing and absence of final product significantly limit his impact. Transfer from UMKC. (AJ)","category":null,"status":null,"role_name":"True #6 (Double Pivot)"}]},{"key":"kenan hot","name":"Kenan Hot","class":"Senior","position":"CM","positions":["CM"],"position_full":"Central Mid","foot":null,"country":"USA","dob":null,"team":"Duke","school":"Duke","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":8,"n_reports":1,"reports":[{"dates":["11/01/2025","10/26/2025"],"match":"Duke vs North Carolina","team":"Duke","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"8-CMF-8 3","jersey":8,"position":"CM","position_full":"Central Mid","foot":null,"class":"Senior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5'11\" with a lean build. Strong work rate on both sides of the ball. Clean feet in tight spaces and in the pocket. Shows solid pace with good acceleration over distance and a useful change of speed to cover in transition or beat a defender 1v1. Aerial ability is just okay; physical strength in duels is serviceable. Shows excellent passing weight, timing, and crispness off both feet, with the technique to hit a full range of entry balls—progressions into the front four, diagonals to the FB/W, and clipped balls in behind. Clean first touch and consistent technical quality; strikes the ball with varied textures and delivers above-average set-piece service. Defensively, closes space with discipline and doesn’t dive in. A patient, well-timed tackler with sharp feet—rarely beaten once he engages. Not overly strong in duels but competent, willing to go to ground when needed, and stays connected to the defensive block. Brings good energy when pressing through back-passes. Combines sharply in the final third and has enough trickery and vision to slip final balls, combine quickly, or create small pockets to maintain attacking sequences. Plays naturally in the pocket, comfortable supporting underneath or making third man runs into half-spaces. Shows well in midfield and stays available, though could be more aggressive with his forward running. (AJ)","category":null,"status":null,"role_name":"Jack of All Trades"}]},{"key":"kwaku agyabeng","name":"Kwaku Agyabeng","class":"Freshman","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"Ghana","dob":null,"team":"Clemson Tigers","school":"Clemson Tigers","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":6,"n_reports":1,"reports":[{"dates":["08/21/2025"],"match":"Clemson Tigers vs Indiana University","team":"Clemson Tigers","source":"Stream","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Freshman","country":"Ghana","year":2025,"file":"match-year: 2025 report","body":"5’8”, solid build. Low center of gravity and easy change of direction. Excellent ball control. Technically sound and great technical quality. Comfortable on the ball and in tight spaces. Soft feet. Lower body stability and fluidity. Excellent ball security and retention. Speed of play and processing are just okay, can overdribble in midfield and lack some ball-progression but excellent control, feet, and security allow him to get away with it. High IQ and good decision-maker. Connects the game well. Can find the forward pass and ball in-behind, just needs do it more often. Spatial awareness and scanning are solid. Good pace but lacks top-end acceleration leading to him getting cut across by attackers in transition moments when working down and facing his goal. Tracks 2nd balls and provides good cover when the opposition goes direct. Defensive positioning can be leaky and can leave gaps in the midfield from stepping to high and then not have the acceleration to recover. Picked up two yellows from fouling in transition moments and got a red that cost his team. See more/monitor closely. (AJ)","category":null,"status":null,"role_name":"True #6 (Double Pivot)"}]},{"key":"liam bennett","name":"Liam Bennett","class":"Gr","position":"LB","positions":["LB"],"position_full":"Left Back","foot":null,"country":"USA","dob":null,"team":"New Hampshire Wildcats","school":null,"intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2023],"year":2023,"category":null,"status":"Graduated","rolenum":5,"n_reports":2,"reports":[{"dates":["10/07/2023"],"match":"New Hampshire Wildcats vs Bryant Bulldogs","team":"New Hampshire Wildcats","source":null,"grade":"B/B","grade_present":"B","grade_future":"B","role_code":"5-FB2","jersey":5,"position":"LB","position_full":"Left Back","foot":null,"class":"Gr","country":"USA","year":2023,"file":"match-year: 2023 report","body":"6’0”. Lean build. Soccer athletic. Clean and smooth in possession. Can play out when given time or under pressure. Great left foot. Technique and ball striking with both feet. Good vision and progressive passing ability. Scored their first goal with a right footed shot from 25 out from a second ball on a corner. Provides high quality service. Quality player.","category":null,"status":"Graduated","role_name":"Inverted Fullback"},{"dates":["10/07/2023"],"match":"New Hampshire Wildcats vs Bryant Bulldogs","team":"New Hampshire Wildcats","source":null,"grade":"B/B","grade_present":"B","grade_future":"B","role_code":"5-FB2","jersey":5,"position":"LB","position_full":"Left Back","foot":null,"class":"Gr","country":"USA","year":2023,"file":"match-year: 2023 report","body":"6’, lean build. Great technique. Sees the forward pass. Two-footed. Makes good decisions. Has final product and is an asset going forward. Defensively sound but doesn’t excel. Great left-foot. Can combine out of tight spaces. Lacks 1v1 ability and ability to create his own space. (AJ)","category":null,"status":"Graduated","role_name":"Inverted Fullback"}]},{"key":"lucas fernandez kim","name":"Lucas Fernandez Kim","class":"Grad Student","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"USA","dob":null,"team":"Oregon St.","school":"Oregon St","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":6,"n_reports":1,"reports":[{"dates":["11/09/2025","11/02/2025"],"match":"Oregon St. vs Pacific","team":"Oregon St.","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Grad Student","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6’0”, lean build. Solid pace, great agility, nimble, and fleet footed. Mobile and agile. Solid initial burst. Strong in the pocket. Bright, sharp feet, and defensive robustness. 1-2 touch connector that doesn’t waste a pass with excellent speed of play. Soft feet to receive and play quickly, rarely wastes a touch. Connects game fluidity. Excellent technical quality. Makes himself available in the pocket with good body shape when receiving. Ball progression is below-average, largely connects simply, can find 5-10 yd forward passes. Struggles to play forward and break lines, only can play backwards/sideways under pressure. Below-average passing range. Excellent timing and bite into the challenge, doesn’t vacate his position centrally, and shields the backline. High IQ and excellent feel for the game. Excellent ball security, retention, and circulation, while progression/range is poor. USL C starter/bench. (AJ)","category":null,"status":null,"role_name":"True #6 (Double Pivot)"}]},{"key":"lukas kamrath","name":"Lukas Kamrath","class":"R-Sophomore","position":"LCB","positions":["LCB"],"position_full":"Left Center Back","foot":null,"country":"USA","dob":null,"team":"High Point","school":"High Point","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":4,"n_reports":1,"reports":[{"dates":["10/28/2025"],"match":"High Point vs Davidson","team":"High Point","source":"Live","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"4-CB1","jersey":4,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"R-Sophomore","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6'4\", lean build. Left-footed, ball-playing CB with size, clean feet, and good pace. Dominant in the air and moves fluidly for his size. Front-foot defender who steps in with conviction, balance, and timing to cut play out and win defensive duels early; difficult to spin thanks to his frame and footwork. Excellent passing range and left-foot technique—especially on the diagonal—though he can find more consistent line-splitting entries. When turned, he can struggle and get divey when driven at 1v1, but he rarely concedes isolated wide-channel 1v1s due to proactive positioning and timing. Can be slow to sort his feet out when being drove at and does struggle to defend space in transition. Otherwise has all the tools. (AJ)","category":null,"status":null,"role_name":"Leader of the Line"}]},{"key":"luke hille","name":"Luke Hille","class":"Senior","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"USA","dob":null,"team":"UNC Tar Heels","school":"UNC Tar Heels","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2024],"year":2024,"category":null,"status":"MLS NP Minnesota","rolenum":10,"n_reports":1,"reports":[{"dates":["09/20/2024"],"match":"UNC Tar Heels vs NC State Wolfpack","team":"UNC Tar Heels","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"10-AMF-10 2","jersey":10,"position":"ST","position_full":"Striker","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6’1”, lean build. Pro frame. Finds and attacks space. Good movement and feel for the game. Can run of the shoulder, can drop in and lay off, can cut inside, has good variety with his movement. Smart decision-maker. High soccer IQ. Two-footed. Cerebral and processes things. Has some trickiness, vision and flair. Can lay-off a one touch ball into space but can also flick one around the corner to slip a teammate. Final product is polished and refined. Good 1v1 ability but not elite. Solid pace but not elite. Can poach inside the box, head and both feet. Good in the air. Hold-up play from direct balls or long balls to him is below-average. More of a false 9 and 10 than a true 9. Real question is about his ceiling. MLS starter/bench if there is still room to grow. USLC starter if ceiling is lower. I think the ceiling is a bit lower so USLC starter for me. (AJ)","category":null,"status":"MLS NP Minnesota","role_name":"Modern 3-4-2-1 #10"}]},{"key":"marco dos santos","name":"Marco Dos Santos","class":"Junior","position":"ST","positions":["ST","AMF"],"position_full":"Striker","foot":null,"country":"USA","dob":null,"team":"Virginia Cavaliers","school":"Virginia","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2023,2025],"year":2025,"category":null,"status":null,"rolenum":9,"n_reports":2,"reports":[{"dates":["08/28/2023"],"match":"Boston College vs Quinnipiac Bobcats","team":"Boston College","source":null,"grade":"B/C","grade_present":"B","grade_future":"C","role_code":"9-FWD2","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Freshman","country":"USA","year":2023,"file":"match-year: 2023 report","body":"Good ball control and balance. Low center of gravity. Very smart off-ball movement and good tactical understanding. Very difficult to dis-possess. Good in tight spaces. When given some room to work with, can find a good pass. Showed flashes of good final third play. Very good pressing and defensive work-rate, takes good angles and pathways. Efficient in possession. Just a smart, effective, high technical quality and IQ striker.","category":null,"status":null,"role_name":"Poacher / Finisher"},{"dates":["08/21/2025"],"match":"Virginia Cavaliers vs San Diego St.","team":"Virginia Cavaliers","source":"Stream","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"10-AMF-10 1","jersey":10,"position":"AMF","position_full":"Attacking Mid","foot":null,"class":"Junior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5’11”, skinny build. Excellent technical quality. Excellent agility, feet, and stop-start ability. Smooth player and easy on the eye, always in control and poise/comfort on the ball. Lacks some 1v1 pop and acceleration but makes up for it with excellent ball control. Good in tight spaces where his ball control and agility standout. Presses hard and has good energy both ways. Tactically a step ahead and sound, and high soccer IQ, recognizes the space and has variety and timing with his movement. Efficient and plays with good tempo and rhythm. Pace is just okay and doesn’t excel in transition moments due to lack of explosion and lower body drive. Has a final ball but final product and play is inconsistent. Excellent technically and tactically that needs to show production and final third polish to project. Ideal 10 at the next level, can be a winger that comes inside, possible 2nd striker with an athletic vertical partner. (AJ)","category":null,"status":null,"role_name":"Enganche (Playmaker #10)"}]},{"key":"marius stenner","name":"Marius Stenner","class":"Sophomore","position":"LW","positions":["LW"],"position_full":"Left Wing","foot":"Left","country":"Denmark","dob":null,"team":"Delaware","school":"Delaware","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025,2026],"year":2026,"category":null,"status":null,"rolenum":11,"n_reports":2,"reports":[{"dates":["09/28/2025","09/10/2025"],"match":"Delaware vs UMass","team":"Delaware","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"11-W1","jersey":11,"position":"LW","position_full":"Left Wing","foot":null,"class":"Sophomore","country":"Denmark","year":2025,"file":"match-year: 2025 report","body":"6’0”, lean-to-stocky build. Good pace with above-average stride length; quick 3–5 yd burst, rides contact, and explodes out of tight spaces, though lacks elite top-end separation. Excellent balance. Strong in the air with a solid lower-body base and stability. Strong overall and shields well. Low center of gravity, clean feet, secure first touch. Good ball control and manipulation; very left-footed. Bright, lively, direct, and active. Consistently threatens back lines in 1v1s and will recycle if the numbers aren’t favorable. Effective between the lines but can overdribble in tight areas. Has a change of pace and shoulder dip to gain a yard onto his left; limited 1v1 repertoire beyond that. Threatens both shoulders but prefers to come inside. Right foot is serviceable. Can play as an inside pocket player—ball security and technical quality are there. Final product is consistent, underpinned by simple, effective final third decisions and excellent, powerful left-footed ball striking. Slight tendency to mis-hit crosses or shots across his body, but provides strong in-swing delivery when cutting inside. Threatens in behind off the outside shoulder to create space to cut-in; rarely runs in behind off the FB’s inside shoulder without the ball. Does the defensive work. Will drop to show to feet and link; can spin a defender inside, but vision and final pass aren’t there. Current borderline MLS starter with scope to grow into an genuine MLS starter with further physical development. (AJ)","category":null,"status":null,"role_name":"Chalk-on-Boots Winger"},{"year":2026,"grade":"B/B","grade_present":"B","grade_future":"B","position":"LW","position_full":"Left Wing","foot":"Left","dates":["09/01/2026"],"match":"Georgetown","source":"Video","role_code":"7-W1","role_name":"Chalk-on-Boots Winger","jersey":7,"body":"Liked him last year, still do. Has excellent ability to ride contact and glide by defenders when dribbling with the ball along with excellent left footed technique to apply final product with shot and pass. Has taken a bit of a step back production wise from last year, tends to hold onto the ball too long and try too much when building out the back, could be a team over reliance on him issue, where hes just trying too much, doesnt seem like he is surrounded by much. Keep monitoring but definitely a USL player for me. Thought he was fringe MLS last year but hes taken a step back.","class":"Sophomore","country":"Denmark","team":"Delaware","status":null,"file":"manual entry"}]},{"key":"marten bakkan","name":"Marten Bakken","class":"Sophomore","position":"CAM","positions":["CAM"],"position_full":"Attacking Mid","foot":null,"country":"Norway","dob":null,"team":"Dayton","school":"Clemson (Tr from Dayton)","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2024],"year":2024,"category":null,"status":null,"rolenum":10,"n_reports":1,"reports":[{"dates":["11/09/2024","10/27/2024"],"match":"Dayton vs Davidson","team":"Dayton","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"10-AMF-10 1","jersey":10,"position":"CAM","position_full":"Attacking Mid","foot":null,"class":"Sophomore","country":"Norway","year":2024,"file":"match-year: 2024 report","body":"6’0”, lean build. Smooth and fantastic operator. Always in control and has some panache and tempo to his game. Finds some excellent areas when he starts centrally and can drift out-wide into pockets and check down to support the 6s in the build. High level tactical quality. Final third play is polished. Always makes the right decision and rarely has cheap turnovers in the final third. Not a player who can really pick locks and open defenses with his passing and vision, and did struggle vs low blocks. Is more of a box-box shuttler, where he uses his movement to find pockets and space to pull defenders out and then will play with tempo to exploit the space and keep the ball moving to the goal-scorers. Always provides in option in the final third and connects the backline and double-pivot with the front 4. Can find a final ball when presented the chance but doesn’t have elite vision. Always provides an option for cutbacks and makes late 3rd man runs into the box. Unique profile. USL C starter/USL C bench. (AJ)","category":null,"status":null,"role_name":"Enganche (Playmaker #10)"}]},{"key":"mason abdella","name":"Mason Abdella","class":"Sophomore","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"USA","dob":null,"team":"Utah Valley","school":"Utah Valley","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":6,"n_reports":1,"reports":[{"dates":["10/24/2025","10/12/2025"],"match":"Utah Valley vs UNLV","team":"Utah Valley","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Sophomore","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6’0”, skinny build. Average pace and power. Lacks strength and physicality but good in the air. Good mobility and energy. Slight stiffness in the movement profile that shows mostly defensively. Soft feet. Excellent technical quality. Knows where the ball is going before he receives it and always makes himself available. Excellent connector with good speed of play. Comfortable and composed on the ball, in and out of tight spaces, with a bit of flair and trickery to get out. Strong ball manipulation in tight spaces. Excellent feel for the game and soccer IQ. Limited ball-progression and passing range; can play forward slightly more often. Overhits longer range passes. Defensively, effective when patient and moving his feet—uses sharp feet and IQ to time challenges. Struggles when he dives in or tries to out-muscle players. Needs to polish the defensive profile but has shown promising signs. In the final third and off the dribble, can play too fast for his decision-making and execution. Transfer from JUCO. (AJ)","category":null,"status":null,"role_name":"True #6 (Double Pivot)"}]},{"key":"matthew henderson","name":"Matthew Henderson","class":"Senior","position":"LB","positions":["LB"],"position_full":"Left Back","foot":null,"country":"Scotland","dob":null,"team":"Penn State","school":"Penn State","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":5,"n_reports":1,"reports":[{"dates":["11/08/2025"],"match":"Penn State vs Michigan","team":"Penn State","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"5-FB1","jersey":5,"position":"LB","position_full":"Left Back","foot":null,"class":"Senior","country":"Scotland","year":2025,"file":"match-year: 2025 report","body":"5’10’’ with a lean, solid build. Good feet and clean footwork, with solid strength and physicality. Agile in tight spaces with good balance in duels. Has a solid burst and solid pace, with an even better change of pace. Clean left-footed ball-striker with good texture. Sharp and solid in defensive duels and 1v1 defending. Doesn’t overpower opponents but defends with good timing and control. Strong in tight spaces and able to pass out of sticky spots along the sideline. Good circulation, very clean passing and reliable playing out from the back. Can find forward entries into the 9’s feet and occasionally clip balls in behind when pressure arrives. Shows good IQ and feel for the game. Projects forward well, and could do it more often, but when he does the timing is good. Combines well in the final third. Provides solid service, though precision and quality are variable at times; has the technique to deliver more consistent quality at the next level. Good across all three tools. Projects as a USL Championship starter/bench profile. (AJ)","category":null,"status":null,"role_name":"Wing Back"}]},{"key":"max broughton","name":"Max Broughton","class":"Grad Student","position":"RCB","positions":["RCB"],"positio ot":null,"class":"Senior","country":"Kenya","year":2023,"file":"match-year: 2023 report","body":"Great athlete. Physically strong with thick legs. Really good lung capacity - plays all over the field. Has high technical quality, good vision for the pass, good soccer IQ and is okay tempo setter. Is very strong into the tackle and covers a lot of ground. Good range of passing. Is a threat in the box as well, runs the box well. Is a very well-rounded soccer player.","category":null,"status":"Graduated","role_name":"Single Pivot Holder"}]},{"key":"mikkel goeling","name":"Mikkel Goeling","class":"Junior","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"Denmark","dob":null,"team":"UC Santa Barbara Guachos","school":"UC Santa Barbara Guachos","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2023],"year":2023,"category":null,"status":"Graduated","rolenum":6,"n_reports":1,"reports":[{"dates":["08/25/2023"],"match":"UC Santa Barbara Guachos vs Oral Roberts Golden Eagles","team":"UC Santa Barbara Guachos","source":null,"grade":"B/B","grade_present":"B","grade_future":"B","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Junior","country":"Denmark","year":2023,"file":"match-year: 2023 report","body":"Smooth. Great technique and vision for the pass. Gets the angles right. Big, strong, frame at 6’3”. Has the ability to crunch one. Reads the game well. Can hit every pass on the field. Can be a better tempo setter. Sometimes plays a bit slow for my liking. Really solid though. Love the technique and ball-striking with both feet.","category":null,"status":"Graduated","role_name":"True #6 (Double Pivot)"}]},{"key":"miles bonham","name":"Miles Bonham","class":"Junior","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":null,"dob":null,"team":"Dayton","school":"Dayton","intl":false,"grade":" with pass and shot is still developing. Transfer from Virginia Tech (AJ)","category":null,"status":null,"role_name":"Inverted Winger"}]},{"key":"nathan richmond","name":"Nathan Richmond","class":"Senior","position":"LW","positions":["LW"],"position_full":"Left Wing","foot":null,"country":"USA","dob":null,"team":"Clemson Tigers","school":"Clemson Tigers","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":11,"n_reports":1,"reports":[{"dates":["08/21/2025"],"match":"Clemson Tigers vs Indiana University","team":"Clemson Tigers","source":"Stream","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"11-W1","jersey":11,"position":"LW","position_full":"Left Wing","foot":null,"class":"Senior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5’7”, skinny build. Great feet, low center of gravity, lively. Top-end pace and acceleration. Legit separation and acceleration from defenders. Can come inside to provide forward running the half-spaces but has the pace to stay wide and get down the line. Tracks 2nd balls surprisingly well and likes to float into the half-spaces to pick up 2nd balls and drive at backlines. Back to goal profile is just okay. Only looks to spin defenders and lack of size means he can get nudged off the ball easily. Not the cleanest between the lines. Lacks some ball security and retention, can play too fast for his technical quality. Excellent first step and nose for the ball. Excellent off-ball movement in-behind, cutting inside and getting in-behind the FBs shoulder, especially when the FB pushes higher in attacking phases. Small stature and shorter strides mean he has a propensity to get shots and crosses excessively blocked. Excellent left foot and good technique. Technically sound. Can struggle to explode and get out tight spaces when defenders get tight on him but can also exploit a yard of space with his technique and pace. USL starter/bench. (AJ)","category":null,"status":null,"role_name":"Chalk-on-Boots Winger"}]},{"key":"nick fernandez","name":"Nick Fernandez","class":"R-Junior","position":"CAM","positions":["CAM"],"position_full":"Attacking Mid","foot":null,"country":"USA","dob":null,"team":"Portland","school":"Portland","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2024],"year":2024,"category":null,"status":"25 Dr San Jose","rolenum":8,"n_reports":1,"reports":[{"dates":["11/10/2024","10/31/2024"],"match":"Portland vs San Diego","team":"Portland","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"8-CMF-8 3","jersey":8,"position":"CAM","position_full":"Attacking Mid","foot":null,"class":"R-Junior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5’11”, skinny build. Soccer athletic. Good change of pace and burst. Has some getaway speed. Great feet and agility. Good pace. Okay strength, poor jumper, below-average power. Technically sound. Soft feet. Has touch, feel, and texture with his ball striking. Smooth. Easy on the eye. Glides with the ball. Excellent technique. Excellent progressive passing and dribbling ability. Plays forward. Good in tight spaces on the half-turn and facing goal. Can struggle with back to goal and is more turnover prone. Processes the game, excellent feel and tactical understanding. High IQ. Makes good decisions. Sees the game. Plays a step ahead and with speed. Can operate at multiple speeds. Has vision and execution for the final ball. Can be slightly inconsistent. Final product is there and can threaten goal from longer distances with his excellent right foot. Fantastic weight and timing with his passes. Defensively can improve. Has the athletic tools and pace but can be more patient and tackle with more bite. Has struggled when games are more stretched and vertical. Off-ball movement into pockets can be more dynamic. Can create more space for himself with his movement. Would benefit from playing slightly deeper at the next level. Not a 10 and has been played slightly out of position at Portland as a 10. More of an 8/6 in a double pivot 433. Could be a 6 but you want his final ball as well. Ideal 8 that can play in both-halves, support the 6 and 10. Unique profile. (AJ)","category":null,"status":"25 Dr San Jose","role_name":"Jack of All Trades"}]},{"key":"nikos clarketosczak","name":"Nikos Clarke-Tosczak","class":"Junior","position":"LCB","positions":["LCB"],"position_full":"Left Center Back","foot":null,"country":"Canada","dob":null,"team":"Portland","school":"Portland","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":5,"n_reports":2,"reports":[{"dates":["10/10/2025"],"match":"Portland vs San Diego","team":"Portland","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"5-FB1","jersey":5,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"Junior","country":"Canada","year":2025,"file":"match-year: 2025 report","body":"5’10”, solid build. Good feet and size. Strong and good pace. Moves well laterally. Defends 1v1 patiently with timing into the challenge. Projects forward cleanly with clean technique and ball-striking that capable of delivering high quality service. (AJ)","category":null,"status":null,"role_name":"Wing Back"},{"dates":["10/10/2025"],"match":"Portland vs San Diego","team":"Portland","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"5-FB1","jersey":5,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"Junior","country":null,"year":2025,"file":"match-year: 2025 report","body":"5’10”, solid build. Good feet and size. Strong and good pace. Moves well laterally. Defends 1v1 patiently with timing into the challenge. Projects forward cleanly with technique and ball-striking that can deliver high quality service. (AJ)","category":null,"status":null,"role_name":"Wing Back"}]},{"key":"noah james","name":"Noah James","class":"Junior","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":"Right","country":"USA","dob":null,"team":"San Diego","school":"San Diego","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025,2026],"year":2026,"category":null,"status":null,"rolenum":6,"n_reports":2,"reports":[{"year":2025,"grade":"B/B","grade_present":"B","grade_future":"B","position":"CDM","position_full":"Defensive Mid","foot":null,"dates":["10/10/2025"],"match":"San Diego vs Portland","source":"Video","role_code":"6-CMF-6 1","role_name":"True #6 (Double Pivot)","jersey":6,"body":"6’4”, skinny build. Good feet for size. Movement is on the stiffer side but strong engine and work-rate, solid pace and acceleration. Longer stride length helps cover ground in transition and sideline to sideline. Two-footed connector with good speed of play and IQ. Soft feet and doesn’t waste a pass. Consistently makes himself available in the pocket. Defensively accountable and plugs gaps despite average duel-winning. Can pick a final pass when given time and space, strong diagonal, solid passing range. Good technique. Technically sound. Has a bit of composure and calmness in the pocket. Shades of Liam O’Gara. Transfer from Western Michigan. (AJ)","class":"Junior","country":"USA","team":"San Diego","status":null,"file":"manual entry"},{"year":2026,"grade":"C/B","grade_present":"C","grade_future":"B","position":"CDM","position_full":"Defensive Mid","foot":"Right","dates":["09/01/2026"],"match":null,"source":"Video","role_code":"6-CMF-6 3","role_name":"Athletic Destroyer","jersey":6,"body":"Big size and frame. For me has taken a step back this year and probably being played out of position. Likely a CB at the next level, just doesnt have the agility/stop start to play CDM at the next level given his size and frame. When facing forwards with time and space can play forward, has good passing range and technique. Good progressive dribbler who can drive into space. Average in duels beyond using his length, timing and technique are just okay, prone to fouling. Good pace, excellent engine and defensive range. Strong in the air. Poor in tight spaces and side to side agility are just okay.","class":"Junior","country":"USA","team":"San Diego","status":null,"file":"manual entry"}]},{"key":"noe uwimana","name":"Noe Uwimana","class":"Junior","position":"RWB","positions":["RWB","RB"],"position_full":"Right Wingback","foot":null,"country":"USA","dob":null,"team":"Virginia Tech","school":"Virginia Tech","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2023,2025],"year":2025,"category":null,"status":null,"rolenum":2,"n_reports":2,"reports":[{"dates":["09/03/2023"],"match":"Virginia Tech. vs Davidson Wildcats","team":"Virginia Tech.","source":null,"grade":"B/B","grade_present":"B","grade_future":"B","role_code":"2-FB1-2","jersey":2,"position":"RWB","position_full":"Right Wingback","foot":null,"class":"Freshman","country":"USA","year":2023,"file":"match-year: 2023 report","body":"Solid game from him. Good athleticism, good passing, good technique, solid defensively. Was dangerous with his service and assisted the lone goal with a very nice move to the byline and chipped cut-back. Had an assist last game versus Loyola-MD. Only a freshman, one to keep an eye on.","category":null,"status":null,"role_name":"Wing Back"},{"dates":["10/04/2025","09/30/2025"],"match":"Virginia Tech vs Notre Dame","team":"Virginia Tech","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"2-FB1","jersey":2,"position":"RB","position_full":"Right Back","foot":null,"class":"Junior","country":null,"year":2025,"file":"match-year: 2025 report","body":"5’10”, thick solid build. Physical, pace, strong. Great feet for size. Simple out the back with good right footed technique. Combines out of tight spaces. Doesn’t dive in 1v1 and moves feet, but lateral movement is just average. Okay in the air, jump timing and ball-tracking are below-average. Projects forward cleanly into the final third and combines well once there. Solid service with both feet. High IQ. 1v1 profile is dip of the shoulder and change of pace. Polished with all three tools. Potential MLS starter. (AJ)","category":null,"status":null,"role_name":"Wing Back"}]},{"key":"pedro faife","name":"Pedro Faife","class":"Junior","position":"CM","positions":["CM"],"position_full":"Central Mid","foot":null,"country":"USA","dob":null,"team":"USF Bulls","school":"USF","intl":false,"grade":"B/A","grade_val":10,"grade_val_present":7,"grade_present":"B","grade_future":"A","years":[2025],"year":2025,"category":null,"status":null,"rolenum":8,"n_reports":1,"reports":[{"year":2025,"grade":"B/A","grade_present":"B","grade_future":"A","position":"CM","position_full":"Central Mid","foot":null,"dates":["09/05/2025","09/01/2025"],"match":"USF Bulls vs UCF Knights","source":"Video","role_code":"8-CMF-8 3","role_name":"Jack of All Trades","jersey":8,"body":"5’10, lean, solid build. Excellent feet. Strong and sturdy with outstanding balance. Exceptional soccer IQ. Genuinely makes everyone around him better. Combines defensive bite, technique, and balance in the challenge with composure and control of tempo on the ball. Fantastic balance, timing, and bite in duels, though can lack some force and power. Good in the air. Operates comfortably at multiple speeds, drifting into pockets and linking play phenomenally well. Not a strong ball progressor with his passing and lacks final product, but brings exceptional cleanliness and the ability to run the game in midfield. An incredibly simple player. Rarely, if ever, turns the ball over or makes a poor decision. Functions as a true box-to-box shuttler, consistently feeding the front three or four. Shows a special feel for the game and outstanding intelligence. Has also flashed box-to-box presence in the final third, though this remains an area for growth. If he can add more ball progression and a final pass, he has the tools to become an elite player with genuine European potential. An ideal No. 8 in a 4-3-3, capable of unlocking the front three and dictating the game. Can also serve as a second holder in a double pivot, operating slightly higher up the pitch. Inter Miami Academy. (AJ)","class":"Junior","country":"USA","team":"USF Bulls","status":null,"file":"manual entry"}]},{"key":"remi okunlola","name":"Remi Okunlola","class":"Sophomore","position":"RB","positions":["RB"],"position_full":"Right Back","foot":null,"country":"USA","dob":null,"team":"Clemson Tigers","school":"Clemson Tigers","intl":false,"grade":"B/A","grade_val":10,"grade_val_present":7,"grade_present":"B","grade_future":"A","years":[2024,2025],"year":2025,"category":null,"status":null,"rolenum":2,"n_reports":2,"reports":[{"dates":["08/30/2024"],"match":"Clemson Tigers vs South Carolina Gamecocks","team":"Clemson Tigers","source":"Live","grade":"B/B-","grade_present":"B","grade_future":"B-","role_code":"2-FB1","jersey":2,"position":"RB","position_full":"Right Back","foot":null,"class":"Junior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5’11”, lean build. Long legs and lanky. Wiry. Smooth runner and good technical quality. Good soccer IQ and picks his moments to project forward. Good tactical understanding and positional understanding with the RW. Has a bit of 1v1 ability and a bit of flair. Can provide service and has good technique. Final product, crossing accuracy and potency is still developing. Did waste a few good chances to provide service. All-around very solid technically and tactically with athletic upside. (AJ)","category":null,"status":null,"role_name":"Wing Back"},{"year":2025,"grade":"B/A","grade_present":"B","grade_future":"A","position":"RB","position_full":"Right Back","foot":null,"dates":["08/21/2025"],"match":"Clemson Tigers vs Indiana University","source":"Stream","role_code":"2-FB1","role_name":"Wing Back","jersey":2,"body":"5’11”, lean build. Technically sound with good technique. Medium-long strides and smooth runner. Projects forward cleanly but final product is still developing. Strong in the air. Good lower body drive and power. High soccer IQ and polished decision-maker. Average ball-progression with the pass, has a good channel ball and plays simple, won’t find many line-splitting entries. Polished 1v1 defender who can deal with some of the quicker wingers in the country thanks to his longer strides, fluid hips, and good lower body drive. Solid feet. Technically and tactically solid with athletic upside. High IQ and good feel for the game. MLS FB. (AJ)","class":"Sophomore","country":"USA","team":"Clemson Tigers","status":null,"file":"manual entry"}]},{"key":"ricky louis","name":"Ricky Louis","class":"Sophomore","position":"LW","positions":["LW"],"position_full":"Left Wing","foot":null,"country":"USA","dob":null,"team":"Georgia Southern","school":"Georgia Southern","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":11,"n_reports":1,"reports":[{"year":2025,"grade":"B/B","grade_present":"B","grade_future":"B","position":"LW","position_full":"Left Wing","foot":null,"dates":["10/11/2025","10/05/2025"],"match":"Georgia Southern vs UCF","source":"Video","role_code":"11-W1","role_name":"Chalk-on-Boots Winger","jersey":11,"body":"6’2”, thick, solid build. Excellent pace and acceleration—gets separation both off the dribble and in space. Explosive first few steps. Thickness, balance, and strength let him ride contact in tight areas and when driving. Fluid, loose athlete. Technically sound with clean feet, though he can struggle in tight pockets between the lines; his sturdiness and pop often compensate. Has some confidence, poise and aggression on and off the ball. Active and lively off the ball. Willing to check deep to receive to feet and link or be direct/vertical and isolate the FB 1v1/drive at backlines. Tactically sound with good feel for the game. Can also threaten off the shoulder and in behind. Combines well in the final third and between the lines with simple connections and 1-2s—passes and moves. Excellent 1v1 burst to beat defenders down the line, and he can cut inside onto his favored right. The 1v1 profile is mostly a dip of the shoulder and change of pace, but it’s effective with his physical tools and he isn’t overly right-footed. Speed of play is inconsistent and could be quicker; feet can tangle and he’ll drop his head in traffic, leading to cheap turnovers—not a major concern. Clean ball striker with end product; a threat to shoot in the final third. Final ball is average, and he could provide more service when cutting inside—tends to play simple combinations or recycle play. Delivery on the weaker left needs to improve and would truly round out his 1v1 threat. At full speed he can play slightly too fast for his processing and technical quality, but once he hits top gear, he’s hard to stop and tough to dispossess. Can play all-across the front three, both wings and 9, but best at winger. All three tools with physical upside and end product – above average USL C starter with MLS upside. (AJ)","class":"Sophomore","country":"USA","team":"Georgia Southern","status":null,"file":"manual entry"}]},{"key":"riyon tori","name":"Riyon Tori","class":"Junior","position":"CM","positions":["CM"],"position_full":"Central Mid","foot":null,"country":"Japan","dob":null,"team":"Charlotte 49ers","school":"Charlotte 49ers","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2023],"year":2023,"category":null,"status":"24 Dr Orlando","rolenum":6,"n_reports":1,"reports":[{"dates":["09/20/2023"],"match":"Charlotte 49ers vs Davidson Wildcats","team":"Charlotte 49ers","source":null,"grade":"B/B","grade_present":"B","grade_future":"B","role_code":"6-CMF-6 1","jersey":6,"position":"CM","position_full":"Central Mid","foot":null,"class":"Junior","country":"Japan","year":2023,"file":"match-year: 2023 report","body":"Fantastic vision. Breaks lines for fun. Can hit any pass. Great technique. High IQ. Can get over-shadowed by Charlotte’s style of play (the Stanford model), but when he gets on the ball, he can create. He is instrumental for when they pin teams in their own half, and he starts breaking lines and spraying the ball around. Can get out of things. Super technical, smart, creative midfielder","category":null,"status":"24 Dr Orlando","role_name":"True #6 (Double Pivot)"}]},{"key":"ruben mesalles","name":"Ruben Mesalles","class":"Senior","position":"LB","positions":["LB"],"position_full":"Left Back","foot":null,"country":"USA","dob":null,"team":"Duke","school":"Duke","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2024],"year":2024,"category":null,"status":"24 Dr RSL","rolenum":5,"n_reports":1,"reports":[{"dates":["11/07/2024"],"match":"Duke vs California","team":"Duke","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"5-FB2","jersey":5,"position":"LB","position_full":"Left Back","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6’0”, skinny build. Great agility and stop-start ability. Good pace. Good first step. Quick feet. Easy on the eye. Technique is fantastic. Sweet left-foot. Smooth on the ball. Plays with tempo and a step ahead. Technically sound. Composure on the ball. Soccer IQ and tactical understanding are top. Always makes the right decision. High level processing. Can see pressure coming and play out before it comes. Projects forward well. Picks his spots. Vision for the forward pass. Can break a line on the ground. Can play forward consistently and has good progressive passing. Great range of passing. Always in control and always makes the right decision. Sharp into the challenge and reads the game excellently. Unique profile. IMG Academy. MLS bench/USL Championship starter. (AJ)","category":null,"status":"24 Dr RSL","role_name":"Inverted Fullback"}]},{"key":"sabri hanni","name":"Sabri Hanni","class":"Sophomore","position":"CAM","positions":["CAM"],"position_full":"Attacking Mid","foot":null,"country":"France","dob":null,"team":"UConn","school":"Grand Canyon","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2024],"year":2024,"category":null,"status":null,"rolenum":8,"n_reports":1,"reports":[{"dates":["11/02/2024","10/26/2024"],"match":"UConn vs Akron","team":"UConn","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"8-CMF-8 1","jersey":8,"position":"CAM","position_full":"Attacking Mid","foot":null,"class":"Sophomore","country":"France","year":2024,"file":"match-year: 2024 report","body":"5’7”, stocky, thick build. Good athlete. Gets around. Great feet. Has some burst and acceleration. Good pace. Strong w/ good balance. Technically sound. Good technique. Great left-foot. Lively and finds good pockets all over the field. Makes an impact defensively and breaks up a lot of play and passes. Steps out to fullbacks aggressively, is willing to tackle and make plays defensively. Great presser. Plays with tempo and speed. Processes it a step ahead. True box-to-box shuttler. Someone who connects the backline and 6s to the front line with his movement and passing. Simple player but in a good way. Has flashed some final product. Won’t kill you with the pass, dribble or shot in the final third but excellent between the lines. High-level set-piece service. Tactically, technically, and physically sound. High soccer IQ. Makes good decisions. Doesn’t turn it over. Unique profile, 4 Dr Philadelphia","role_name":"Box-to-Box Grinder"},{"dates":["08/24/2025"],"match":"Stanford vs Denver","team":"Stanford","source":"Stream","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"8-CMF-8 1","jersey":8,"position":"RM","position_full":"Right Mid","foot":null,"class":"Senior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5’11”, skinny build. Great pace with medium-long strides. Average feet can get a bit tangled. Slightly stiff. Fantastic work-rate and engine. Slightly awkward running style. Poor upper body strength, and okay lower body drive, solid pop and explosion, but high baseline level of consistent pace. Excellent stop-start ability with average change of direction and horizontal agility. Technically sound. Excellent left foot that strikes the ball cleanly, with power, curve, and dip. Direct set-piece threat from 20-30 yds out and provides above-average set-piece service. Solid weaker right foot. Efficient and simple player in-possession and off the ball. Provides relentless running into the channel and half-spaces, always playing off the shoulder and getting in-behind. Crashes the box late on the far-post and centrally in transition moments. Excellent speed of play and has a bit of forward ball-progression with the pass. Good dribbler, carries well, good ball manipulation and close ball control. Lacks elite and unique attributes in terms of creativity, vision, or technical quality but very effective with his tools. Rarely will come inside or drift centrally with his movement. Provides quality service from the wide areas with both feet. Below-average ability to support deep build outs with his back to goal, will provide an outlet in-behind for direct play in the build consistently, however. Excellent presser that uses the proper angles and sharp into the duel. Will work down to provide cover for the FB. Just okay in tight spaces where his slight stiffness and average feet hurt him. Likely not clean enough consistently to play in the pocket as an 8 at the next level, unless in a direct high pressing team that largely doesn’t look to play between the lines. A bit of a throwback true outside midfielder in a 442 that plays both ways while providing attacking output. Can be a winger in a 433. Ideal 10 in a 3421 and 3412 where his late movement in-behind into the channels and engine would shine. Can play on both wings. Unique profile with simple tools but high floor. Has scored a handful of clutch goals for Stanford over the years. Solid final product and is an above-average finisher. MLS bench/USL C starter. (AJ)","category":null,"status":null,"role_name":"Box-to-Box Grinder"}]},{"key":"andres escudero","name":"Andres Escudero","class":"Freshman","position":"FWD","positions":["FWD"],"position_full":"FWD","foot":null,"country":"Spain","dob":null,"team":"Evansville","school":"Louisville","intl":true,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":9,"n_reports":1,"reports":[{"dates":["11/06/2025"],"match":"Evansville vs Belmont","team":"Evansville","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"9-FWD2","jersey":9,"position":"FWD","position_full":"FWD","foot":null,"class":"Freshman","country":"Spain","year":2025,"file":"match-year: 2025 report","body":"6’1”, lean build. Solid pace, okay physicality. Good, quick, soft feet. Technically sound. Strong ball control and manipulation to create his own space to apply his excellent final product and technique. Can spin a defender between the lines using his frame and ball control but won’t provide much physicality up top. Poor in the air and below-average hold up play. Excellent craft around the box to finish or create an attacking moment. Okay link up play and dialogue with the midfielders between the lines. Good IQ and movement into the channels and in-behind. Okay movement into pockets. Two foo file":"match-year: 2025 report","body":"5’10”, stocky, medium build. Excellent feet. Bright and active player. Has a good initial burst and acceleration, solid pace. Excellent technique and ball striking. Very turnover prone with back to goal and certainly tries certain passes and touches which are low percentage at the expense of producing the spectacular. Has good vision, final pass, and product, which makes him dangerous with the ball in a variety of positions in the final third. Good link up play and combination play in midfield. Great change of pace and rhythm in the attack. Decision-making needs much more maturity but has a unique skillset. (AJ)","category":null,"status":null,"role_name":"Enganche (Playmaker #10)"}]},{"key":"angel iniguez","name":"Angel Iniguez","class":"Senior","position":"CM/CAM","positions":["CM/CAM","CAM"],"position_full":"Attacking Mid","foot":null,"country":"USA","dob":null,"team":"San Jose St.","school":"San Jose St. Spartans","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2023,2025],"year":2025,"category":null,"status":null,"rolenum":8,"n_reports":2,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"C+/B-","grade_present":"C+","grade_future":"B-","role_code":"8-CMF-8 3","jersey":8,"position":"CM/CAM","position_full":"Central Mid / Attacking Mid","foot":null,"class":"Sophomore","country":null,"year":2023,"file":"match-year: 2023 report","body":"5’7”, skinny build. Solid athlete. Good technical quality. Good technique, passing, and dribbling. Is solid in tight spaces. Displays solid soccer IQ and tactical understanding. Solid vision and creativity, slightly above average. Has a good range of passing. Good connector and distributor, keeps the ball moving and is efficient in possession. Is clinical in and around the box, and the final product is solid. Doesn’t have the top end creativity you’d like at the 10, so would be best as an attack minded 8, who has enough athleticism to play both sides of the ball. Just a technically polished player who understands the game but lacks any elite or high level attributes to elevate his game to a B+ and above level (AJ).","category":null,"status":null,"role_name":"Jack of All Trades"},{"dates":["09/18/2025"],"match":"San Jose St. vs Stanford","team":"San Jose St.","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"8-CMF-8 3","jersey":8,"position":"CAM","position_full":"Attacking Mid","foot":null,"class":"Senior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5’7”, skinny build. Good engine and motor. Sharp feet. Technically sound, with good technique, passing and ball manipulation in tight areas. Good connector and distributor, keeps the ball moving and is efficient in possession. Has some quality around the box/final third, and final product is solid. Good link up play between the lines, and okay creativity, lacks a bit of final ball execution and vision for the final pass. Best as an attack minded 8 with some bite and sharp feet in the tackle/duel, good athlete and buzzes around the park well. Solid soccer IQ and tactical understanding, finds good pockets between the lines to link play. USL L1 starter/USL C bench. (AJ)","category":null,"status":null,"role_name":"Jack of All Trades"}]},{"key":"braden dunham","name":"Braden Dunham","class":"Freshman","position":"LCB","positions":["LCB"],"position_full":"Left Center Back","foot":null,"country":null,"dob":null,"team":"Furman","school":"Furman","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":4,"n_reports":1,"reports":[{"dates":["09/04/2025","09/01/2025"],"match":"Furman vs Davidson","team":"Furman","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"4-CB3","jersey":4,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"Freshman","country":null,"year":2025,"file":"match-year: 2025 report","body":"6’0”, 135 lbs, light build, left-footed CB with strong technical and passing profile. Very comfortable playing out, with vision, clean technique, and consistent progression through entry passes. Strikes the ball with variety and plays at good tempo, scanning well and using his full range. Defensively, only average in 1v1s — feet can be stiff and lateral agility limited. Stronger when facing play, stepping in aggressively and reading situations, but struggles more off the shoulder. Medium-long strides give him recovery pace, though he is average in the air and lacks lower-body strength, leaving him vulnerable to physical 9s. MLSNP experience at Atlanta showed both his composure on the ball and his 1v1 limitations. Projection: if he adds strength and sharper footspeed, has upside to reach top CB level. (AJ)","category":null,"status":null,"role_name":"Ball-Playing CB"}]},{"key":"brady treinen","name":"Brady Treinen","class":"Junior","position":"LB","positions":["LB"],"position_full":"Left Back","foot":null,"country":"USA","dob":null,"team":"UC Irvine","school":"UC Irvine","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":5,"n_reports":1,"reports":[{"dates":["09/18/2025","09/13/2025"],"match":"UC Irvine vs San Diego","team":"UC Irvine","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"5-FB1","jersey":5,"position":"LB","position_full":"Left Back","foot":null,"class":"Junior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6’0”, lean build. Agile with clean, soft feet and fluid hips. Has good pace but only an average engine and acceleration. Technically sound with a reliable first touch, clean passing, and solid ball striking. Consistently looks to play forward and can pass out of tight spaces. Good passing range with a strong, flat diagonal. Links play simply in possession and finds entries into the 9 and wingers’ feet. Speed of play can be quicker and more consistent—can be passive at times. Needs to drive and carry into space more often. Service is average; drops into a back three to help build but struggles to project forward from that role. When given license to push on, he can provide service and has the technique to deliver quality. Defensively, fluid hips and clean feet allow him to mirror attackers 1v1. However, average pace and burst limit his ability to get tight, often giving opponents an extra yard. Strong timing, good feet, and force in the tackle. Intelligent player with low turnovers, makes sound decisions in and out of possession, and shows good positioning across the back four. USL starter/bench. (AJ)","category":null,"status":null,"role_name":"Wing Back"}]},{"key":"brandon munson","name":"Brandon Munson","class":"Sophomore","position":"LB","positions":["LB"],"position_full":"Left Back","foot":null,"country":"USA","dob":null,"team":"Michigan St.","school":"Michigan St","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":5,"n_reports":1,"reports":[{"dates":["09/20/2025","09/13/2025"],"match":"Michigan St. vs Ohio State","team":"Michigan St.","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"5-FB1","jersey":5,"position":"LB","position_full":"Left Back","foot":null,"class":"Sophomore","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5'10\", stocky, solid build with a thicker lower body. Solid pace with a good 3–5 yd burst, average separation in open space. Strong in the air with above average jumping. Clean feet with slightly above average lateral agility and above average vertical stop start. Technically sound with excellent body shape when receiving to play and to dribble forward. Connects fluidly out of the back with a solid speed of play. Fairly reliable in tight spaces and can connect out of pressure. Okay off the dribble and when carrying into space. Projects forward cleanly with timing at times but not frequently. Final third product remains to be seen. Early signs are limited, with a standard outswinger into the mixer that is more floated than driven. Sharp and tough into the tackle with timing and bite. Gets overly divey when defending 1v1 in space. Best when he can close space early and use his timing into tackles rather than rely on athletic tools when defending larger spaces. Needs to improve here. Has shades of Tate Johnson with a slightly better athletic base. Some room to grow physically and in the final third, but the baseline is there. Suffered an ankle injury on 2024-09-20 vs Ohio State and has been out since. (AJ)","category":null,"status":null,"role_name":"Wing Back"}]},{"key":"charlie harper","name":"Charlie Harper","class":"Junior","position":"LCB","positions":["LCB"],"position_full":"Left Center Back","foot":null,"country":"Australia","dob":null,"team":"North Carolina","school":"North Carolina","intl":true,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2024],"year":2024,"category":null,"status":"25 Dr Colorado 38th","rolenum":4,"n_reports":1,"reports":[{"dates":["11/02/2024","10/28/2024"],"match":"North Carolina vs Stanford","team":"North Carolina","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"4-CB1","jersey":4,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"Junior","country":"Australia","year":2024,"file":"match-year: 2024 report","body":"6’2”, lean build. Good athlete all-round. Good pace. Good in the air. Below-average stiffness, good fluidity. Good frame and size. Robust defender. Doesn’t follow attackers between the lines but instead steps as they receive and nudges or pokes the ball away. Shows good balance and agility. Moves his feet when defending 1v1 and can move laterally. Doesn’t dive in. Covers depth well. Solid positioning and reading of the game. Doesn’t have any real holes, just above-average all-around. Technically sound and clean on the ball. Doesn’t see the entry, however. Strictly side to side. Can’t slip a ball between the lines or pick a lock. Will be a problem at the pro-level if he wants truly make the jump. Just doesn’t have it. Passing range is poor. Doesn’t hit the diagonal. Very two-footed. More right-footed but left-foot is solid. Very solid but nothing special. Ceiling is above-average MLS starter for multiple years. MLS Bench/USL Championship starter right now. (AJ)","category":null,"status":"25 Dr Colorado 38th","role_name":"Leader of the Line"}]},{"key":"colin veltri","name":"Colin Veltri","class":"Senior","position":"LW","positions":["LW"],"position_full":"Left Wing","foot":null,"country":"USA","dob":null,"team":null,"school":"WyScout Video Report","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2024],"year":2024,"category":null,"status":null,"rolenum":11,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"11-W1","jersey":11,"position":"LW","position_full":"Left Wing","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5'10\", skinny build. Good feet. Good pace. Great acceleration. Okay power. Has some pop and burst. Direct and vertical winger. Has some 1v1 feints and drops of the shoulder. Technically okay. Okay in tight spaces, not great with his back to goal. Good final product. Average soccer IQ. Good movement in-behind and threatens off the shoulder consistently.","category":null,"status":null,"role_name":"Chalk-on-Boots Winger"}]},{"key":"collins oduro","name":"Collins Oduro","class":"Sophomore","position":"LW","positions":["LW"],"position_full":"Left Wing","foot":null,"country":"Ghana","dob":null,"team":"Indiana University","school":"Indiana University","intl":true,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":11,"n_reports":1,"reports":[{"dates":["08/21/2025"],"match":"Indiana University vs Clemson Tigers","team":"Indiana University","source":"Stream","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"11-W1","jersey":11,"position":"LW","position_full":"Left Wing","foot":null,"class":"Sophomore","country":"Ghana","year":2025,"file":"match-year: 2025 report","body":"6’0, lean build. Excellent pace and power. Smooth, easy runner, with separation and acceleration. Fantastic in open space where his acceleration and pace shines. Great straight-line speed with average change of direction and agility. Technically solid, can be loose in tight spaces. Has soft feet when receiving entries allowing him to turn out of tight spaces and spin defenders, even if he largely wants to cut inside. General decision-making can use some polish and is still learning when to play simple and when to use his athletic and technical tools to go 1v1 and towards goal. Same issue in the final third. Final product lacks polish and attention to detail. 1v1 profile consists of a strong change of pace and a dip of the shoulder. Can struggle to provide an outlet in transition or drive transitions out of low/mid blocks, link up play with the 9 and 10 need polish. Uses the 1-2 nicely with the ball, however. Can take defenders down the line as well but is very right footed. Poor weak foot that he doesn’t look to use. Great defensive IQ and consistently works down and provides defensive support. Stays wide to the touchline in final third build phases to receive to feet and attack the FB 1v1 on the inside. Excellent work-rate and engine. Solid movement in-behind but can threaten off the shoulder more off the ball. Supports deeper build out phases with back to goal play adequately, can link back-line/CMs to forward line better with more checking down and better link up play with the pass. Needs tactical, final product, and a bit of technical polish, but has all the tools. Left foot is a concern. USL C starter/bench. Right to Dream Academy. (AJ)","category":null,"status":null,"role_name":"Chalk-on-Boots Winger"}]},{"key":"cooper flax","name":"Cooper Flax","class":"Senior","position":"CAM","positions":["CAM","CM"],"position_full":"Central Mid","foot":null,"country":"USA","dob":null,"team":"Wake Forest","school":"Wake Forest Deamon Deacons","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2024,2025],"year":2025,"category":null,"status":null,"rolenum":8,"n_reports":3,"reports":[{"dates":["09/14/2024"],"match":"Wake Forest Deamon Deacons vs Virginia Cavaliers","team":"Wake Forest Deamon Deacons","source":"Live","grade":"C/B-","grade_present":"C","grade_future":"B-","role_code":"8-CMF-8 3","jersey":8,"position":"CAM","position_full":"Attacking Mid","foot":null,"class":"Junior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6’0. Skinny build. A bit scrawny. Good energy. Buzzes around the park. Good lung capacity. Finds good pockets. Good motor and engine. Always moving. Technical quality to make the jump to the next level is there. Fantastic right foot. Scored a fantastic free-kick from 35yds out, top left corner. Great ball-striking and puts good texture and curve on the ball. Soft feet and can receive in tight spaces. Has some good ideas. Execution and consistency are still developing. Needs to play faster. Was turnover prone. Decision-making and soccer IQ is questionable. Also, a big tweener fit and tough projection. Doesn’t have the final product to play the 10 and isn’t good enough with his back to goal to play the 10. Athletically, isn’t box to box or strong enough to be an 8. And when he played the 6
