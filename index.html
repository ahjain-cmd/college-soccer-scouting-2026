 the right amount of weight, timing, and to the correct foot on his passes. Great in the air and wins most headers when opposing GKs go long. Covers depth well. Can play as a CCB in a back three or RCB in a back four. MLS and beyond potential.","category":null,"status":"MLS NP Real Monarchs","role_name":"Ball-Playing CB"}]},{"key":"hector taboada","name":"Hector Taboada","class":"Sophomore","position":"RW/ST","positions":["RW/ST"],"position_full":"Right Wing / Striker","foot":null,"country":"Spain","dob":null,"team":"UMKC","school":"UMKC","intl":true,"grade":"B/C","grade_val":4,"grade_val_present":7,"grade_present":"B","grade_future":"C","years":[2024],"year":2024,"category":null,"status":null,"rolenum":9,"n_reports":1,"reports":[{"dates":["11/22/2024","10/05/2024"],"match":"UMKC vs St. Louis","team":"UMKC","source":"Video","grade":"B/C","grade_present":"B","grade_future":"C","role_code":"9-FWD3","jersey":9,"position":"RW/ST","position_full":"Right Wing / Striker","foot":null,"class":"Sophomore","country":"Spain","year":2024,"file":"match-year: 2024 report","body":"6’1”, lean build. Solid athlete. Okay pace. Good strength. Good jumper. Good in the air. Has been mostly coming off the bench for them and didn’t play their last two NCAA Tourney games, assuming due to injury. Very versatile. Has played ST, LW, RW, and LWB. For me, projects best as a second striker. Doesn’t have great 1v1 ability and can’t create his own space as a winger or wingback. Defensively isn’t good enough for WB. At striker he’s looked the best especially as a second striker who threatens both sides of backlines. Can drop in and provide link up play or threaten in-behind. Has the best movement as a 9, lacks movement and feel at other positions. Technically sound. Soft feet and good first touch. Good technique. Solid on the turn, is a touch stiff. Safe player. Below-average agility. Doesn’t see a ton with the pass. Okay in tight spaces. Good presser and is aggressive. Uses the right angles and does the defensive work as a 9. Can provide quality service with his left-foot. Lacks cutting edge and unique attributes offensively, however. Solid player nonetheless that would be useful to any USL side with his frame and technical competency along with his versatility. (AJ)","category":null,"status":null,"role_name":"False 9 / 2nd Striker"}]},{"key":"henri ernst","name":"Henri Ernst","class":"Freshman","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"Germany","dob":null,"team":"Quinnipiac Bobcats","school":"Quinnipiac Bobcats","intl":true,"grade":"B/C","grade_val":4,"grade_val_present":7,"grade_present":"B","grade_future":"C","years":[2023],"year":2023,"category":null,"status":null,"rolenum":null,"n_reports":1,"reports":[{"dates":["08/28/2023"],"match":"Quinnipiac Bobcats vs Boston College","team":"Quinnipiac Bobcats","source":null,"grade":"B/C","grade_present":"B","grade_future":"C","role_code":"CMF-6 1","jersey":null,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Freshman","country":"Germany","year":2023,"file":"match-year: 2023 report","body":"Very efficient in possession. The off-ball movement stands out, however. Always is an option. Understands how to move in relation to the ball to provide the best angle. Gives fantastic angles for teammates to allow them to get out of sticky or tight spots. Passes and moves really. High soccer IQ and good tactical understanding. Didn’t see a ton defensively.","category":null,"status":null,"role_name":"True #6 (Double Pivot)"}]},{"key":"ian smith","name":"Ian Smith","class":"R-Junior","position":"LB","positions":["LB"],"position_full":"Left Back","foot":null,"country":"USA","dob":null,"team":"Denver","school":"Denver","intl":false,"grade":"B/C","grade_val":4,"grade_val_present":7,"grade_present":"B","grade_future":"C","years":[2024],"year":2024,"category":null,"status":"25 Dr Portland","rolenum":5,"n_reports":1,"reports":[{"dates":["08/29/2024"],"match":"Denver -up play is poor. Needs to work on his link up play, combination play, and playing faster with his back to goal. Right now, he is very raw and is mainly just a big, powerful, disruptive body up top. Final product and 1v1 ability are also to be determined. Needs polish in a few areas but has potential to be an mpact player if he can improve in those areas. Right now, just too raw and limited for me to give a better grade.","category":null,"status":null,"role_name":null}]},{"key":"max floriani","name":"Max Floriani","class":"R-Junior","position":"RCB","positions":["RCB"],"position_full":"Right Center Back","foot":null,"country":"USA","dob":null,"team":"Saint Louis","school":"Saint Louis","intl":false,"grade":"B/C","grade_val":4,"grade_val_present":7,"grade_present":"B","grade_future":"C","years":[2024],"year":2024,"category":null,"status":"25 Dr San Jose","rolenum":4,"n_reports":1,"reports":[{"dates":[],"match":"Saint Louis vs UMKC","team":"Saint Louis","source":"Video","grade":"B/C","grade_present":"B","grade_future":"C","role_code":"4-CB2","jersey":4,"position":"RCB","position_full":"Right Center Back","foot":null,"class":"R-Junior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6’2”, lean, thick build. Monster athlete. Incredibly rangy. Can cover sideline to sideline. Excellent pace. Great recovery defender. Poor 1v1 defender and has just okay 1v1 defending technique. Feet aren’t great. Doesn’t move side to side overly well. Can fail to close down completely and give attackers an easy lane. Covers depth well but doesn’t intercept or anticipate well, relies on his athletic ability to close the gap. Prone to slide tackling and going to ground too often. Deer in the headlights on the ball. Sees nothing. Strictly side to side. Mediocre technique. Stiff on the ball and a stiff defender. Will be a liability on the ball at the pro level; teams can cut the field in half or shade towards him, one jump by a winger or forward and it’s over. He won’t break the line or the find the entry. Not great at stepping to attackers between the lines. Will step but can dive in and doesn’t use his body or technique to shade them away from goal. Can allow them to turn and face too easily. USL is ceiling. (AJ)","category":null,"status":"25 Dr San Jose","role_name":"Big Athletic Presence"}]},{"key":"paul brauckmamn","name":"Paul Brauckmamn","class":"Senior","position":"CB","positions":["CB"],"position_full":"Center Back","foot":null,"country":"Germany","dob":null,"team":"University of Illinois-Chicago Flames","school":null,"intl":true,"grade":"B/C","grade_val":4,"grade_val_present":7,"grade_present":"B","grade_future":"C","years":[2023],"year":2023,"category":null,"status":null,"rolenum":3,"n_reports":1,"reports":[{"dates":["10/08/2023"],"match":"University of Illinois-Chicago Flames vs Missouri State Bears","team":"University of Illinois-Chicago Flames","source":null,"grade":"B/C","grade_present":"B","grade_future":"C","role_code":"3-CB3","jersey":3,"position":"CB","position_full":"Center Back","foot":null,"class":"Senior","country":"Germany","year":2023,"file":"match-year: 2023 report","body":"6’0”. Good technical quality. Composed defender. Solid athletic ability. Defended well against some dangerous Missouri State attackers. Reads the game well. Deals with the direct stuff smartly. Solid CB with above average ability in the build out phase.","category":null,"status":null,"role_name":"Ball-Playing CB"}]},{"key":"ross johnstone","name":"Ross Johnstone","class":"Grad Student","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"England","dob":null,"team":"High Point Panthers","school":"High Point Panthers","intl":true,"grade":"B/C","grade_val":4,"grade_val_present":7,"grade_present":"B","grade_future":"C","years":[2024],"year":2024,"category":null,"status":"Graduated","rolenum":6,"n_reports":1,"reports":[{"dates":["09/25/2024"],"match":"High Point Panthers vs UNCG Spartans","team":"High Point Panthers","source":"Live","grade":"B/C","grade_present":"B","grade_future":"C","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Grad Student","country":"England","year":2024,"file":"match-year: 2024 report","body":"6’1”, solid build. Solid all-round. Sharp, good technique keeps things moving. Accurate passer. Solid passing range. Good tempo. Nothing special. USL bench. (AJ)","category":null,"status":"Graduated","role_name":"True #6 (Double Pivot)"}]},{"key":"rui reis","name":"Rui Reis","class":"Junior","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"Portugal","dob":null,"team":"UIC Flames","school":"UIC Flames","intl":true,"grade":"B/C","grade_val":4,"grade_val_present":7,"grade_present":"B","grade_future":"C","years":[2024],"year":2024,"category":null,"status":null,"rolenum":10,"n_reports":1,"reports":[{"dates":["09/21/2024"],"match":"UIC Flames vs Missouri State Bears","team":"UIC Flames","source":"Stream","grade":"B/C","grade_present":"B","grade_future":"C","role_code":"10-AMF-10 2","jersey":10,"position":"ST","position_full":"Striker","foot":null,"class":"Junior","country":"Portugal","year":2024,"file":"match-year: 2024 report","body":"5’9”, thicker, stocky build. Slippery, good dribbler, aggressive, has some bite and good presser. Final product lacking. Very involved and lively. Good instincts and feel in the final third. Projects best as a 10 that plays underneath a 9, not a true 9. Need to see more. USL League One/MLS NP starter/bench. (AJ)","category":null,"status":null,"role_name":"Modern 3-4-2-1 #10"}]},{"key":"tomas svecula","name":"Tomas Svecula","class":"5th Year","position":"RW","positions":["RW"],"position_full":"Right Wing","foot":null,"country":"Slovakia","dob":null,"team":"Quinnipiac Bobcats","school":null,"intl":true,"grade":"B/C","grade_val":4,"grade_val_present":7,"grade_present":"B","grade_future":"C","years":[2023],"year":2023,"category":null,"status":"Graduated","rolenum":11,"n_reports":1,"reports":[{"dates":["08/28/2023"],"match":"Quinnipiac Bobcats vs Boston College","team":"Quinnipiac Bobcats","source":null,"grade":"B/C","grade_present":"B","grade_future":"C","role_code":"11-W2-7","jersey":11,"position":"RW","position_full":"Right Wing","foot":null,"class":"5th Year","country":"Slovakia","year":2023,"file":"match-year: 2023 report","body":"Good frame, size, physical traits, and athleticism. Comfortable and technical in tight spaces. Has some flair ad tricks. Really good link-up play and combination play. Good work-rate and lung capacity, up and down the wing.","category":null,"status":"Graduated","role_name":"Vertical Grinder"}]},{"key":"umberto pela","name":"Umberto Pela","class":"Senior","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"Italy","dob":null,"team":"Virginia Cavaliers","school":null,"intl":true,"grade":"B/C","grade_val":4,"grade_val_present":7,"grade_present":"B","grade_future":"C","years":[2023],"year":2023,"category":null,"status":null,"rolenum":6,"n_reports":1,"reports":[{"dates":["08/25/2023"],"match":"Virginia Cavaliers vs Iona Gaels","team":"Virginia Cavaliers","source":"Video","grade":"B/C","grade_present":"B","grade_future":"C","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Senior","country":"Italy","year":2023,"file":"match-year: 2023 report","body":"5’11”. Italian born kid and plays like one. Really good understanding, tempo, and fluidity to his game. Covers ground well and isn’t a massive transition defensive liability. High level technical quality and comfort on the ball. Doesn’t turn it over. Efficient in possession. Can break lines and find players in pockets when he needs to. Good frame and okay size.","category":null,"status":null,"role_name":"True #6 (Double Pivot)"}]},{"key":"aj smith","name":"AJ Smith","class":"Sophomore","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"Denmark","dob":null,"team":"Virginia","school":"Virginia","intl":true,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024],"year":2024,"category":null,"status":"25 Dr NYCFC 78th","rolenum":9,"n_reports":1,"reports":[{"dates":["11/30/2024","11/24/2024"],"match":"Virginia vs UMass","team":"Virginia","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"9-FWD1","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Sophomore","country":"Denmark","year":2024,"file":"match-year: 2024 report","body":"6’4”, thick, large build. Great frame and size. Stiff jumper and isn’t very powerful in the air given his frame. Good pace, not great. Solid agility and feet. Soft touch with his chest and thighs. Medium-soft feet. Technically sound. High soccer IQ and processes things. Makes good decisions in the final third. Finds good spaces between the lines and in-behind. Excellent at laying off and spinning. Won’t provide much aerial hold-up, doesn’t jump great or win many aerial duels for his size, but can provide a presence. Okay in tight spaces. Runs in-behind well and threatens in the channels but doesn’t excel at threatening backlines with his running and dribbling. Shows solid vision for the final ball and with the pass. Good feel for the game and processing. Physical and tactical attributes can get ahead of his technical quality and struggles to execute. Does okay defensive work, lack of burst and pace hurts his pressing ability. Strong, solid, thick but average pace and power. Takes shorter, quicker strides despite his long legs. Has the technical, tactical, and physical foundations, just needs polish and more understanding of how to use his physical and technical attributes. USL L1 right now, with upside to be a top USL Championship/MLS bench striker. (AJ)","category":null,"status":"25 Dr NYCFC 78th","role_name":"True #9 (Target)"}]},{"key":"alec hughes","name":"Alec Hughes","class":"Senior","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"USA","dob":null,"team":"UMass","school":"UMass","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024],"year":2024,"category":null,"status":"25 Dr LAFC 22nd","rolenum":9,"n_reports":1,"reports":[{"dates":["10/13/2024"],"match":"UMass vs Davidson","team":"UMass","source":"Live","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"9-FWD1","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"~6’1. Freak athlete. Did nothing this game. Got pocketed by the CBs who were more athletic than him. Didn’t win duels or create his own space. Eventually got frustrated and got a double yellow and got sent-off. Struggled massively vs more athletic CBs who can match his physicality and athleticism. Didn’t have the tactical understanding and soccer IQ to problem solve and find space. He’s not skillful enough to beat defenders off the dribble, and not fast enough to get to everything that’s in-behind. So, if you can cover the space in-behind and read ball in-behind or match his pace, you can eliminate his most dangerous aspect of the game. Force him to start dropping-in where he can’t lay-off, spin and drive, or find a final ball. He doesn’t initiate first contact on long-balls so it’s easy to win the first ball vs him. Pro level CBs will be able to match his pace or read the game better and take away his in-behind threat to where he doesn’t have anything else to problem solve and create chances or score goals. USL player. (AJ)","category":null,"status":"25 Dr LAFC 22nd","role_name":"True #9 (Target)"}]},{"key":"alex barger","name":"Alex Barger","class":"Junior","position":"LB","positions":["LB"],"position_full":"Left Back","foot":null,"country":"USA","dob":null,"team":"Indiana University","s "Striker","foot":null,"class":"Junior","country":"Norway","year":2025,"file":"match-year: 2025 report","body":"6’3”, lean build. Excellent feet and great in tight spaces. Has technique and final product and can produce goals from a variety of attacking scenarios. Ball striking has good texture, power and curve, can deliver a flatter, dipping, in-swinger. Lacks soccer IQ, feel for the game and doesn’t impact the game away from the ball. Needs the ball at his feet to make an impact. Poor work rate defensively and off the ball.","category":null,"status":null,"role_name":"Enganche (Playmaker #10)"}]},{"key":"aymin madir","name":"Aymin Madir","class":"Sophomore","position":"LCB","positions":["LCB"],"position_full":"Left Center Back","foot":null,"country":"USA","dob":null,"team":"Davidson","school":"Davidson","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024],"year":2024,"category":null,"status":null,"rolenum":5,"n_reports":1,"reports":[{"dates":["10/12/2024","10/09/2024"],"match":"Davidson vs UMass","team":"Davidson","source":"Live","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"5-CB2","jersey":5,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"Sophomore","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6’2”, lean build. Ball-playing CB. Good strength and strong athlete. Doesn’t move his feet well and can struggle defending 1v1 in the channel. But reads the game and anticipates. Strong and sturdy. Great technique. Excellent passing. (AJ)","category":null,"status":null,"role_name":"Big Athletic Presence"}]},{"key":"barzee blama","name":"Barzee Blama","class":"Sophomore","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"USA","dob":null,"team":"Mercer","school":"Mercer","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024],"year":2024,"category":null,"status":"25 Dr 77th Charlotte","rolenum":9,"n_reports":1,"reports":[{"dates":["09/18/2024"],"match":"Mercer vs Davidson","team":"Mercer","source":"Live","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"9-FWD1","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Sophomore","country":"USA","year":2024,"file":"match-year: 2024 report","body":"Around 6’1”, 6’2”. Thick, lean, burly build. Stiff and powerful athlete. Stiff jumper. Technically okay. Stiff on the ball. Lacks the understanding of how to use his physical traits to impact the game on and off the ball. Still very raw. Doesn’t have a ton of feel for the game. Decision-making is raw. Doesn’t move enough off the ball, always needs the ball near or to him. Has athletic upside, but that’s it.","category":null,"status":"25 Dr 77th Charlotte","role_name":"True #9 (Target)"}]},{"key":"beltran alvarez","name":"Beltran Alvarez","class":"Sophomore","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"Argentina","dob":null,"team":"Virginia Tech","school":"Virginia Tech","intl":true,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2025],"year":2025,"category":null,"status":null,"rolenum":6,"n_reports":1,"reports":[{"dates":["11/01/2025"],"match":"Virginia Tech vs Clemson","team":"Virginia Tech","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Sophomore","country":"Argentina","year":2025,"file":"match-year: 2025 report","body":"5’11”, thick, stocky, Rodrigo Betancur type build. Good feet. Okay strength. Solid connector in the middle of the park. Very little ball-progression but makes himself available in the pocket and keeps play moving. Solid defensively with good timing and feet into the challenge. Good feel for the game. Nothing special technically, tactically or physically, just a solid simple connector with a bit of defensive bite and quality. (AJ)","category":null,"status":null,"role_name":"True #6 (Double Pivot)"}]},{"key":"braden fidalek","name":"Braden Fidalek","class":"Senior","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"USA","dob":null,"team":null,"school":null,"intl":false,"grade":"C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2023],"year":2023,"category":null,"status":"Gr-Student","rolenum":6,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"C","grade_present":"C","grade_future":"C","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Senior","country":"USA","year":2023,"file":"match-year: 2023 report","body":"6”3, stocky build. Good size and frame. Technically sound w/ good soccer IQ. Clean in possession. Classic connector; plays two touch, plays simple, keeps possession and the ball moving. Good technique with both feet. Plays with good tempo and efficiency. Doesn’t take extra touches. Not a playmaker or creator, but a connector. I like the bite and presence he brings in the midfield. Lacks a bit of mobility and agility you’d like to see from a player with his size and frame, but he reads the game well-enough and uses his frame and long legs to be a plus defensively. Good in the air. Just sits between the half spaces and provides solid shielding for the backline but won’t go sideline to sideline putting out fires. Overall, brings solid bite and presence in the midfield and has good technique, technical quality, and soccer IQ to go with it. (AJ)","category":null,"status":"Gr-Student","role_name":"True #6 (Double Pivot)"}]},{"key":"brandon bermingham","name":"Brandon Bermingham","class":"Junior","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"Ireland","dob":null,"team":null,"school":"Rhode Island Rhody","intl":true,"grade":"C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2023],"year":2023,"category":null,"status":"Dungannon Ireland Premiership","rolenum":9,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"C","grade_present":"C","grade_future":"C","role_code":"9-FWD3","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Junior","country":"Ireland","year":2023,"file":"match-year: 2023 report","body":"6’2, lean build. Great athlete. Good pace. Back to goal play is very solid. Has solid hold-up and link up play, is comfortable dropping into the pocket, laying off and spinning, and can combine. Technically sound. Good technique and ball striking. Comfortable on the ball. Has a bit of savviness and confidence. Tactically sound. Decent soccer IQ. Just lacks the execution and clinical-ness to his final product and game to turn the good attributes and traits he has into production. Can be a better poacher in and around the box. Movement in-behind is just okay. Much better with his back to goal. Overall, very well-rounded but isn’t exceptional at one or two things that would make him really stand out. (AJ)","category":null,"status":"Dungannon Ireland Premiership","role_name":"False 9 / 2nd Striker"}]},{"key":"bryce boneau","name":"Bryce Boneau","class":"Senior","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"USA","dob":null,"team":"Notre Dame","school":"Notre Dame","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024],"year":2024,"category":null,"status":"24 Dr Nashville 75th","rolenum":6,"n_reports":1,"reports":[{"dates":["10/28/2024"],"match":"Notre Dame vs California","team":"Notre Dame","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5’11”, skinny build. Safe player. Can see the 10 yd forward pass but not much else. Doesn’t process it quickly. Lacks efficiency and tempo. Wont set tempo in midfield. Technically sound. Two-footed. Good technique but doesn’t standout. Good energy and work-rate in midfield. Can get rushed and lack composure on the ball. Won’t pick locks vs teams in low or mid blocks. Doesn’t see it. Okay in tight spaces. Doesn’t have any standout technical or tactical qualities to make the jump. Solid player, not much more. Watched the game vs Cal specifically to see if he could break open or pick locks vs a low/mid-block as Cal sat off. Doesn’t have it on the ball. USL L1 starter. (AJ)","category":null,"status":"24 Dr Nashville 75th","role_name":"True #6 (Double Pivot)"}]},{"key":"calem thommy","name":"Calem Thommy","class":"Senior","position":"RB","positions":["RB"],"position_full":"Right Back","foot":null,"country":"South Africa","dob":null,"team":"NC State","school":"NC State","intl":true,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2025],"year":2025,"category":null,"status":null,"rolenum":2,"n_reports":1,"reports":[{"dates":["08/21/2025"],"match":"NC State vs Queens","team":"NC State","source":"Stream","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"2-FB3","jersey":2,"position":"RB","position_full":"Right Back","foot":null,"class":"Senior","country":"South Africa","year":2025,"file":"match-year: 2025 report","body":"5’9”, solid, lean build. Technically loose in tight spaces and loose first touch. Good change of pace and acceleration. Good technique and has a curved channel ball. Lower drive and power and gets solid separation.","category":null,"status":null,"role_name":"Defensive Fullback"}]},{"key":"cameron gerber","name":"Cameron Gerber","class":"Junior","position":"LWB","positions":["LWB"],"position_full":"Left Wingback","foot":null,"country":"USA","dob":null,"team":"Fairfield","school":"Fairfield","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2025],"year":2025,"category":null,"status":null,"rolenum":5,"n_reports":1,"reports":[{"dates":["10/30/2025"],"match":"Fairfield vs Quinnipiac","team":"Fairfield","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"5-FB1","jersey":5,"position":"LWB","position_full":"Left Wingback","foot":null,"class":"Junior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5'11\" with a lean build. Just okay feet. Brings good work-rate and industry down the left flank. Looks to project forward and join attacks but doesn’t always time it well, which can leave gaps to transition into. Competes defensively with good bite in the tackle and consistent effort. Gets into good, advanced positions to deliver, but the technical execution isn’t consistent enough to provide reliable service. Overall okay technically and just okay in tight spaces; can be turnover-prone under pressure. Defensively, solid enough to force opponents negative but can be exposed by 1v1 quickness and won’t lock down a flank on his own over 90 minutes. Profile projects as a USL L1 bench option. Transfer from Maryland. (AJ)","category":null,"status":null,"role_name":"Wing Back"}]},{"key":"christian kraus","name":"Christian Kraus","class":"Senior","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"USA","dob":null,"team":"Furman","school":"Furman","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024],"year":2024,"category":null,"status":"Graduated","rolenum":9,"n_reports":1,"reports":[{"dates":["09/12/2024"],"match":"Furman vs Davidson","team":"Furman","source":"Live","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"9-FWD1","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6’2”, thick, lean build. Strong. Good balance and low center of gravity. Battles hard between the lines. Digs stuff out and is excellent with back to goal. Soft feet. Good control and entries stick. Okay poacher. Movement is just okay. Doesn’t threaten in-behind. Drops in but doesn’t time it well. Good athlete with good technical tools. (AJ)","category":null,"status":"Graduated","role_name":"True #9 (Target)"}]},{"key":"daniel moore","name":"Daniel Moore","class":"Senior","position":"LB","positions":["LB"],"position_full":"Left Back","foot":null,"country":"USA","dob":null,"team":"Charlotte 49ers","school":"Charlotte 49ers","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024],"year":2024,"category":null,"status":"Charlotte MLS NP","rolenum":5,"n_reports":2,"reports":[{"dates":["09/21/2024"],"match":"Charlotte 49ers vs USF Bulls","team":"Charlotte 49ers","source":"Live","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"5-FB1","jersey":5,"position":"LB","position_full":"Left Back","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6’2”, 178lbs. Strong with thick frame and solid build. Likes to project forward and get involved in the attack. Defensively uses his athletic ability to cover depth and go with attackers. Doesn’t have much in terms of final product or technical quality. Technically a bit loose and clunky. Doesn’t pick players out with crossing, just puts it in the mixer. Likes to get forward but doesn’t pick his moments. C- projection. (AJ)","category":null,"status":"Charlotte MLS NP","role_name":"Wing Back"},{"dates":["09/21/2024"],"match":"Charlotte 49ers vs USF Bulls","team":"Charlotte 49ers","source":"Live","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"5-FB1","jersey":5,"position":"LB","position_full":"Left Back","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6’2”, thick, lean build. Projects forward well. Powerful and pacey. Poor decision-making and soccer IQ. Zero final product. Prone to lazy turnovers. Crossing is mediocre and wasteful. Lockdown defender. Won’t get beat 1v1. Great athlete but lacks technical and tactical attributes to make the jump. USL L1 starter/MLS NP starter. (AJ)","category":null,"status":"Charlotte MLS NP","role_name":"Wing Back"}]},{"key":"darmoney hutchinson","name":"Darmoney Hutchinson","class":"Senior","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"Jamaica","dob":null,"team":"Presbyterian","school":"Presbyterian","intl":true,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024],"year":2024,"category":null,"status":"Graduated","rolenum":9,"n_reports":1,"reports":[{"dates":["11/08/2024"],"match":"Presbyterian vs Winthrop","team":"Presbyterian","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"9-FWD2","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Senior","country":"Jamaica","year":2024,"file":"match-year: 2024 report","body":"6’0”, stocky, build. Good pace. Okay power. Good athlete. A touch stiff. Good movement in-behind. Runs off the shoulder well. Two-footed. Can exploit the space in-behind. Solid work-rate. Decent pressing. Poor finishing and final product. Misses a lot of high-quality chances. Finds good pockets and space in the final third. Just okay between the lines. Not entirely clean between the lines, entries don’t always stick. Okay in the air. Wont will provide much hold-up play. Can poach a bit in the box. (AJ)","category":null,"status":"Graduated","role_name":"Poacher / Finisher"}]},{"key":"david ajagbe","name":"David Ajagbe","class":"Sophomore","position":"FWD","positions":["FWD"],"position_full":"FWD","foot":null,"country":"Canada","dob":null,"team":"Portland","school":"Portland","intl":true,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2025],"year":2025,"category":null,"status":null,"rolenum":9,"n_reports":1,"reports":[{"dates":["10/10/2025"],"match":"Portland vs San Diego","team":"Portland","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"9-FWD1","jersey":9,"position":"FWD","position_full":"FWD","foot":null,"class":"Sophomore","country":"Canada","year":2025,"file":"match-year: 2025 report","body":"6’1”, stocky, thick, solid build. Excellent finisher and final product. Instinctive around the box. Didn’t show enough between the lines today however, or movement off the ball. Good defensive work-rate and mobility. Presses hard. Lacks some feel and finesse to the hold up and link up play aspects and drifted from the game for longer stretches. (AJ)","category":null,"status":null,"role_name":"True #9 (Target)"}]},{"key":"drew kerr","name":"Drew Kerr","class":"Junior","position":"RM","positions":["RM"],"position_full":"Right Mid","foot":null,"country":"USA","dob":null,"team":"Duke","school":"Duke","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024],"year":2024,"category":null,"status":"25 Dr Columbus 81st","rolenum":7,"n_reports":1,"reports":[{"dates":["11/07/2024"],"match":"Duke vs California","team":"Duke","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"7-W2","jersey":7,"position":"RM","position_full":"Right Mid","foot":null,"class":"Junior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6’0”, lean build. Good athlete. Good pace and lung capacity. Technically sound. Good left foot. Safe player. Not a true winger, more of an outside midfielder who can defend and get up and down. Dangerous in space and transition, can beat you on the dribble with his pace. One-dimensional in the final third, however. Always want to cut in on his left foot. 1v1 ability is okay. Mainly a safe player who looks to recycle and play simple. Doesn’t process the game at a high level. USL L1 bench. (AJ)","category":null,"status":"25 Dr Columbus 81st","role_name":"Vertical Grinder"}]},{"key":"ethan ballek","name":"Ethan Ballek","class":"Senior","position":"RM","positions":["RM"],"position_full":"Right Mid","foot":null,"country":"USA","dob":null,"team":"South Carolina","school":"South Carolina","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2025],"year":2025,"category":null,"status":null,"rolenum":7,"n_reports":1,"reports":[{"dates":["09/13/2025"],"match":"South Carolina vs UNC Greensboro","team":"South Carolina","source":"Live","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"7-W3","jersey":7,"position":"RM","position_full":"Right Mid","foot":null,"class":"Senior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6’0”, lean build. Excellent pace with a strong frame and good upper-body strength. Feet are only okay. Shows solid movement into the pocket and can ride challenges physically, but lacks ideas on the ball. Not a 1v1 threat — relies mainly on pace. Defensively poor: doesn’t break down or move his feet when stepping high to press the FB. Positioning and shadowing are weak. Speed of play is questionable. Stiff when closing out defenders. Has final product and can finish clinically when given space. Stays wide and attacks the outside shoulder but struggles in 1v1 isolation. Processing, feel for the game, and soccer IQ/tactical is only okay, but his pace and finishing can punish lapses. Demonstrated this today with both of South Carolina’s goals — playing off the outside shoulder of the FB and applying an excellent final product.","category":null,"status":null,"role_name":"Inverted Winger"}]},{"key":"ethan martinez","name":"Ethan Martinez","class":"Freshman","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"USA","dob":null,"team":"Santa Clara","school":"Santa Clara","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2025],"year":2025,"category":null,"status":null,"rolenum":6,"n_reports":1,"reports":[{"dates":["11/16/2025"],"match":"Santa Clara vs Pacific","team":"Santa Clara","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Freshman","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5'9\" with a skinny build. Clean feet and a quick initial burst, with solid lateral movement and adequate overall pace. Technically sound. Operates well as a connector in the pocket—shows consistently, plays one- and two-touch, and helps circulate possession with soft, reliable touches. Strong technique over 5–15 yards, but longer-distance passing is mixed; diagonals and longer balls often lack consistent weight, tending to float or fall short. Holds his position well and doesn’t vacate the pocket. Steps into FWDs between the lines to force them to play negative. Not a duel-winner but uses smart positioning, and agility to disrupt show opponents backwards. Shows good overall IQ and feel for tempo and spacing. As a freshman, still has physical development ahead of him. Underlying technical qualities are strong, but he needs continued athletic progression to maximize his impact. (AJ)","category":null,"status":null,"role_name":"True #6 (Double Pivot)"}]},{"key":"felix ewald","name":"Felix Ewald","class":"Senior","position":"LWB","positions":["LWB"],"position_full":"Left Wingback","foot":null,"country":"Germany","dob":null,"team":"West Virginia","school":"West Virginia","intl":true,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2025],"year":2025,"category":null,"status":null,"rolenum":2,"n_reports":1,"reports":[{"dates":["11/09/2025","11/05/2025"],"match":"West Virginia vs Old Dominion","team":"West Virginia","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"2-FB1","jersey":2,"position":"LWB","position_full":"Left Wingback","foot":null,"class":"Senior","country":"Germany","year":2025,"file":"match-year: 2025 report","body":"6’2’’ with a lean, wiry, solid build. Good strength with okay power. Movement profile is on the stiffer side, with just okay feet for his size and build. Can be slow to sort his feet in tight spaces and when transitioning to defend. Has a solid initial burst and change of pace but change of direction is only okay. Technically just okay overall, and the stiffness shows when receiving difficult passes or operating in tight areas. Solid right-footed technique and generally a clean ball-striker, though accuracy and weight of pass are just okay. Shows industry and enterprise down the left flank despite being right-footed. Good dribbler with some burst out of tight spaces and when cutting inside onto his right. Strength and sturdiness show up well in duels, with solid defensive bite. He projects forward well but the end product isn’t there yet on either foot, and he can be predictable 1v1, mainly relying on a change of pace. Has some vision for smart passes in behind and combination play when given time and space to get his head up. Good work-rate. Projects as a USL League One starter. (AJ)","category":null,"status":null,"role_name":"Wing Back"}]},{"key":"fletcher bank","name":"Fletcher Bank","class":"Senior","position":"LW","positions":["LW","ST"],"position_full":"Left Wing","foot":null,"country":"USA","dob":null,"team":"Stanford","school":"Stanford Cardinal","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024,2025],"year":2025,"category":null,"status":null,"rolenum":11,"n_reports":2,"reports":[{"dates":["09/18/2024"],"match":"Stanford Cardinal vs UC Davis Aggies","team":"Stanford Cardinal","source":"Stream","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"11-W2","jersey":11,"position":"LW","position_full":"Left Wing","foot":null,"class":"Junior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5’10”, skinny build. Work-rate. Technically okay. Can wiggle out of things. Grinder. Gets up and down. One-dimensional in the final third. Final product is lacking. Only wants to create off the dribble and doesn’t have great 1v1 ability. Technique is just okay. Doesn’t see the game. Lacks soccer IQ and prone to lazy turnovers. Needs more polish but I just don’t see a very high ceiling for him. USL League One/MLS NP starter/bench. (AJ)","category":null,"status":null,"role_name":"Vertical Grinder"},{"dates":["08/24/2025"],"match":"Stanford vs Denver","team":"Stanford","source":"Stream","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"11-W2","jersey":11,"position":"ST","position_full":"Striker","foot":null,"class":"Senior","country":null,"year":2025,"file":"match-year: 2025 report","body":"5’10”, solid build. Mobile with good feet. Aggressive and good engine. Good movement in-behind and projects better as a 9 than out-wide where his technical quality and below-average ability in tight spaces hinders him, but hard to see him there or out-wide at the pro level. Can only create off the dribble and has an okay change of pace, stepover and dip of the shoulder. Poses a problem with his work-rate and industry into the channel especially with another 9 out of a 442 but doesn’t do enough with his half-chances and 1v1 moments. Technique is just okay. One-dimensional with good athletic tools. USL L1/MLS NP. (AJ)","category":null,"status":null,"role_name":"Vertical Grinder"}]},{"key":"freddy kossehasse","name":"Freddy Kossehasse","class":"Junior","position":"RCB","positions":["RCB"],"position_full":"Right Center Back","foot":null,"country":"USA","dob":null,"team":"Akron","school":"Akron","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2025],"year":2025,"category":null,"status":null,"rolenum":3,"n_reports":1,"reports":[{"dates":["10/12/2025","10/08/2025"],"match":"Akron vs DePaul","team":"Akron","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"3-CB2","jersey":3,"position":"RCB","position_full":"Right Center Back","foot":null,"class":"Junior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6’1”, solid, thicker build with good lower-body strength. Quick over the first 3–5 yards and has decent pace; can drive on the ball into space to tackle. Front-footed defender—best when he steps hard to entries between the lines and engages as the ball arrives rather than following the 9 into the lines. Balance is below average and his feet are heavy, which shows under pressure and when covering in-behind. Liability off the shoulder: struggles to stay balanced in contact, dives in, and tends to swipe at the ball; vulnerable to simple change of pace or a dip of the shoulder. On the ball just okay out the back: can circulate 5–10 yards two-touch with good tempo, but poor ball-striking and technique on longer distribution—diagonals and long balls float. Below-average press resistance-can find side-to-side players but doesn’t progress. Some pace and physical tools, but limited functionality with them. USL L1 starter/bench. (AJ)","category":null,"status":null,"role_name":"Big Athletic Presence"}]},{"key":"hakim karamoko","name":"Hakim Karamoko","class":"Sophomore","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"USA","dob":null,"team":"NC State","school":"NC State","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024],"year":2024,"category":null,"status":"25 Dr DC United 14th","rolenum":9,"n_reports":2,"reports":[{"dates":["11/07/2024","10/27/2024"],"match":"NC State vs Wake Forest","team":"NC State","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"9-FWD1","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Sophomore","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6’, 185lbs. Lean, thick build. Fantastic physical attributes. Low center of gravity. Has great power and pace. Excellent strength. Technically sound. Has a unique ability to win fouls and position his body to get by defenders and hold-off defenders. Excellent body control. Has one or two moments a game where he loses control and has a terrible touch or makes a poor decision in the final third. But decision-making and technical quality are polished for the most part. Ability to dig stuff out, turn nothing and 50/50 balls into something. Can play at different speeds and tempo. Can square up defenders and go 1v1. Has the occasional spectacular goal with his left foot. Excellent hold-up and link-up play. His physical attributes unlock his mentality and aggressiveness. Just needs some technical and tactical polish. Processes things and has clarity of thought in the final third. Is decisive and dynamic with his movement. Can run the channel for a ball in-behind or drop-in for the entry. Has all the tools. Does the defensive work as well and can impact the game defensively. Just needs some polish. Will benefit massively from a more competitive environment and daily technical work. Has Europe upside. (AJ)","category":null,"status":"25 Dr DC United 14th","role_name":"True #9 (Target)"},{"dates":["11/07/2024","10/27/2024"],"match":"NC State vs Wake Forest","team":"NC State","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"9-FWD1","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Sophomore","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6’, stocky, thick build. Very lively. Great athlete. Good jumper. Great pace and power. Low center and gravity and knows how to position his body to win fouls and set-up defenders. Hold-up and back-to-goal play are his strength. Wins a lot of fouls in the final third. Dangerous in space and transition. Good agility. Great first-step. Technically okay, a bit loose. Has shown flashes of excellent final product with his left-foot. 1v1 is okay. Needs some developing. Very raw. Has some unique physical qualities, but not sure if there is enough of a technical and tactical baseline. USL bench/USL L1 starter. (AJ)","category":null,"status":"25 Dr DC United 14th","role_name":"True #9 (Target)"}]},{"key":"hjalti sigurdsson","name":"Hjalti Sigurdsson","class":"Grad Student","position":"RB","positions":["RB"],"position_full":"Right Back","foot":null,"country":"Iceland","dob":null,"team":"Dayton","school":"Dayton","intl":true,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024],"year":2024,"category":null,"status":"Iceland","rolenum":2,"n_reports":1,"reports":[{"dates":["11/09/2024","10/27/2024"],"match":"Dayton vs Davidson","team":"Dayton","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"2-FB3","jersey":2,"position":"RB","position_full":"Right Back","foot":null,"class":"Grad Student","country":"Iceland","year":2024,"file":"match-year: 2024 report","body":"6’0”, lean build. Good athlete. Interesting fullback. Won defender of the year not because he’s a top defender. He loved to get forward and find some advanced positions as a FB. Dayton plays a very free flowing style, and he was allowed to be an inverted FB/hybrid winger who can come inside or stay wide and cut inside. For me, he doesn’t project. Decision-making out the back is poor, gets rushed and goes long every time he is jumped. Lacks positional discipline and isn’t a top defender. Has some production and moments when he does get forward, however. Great technique and product. Theres’s quality there for sure, just hard to know given the circumstances if he projects. (AJ)","category":null,"status":"Iceland","role_name":"Defensive Fullback"}]},{"key":"isaac emojong","name":"Isaac Emojong","class":"Sophomore","position":"CAM","positions":["CAM"],"position_full":"Attacking Mid","foot":null,"country":null,"dob":null,"team":"Utah Valley","school":"Portland","intl":null,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2025],"year":2025,"category":null,"status":null,"rolenum":7,"n_reports":1,"reports":[{"year":2025,"grade":"C/C","grade_present":"C","grade_future":"C","position":"CAM","position_full":"Attacking Mid","foot":null,"dates":["11/10/2025"],"match":"Utah Valley vs Grand Canyon","source":"Video","role_code":"7-W1","role_name":"Chalk-on-Boots Winger","jersey":7,"body":"6’2”, lean, long, slender build. Bright. Excellent feet and good agility, but can get tangled/rushed in tight spaces. Good pace. Poor upper body strength to withstand contact in duels and loose balls. Technically just okay, slight awkwardness when receiving and passing. Tends to do too much between the lines but also has a bit of flair and quality to get out of tight spots. Movement can threaten more and needs to be more aggressive in-behind off the ball with his pace. Wants it at his feet. Final product isnt entirely there. Interesting player but very inconsistent despite some tools – needs to show more. (AJ)","class":"Sophomore","country":null,"team":"Utah Valley","status":null,"file":"manual entry"}]},{"key":"issah haruna","name":"Issah Haruna","class":"Sophomore","position":"CAM","positions":["CAM"],"position_full":"Attacking Mid","foot":null,"country":null,"dob":null,"team":null,"school":"UNCG","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2025],"year":2025,"category":null,"status":null,"rolenum":10,"n_reports":1,"reports":[{"dates":["09/13/2025"],"match":null,"team":null,"source":"Live","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"10-AMF-10 1","jersey":10,"position":"CAM","position_full":"Attacking Mid","foot":null,"class":"Sophomore","country":null,"year":2025,"file":"match-year: 2025 report","body":"5’6”, skinny build. Was lively. Excellent feet. Good speed of play and combination play in the final third. Explosive. Smooth and elusive in tight spaces. Feel for the game and movement into and out of pockets. Low center of gravity. Strong into the challenge and good lower body stability. See more. (AJ)","category":null,"status":null,"role_name":"Enganche (Playmaker #10)"}]},{"key":"jack brown","name":"Jack Brown","class":"Junior","position":"RB","positions":["RB"],"position_full":"Right Back","foot":null,"country":"USA","dob":null,"team":"Davidson","school":"Davidson","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024],"year":2024,"category":null,"status":null,"rolenum":2,"n_reports":1,"reports":[{"dates":["10/12/2024","10/09/2024"],"match":"Davidson vs UMass","team":"Davidson","source":"Live","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"2-FB1","jersey":2,"position":"RB","position_full":"Right Back","foot":null,"class":"Junior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5’11”, lean build. High energy. Technically okay. Great agility and feet. Excellent lung capacity. Solid pace. Can project forward and get up and down for 90 minutes. Solid technique and good right foot. Doesn’t provide enough service but has the technique to do so. A bit one dimensional in the final third and can struggle to create his own space to provide service. Can get rushed on the ball and isnt press resistant. Strong defender that has held his own vs some of the top attackers in the A10 including Joseph Melto-Qiah. Moves his feet well and moves laterally. Excellent agility. One to keep an eye next year. (AJ)","category":null,"status":null,"role_name":"Wing Back"}]},{"key":"jack wagoner","name":"Jack Wagoner","class":"Senior","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"USA","dob":null,"team":"Indiana University","school":"Indiana University","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2025],"year":2025,"category":null,"status":null,"rolenum":6,"n_reports":1,"reports":[{"dates":["08/21/2025"],"match":"Indiana University vs Clemson Tigers","team":"Indiana University","source":"Stream","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Senior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5’10”, solid, stocky build. Technically solid. Just a simple connector. Doesn’t have the processing to set tempo and rhythm in midfield. Great mobility and range. Defensively good and breaks up play. Has some bite into the tackle. Tactically and processing wise just a step behind but solid connector with defensive bite.","category":null,"status":null,"role_name":"True #6 (Double Pivot)"}]},{"key":"jackson kiil","name":"Jackson Kiil","class":"R-Junior","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"USA","dob":null,"team":"Stanford","school":"Stanford","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024],"year":2024,"category":null,"status":"Graduated","rolenum":9,"n_reports":1,"reports":[{"dates":["10/12/2024"],"match":"Stanford vs SMU","team":"Stanford","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"9-FWD1","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"R-Junior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6’2”, strong, lean, bigger build. Good in the air. Can rough up the center backs and be a physical presence. Does the defensive work as most Stanford forwards do. Uses his body to post-up CBs well. Just not a lot of finesse to his game. Lacks off-ball movement and feel for the game. Technically loose. Stiff on the ball and not great feet. Messy between the lines. Genuine set-piece threat. Dangerous in the box for crosses but doesn’t have great poaching instincts or feel. Not much more to his game besides being an athlete and providing a big body for hold-up play. Doesn’t project. USL L1 bench. (AJ)","category":null,"status":"Graduated","role_name":"True #9 (Target)"}]},{"key":"jad benjelloun","name":"Jad Benjelloun","class":"Junior","position":"CM","positions":["CM"],"position_full":"Central Mid","foot":null,"country":"USA","dob":null,"team":"Iona Gaels","school":"Iona Gaels","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2023],"year":2023,"category":null,"status":null,"rolenum":8,"n_reports":1,"reports":[{"dates":["08/25/2023"],"match":"Iona Gaels vs Virginia Cavaliers","team":"Iona Gaels","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"8-CMF-8 3","jersey":8,"position":"CM","position_full":"Central Mid","foot":null,"class":"Junior","country":"USA","year":2023,"file":"match-year: 2023 report","body":"Showed some flair. Good comfort on the ball. Good technical quality. High level soccer IQ. One of the few players on Iona who could keep possession effectively and work out of tight spaces. Showed good motor and ability to cover ground in a low block when needed to. Needs to take more risk going forward. One to keep an eye on.","category":null,"status":null,"role_name":"Jack of All Trades"}]},{"key":"jaedon richardson","name":"Jaedon Richardson","class":"Freshman","position":"RW","positions":["RW"],"position_full":"Right Wing","foot":null,"country":"USA","dob":null,"team":"Charlotte 49ers","school":"Charlotte 49ers","intl":false,"grade":"C/C","grade_val":4,"grade_val_present" ":"Stanford","school":"Stanford","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2025],"year":2025,"category":null,"status":null,"rolenum":8,"n_reports":1,"reports":[{"dates":["08/24/2025"],"match":"Stanford vs Denver","team":"Stanford","source":"Stream","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"8-CMF-8 2","jersey":8,"position":"CM","position_full":"Central Mid","foot":null,"class":"Freshman","country":null,"year":2025,"file":"match-year: 2025 report","body":"6’2”, solid build. Excellent work-rate with defensive bite and duel-winning. Tenacious tackler that has technique and timing into the duel. Clogs passing lanes and has good defensive positioning. Good first step and nose for 50/50 balls. Solid connector with good technique. Lacks tempo setting, rhythm and ball progression but a connector with good athletic floor and bite. (AJ)","category":null,"status":null,"role_name":"Box-to-Box Shuttler"}]},{"key":"juan alvarez","name":"Juan Alvarez","class":"Freshman","position":"CAM","positions":["CAM"],"position_full":"Attacking Mid","foot":null,"country":"USA","dob":null,"team":"West Virginia","school":"West Virginia","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2025],"year":2025,"category":null,"status":null,"rolenum":8,"n_reports":1,"reports":[{"dates":["11/09/2025"],"match":"West Virginia vs Old Dominion","team":"West Virginia","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"8-CMF-8 1","jersey":8,"position":"CAM","position_full":"Attacking Mid","foot":null,"class":"Freshman","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5’6”, skinny build. Solid feet and good industry. Solid pace. Good burst. Strong movement between the lines. Finds pockets and space to receive on the half turn and drive at backlines. Has a bit of 1v1 pop and uses small touches to beat defenders between the lines. Tends to get caught on the ball between the lines due to smaller size and poor decision-making. Brings good forward running in transition to provide advanced options to play forward in the half spaces. Technically sound. Good feel and movement, have to see more defensively and on the ball. Seattle Sounders academy. (AJ)","category":null,"status":null,"role_name":"Box-to-Box Grinder"}]},{"key":"keanan bader","name":"Keanan Bader","class":"Junior","position":"LB","positions":["LB","LM"],"position_full":"Left Back","foot":null,"country":"USA","dob":null,"team":"South Carolina","school":"Memphis (Tr fr. UNCG)","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024,2025],"year":2025,"category":null,"status":null,"rolenum":5,"n_reports":2,"reports":[{"dates":["09/25/2024"],"match":"UNCG Greensboro vs High Point Panthers","team":"UNCG Greensboro","source":"Live","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"5-FB1","jersey":5,"position":"LB","position_full":"Left Back","foot":null,"class":"Sophomore","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5’10”. Very solid. Good frame and solid build. Steps and reads the game well. Technically sound. Can play forward. Makes good decisions. Solid left-foot. Battles and good competitor. Sharp on the ball. See more. (AJ)","category":null,"status":null,"role_name":"Wing Back"},{"dates":["09/13/2025"],"match":"South Carolina vs UNC Greensboro","team":"South Carolina","source":"Live","grade":"D/C","grade_present":"D","grade_future":"C","role_code":"5-FB1","jersey":5,"position":"LM","position_full":"Left Mid","foot":null,"class":"Junior","country":null,"year":2025,"file":"match-year: 2025 report","body":"5’10”, thick solid build. Liked him last year but wanted to see more. Stiff. Bad feet. Poor in tight spaces. Liked him last year when I was live. Can pick a good pass when given time and space. Good mobility. Has some ose","rolenum":7,"n_reports":1,"reports":[{"dates":["09/18/2024"],"match":"UC Davis Aggies vs Stanford Cardinal","team":"UC Davis Aggies","source":"Stream","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"7-W2","jersey":7,"position":"RW","position_full":"Right Wing","foot":null,"class":"Senior","country":"Canada","year":2024,"file":"match-year: 2024 report","body":"6’2”, thicker, stocky, solid build. Pro frame. Good pace and lung capacity. Gets forward and is lively. Good dribbler and can drive at backlines and through midfield. Technically sound. Showed solid, need to see more. (AJ)","category":null,"status":"MLS NP San Jose","role_name":"Vertical Grinder"}]},{"key":"krew verratti","name":"Krew Verratti","class":"Senior","position":"RB","positions":["RB"],"position_full":"Right Back","foot":null,"country":null,"dob":null,"team":null,"school":null,"intl":false,"grade":"C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2023],"year":2023,"category":null,"status":null,"rolenum":2,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"C","grade_present":"C","grade_future":"C","role_code":"2-FB1","jersey":2,"position":"RB","position_full":"Right Back","foot":null,"class":"Senior","country":null,"year":2023,"file":"match-year: 2023 report","body":"5’11”, lean build. Technically sound. Played a bunch of different positions last year, but I think his profile fits best at RB. Above-average athlete with good close-down speed and bite. Has good aggressiveness and initiative with and without the ball. Technically sound with good technique. Final product isn’t there yet, but he can be a serviceable RB who isn’t a liability in possession and can win duels, air and ground. Solid soccer IQ.","category":null,"status":null,"role_name":"Wing Back"}]},{"key":"martin luala","name":"Martin Luala","class":"Junior","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"USA","dob":null,"team":"Grand Canyon","school":"Grand Canyon","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2025],"year":2025,"category":null,"status":null,"rolenum":6,"n_reports":2,"reports":[{"dates":["09/10/2025","09/06/2025"],"match":"Grand Canyon vs Santa Clara","team":"Grand Canyon","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Junior","country":null,"year":2025,"file":"match-year: 2025 report","body":"6’0” with a thick, solid build. Explosive with good acceleration and long strides that create separation, though stop-start agility and horizontal quickness are inconsistent. Feet are boxy and stiff, limiting softness and technical fluidity. Can burst forward or carry with power but struggles under pressure, often forcing passes. Steps out aggressively with force and timing, but defensive discipline can waver as he leaves gaps chasing too high. Athleticism and recovery speed help him in transition, where he reads play well and wins 50/50s, also offering a strong aerial presence. Passing can progress play with time and space, but texture, tempo, and technical execution are average. Shows scanning habits and a knack for popping into advanced spaces, yet tempo-setting and 1–2 touch play are inconsistent. Overall, a powerful, explosive midfielder with transition qualities and ball-carrying drive but below-average feet, inconsistent technique, and average tactical awareness. (AJ)","category":null,"status":null,"role_name":"True #6 (Double Pivot)"},{"dates":["09/10/2025","09/06/2025"],"match":"Grand Canyon vs Santa Clara","team":"Grand Canyon","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Junior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6’0” with a thick, solid build. Explosive with good acceleration. Long legs and medium-to-long strides give him separation in open space, though stop-start ability and horizontal agility can be inconsistent. Feet tend toward boxy and stiff, lacking some softness and fluidity. Shows pop and acceleration out of tight spaces but can struggle to play through pressure, often forcing difficult passes onto teammates. Steps aggressively out of the pocket to engage midfielders and the ball. Brings force and timing into challenges, but can leave gaps between the lines when he chases too high. Tends to get tunnel vision for the ball and unnecessarily vacates space, though his athleticism often allows him to recover. Reads defensive play well and excels in transition defending, using long legs and acceleration to beat opponents to loose touches and 50/50s. Strong in the air. Carries the ball with power and drive, using long strides and lower-body explosiveness to progress play. When given time and space, can move the game forward and find entry passes. Strikes the ball with okay cleanliness — capable of hitting a knuckling line drive, though overall texture is only average. Scans and checks shoulders well. Has a unique ability to pop forward out of a defender’s cover to present as a forward option. However, speed of play can be faster and he doesn’t consistently set tempo. Flashes ability to play 1–2 touch but not consistently. Doesn’t always check to the ball in the pocket to provide wall-pass or bump options to circulate possession. Technical level is below-average, feet are boxy, and defensive discipline is inconsistent. Soccer IQ/tactical awareness grades out as average.","category":null,"status":null,"role_name":"True #6 (Double Pivot)"}]},{"key":"matt radivojsa","name":"Matt Radivojsa","class":"Senior","position":"CM","positions":["CM"],"position_full":"Central Mid","foot":null,"country":"Canada","dob":null,"team":null,"school":null,"intl":true,"grade":"
