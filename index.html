","category":null,"status":"MLS NP Seattle","role_name":"Single Pivot Holder"}]},{"key":"harrison myring","name":"Harrison Myring","class":"Senior","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"England","dob":null,"team":"South Carolina Gamecocks","school":"South Carolina Gamecocks","intl":true,"grade":"A/B","grade_val":7,"grade_val_present":10,"grade_present":"A","grade_future":"B","years":[2024],"year":2024,"category":null,"status":"Graduated","rolenum":9,"n_reports":1,"reports":[{"dates":["08/30/2024"],"match":"South Carolina Gamecocks vs Clemson Tigers","team":"South Carolina Gamecocks","source":"Live","grade":"A/B","grade_present":"A","grade_future":"B","role_code":"9-FWD1","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Senior","country":"England","year":2024,"file":"match-year: 2024 report","body":"6’2”, thicker, solid build. Good frame and size. Was really good on the night. Provided an excellent outlet to relieve pressure as SC sat in a mid/low block. Did great work to dig things out of the corners to win throws and fouls. Showed excellent hold-up play and link-up play. Provided a threat in the channels when SC got out in transition. Can muscle off defenders and turn win 50/50 balls. Not afraid to drive at backlines from deeper positions. Showed poaching ability and instincts around the box with his first goal when he got in-front the near zone on a nothing cross and taped it in. (AJ)","category":null,"status":"Graduated","role_name":"True #9 (Target)"}]},{"key":"palmer ault","name":"Palmer Ault","class":"Senior","position":"LW","positions":["LW"],"position_full":"Left Wing","foot":null,"country":"USA","dob":null,"team":"Flint City Bucks","school":null,"intl":false,"grade":"A/B","grade_val":7,"grade_val_present":10,"grade_present":"A","grade_future":"B","years":[2023],"year":2023,"category":null,"status":"24 Draft Colorado","rolenum":11,"n_reports":1,"reports":[{"dates":["07/28/2023"],"match":"Flint City Bucks vs Des Moines Menace","team":"Flint City Bucks","source":"Video","grade":"A/B","grade_present":"A","grade_future":"B","role_code":"11-W1","jersey":11,"position":"LW","position_full":"Left Wing","foot":null,"class":"Senior","country":"USA","year":2023,"file":"match-year: 2023 report","body":"Very dynamic, pacey, technical with a nice understanding of how to combine. Had a fantastic run to set-up the first goal, showing elite ball control and his pace. Was consistently looking to take defenders on 1v1 or throw a quick combination and 1-2 to try to get in behind. Was comfortable in tight spaces and knows how to get out of things. Showed a ton of promise for a 19-year-old, one to keep an eye on. Was the biggest threat for Flint City all night, showed his high-level processing of the game, explosives, technical quality and attacking threat. Showed elite level processing and understanding of the game, his ability to throw quick combinations is unique for the USL2 and D1 level. Final product is to be determined, but he has some serious potential.","category":null,"status":"24 Draft Colorado","role_name":"Chalk-on-Boots Winger"}]},{"key":"reese miller","name":"Reese Miller","class":"Senior","position":"LB","positions":["LB"],"position_full":"Left Back","foot":null,"country":"USA","dob":null,"team":"Virginia Cavaliers","school":null,"intl":false,"grade":"A/B","grade_val":7,"grade_val_present":10,"grade_present":"A","grade_future":"B","years":[2023],"year":2023,"category":null,"status":null,"rolenum":5,"n_reports":1,"reports":[{"dates":["08/25/2023"],"match":"Virginia Cavaliers vs Iona Gaels","team":"Virginia Cavaliers","source":"Video","grade":"A/B","grade_present":"A","grade_future":"B","role_code":"5-FB2","jersey":5,"position":"LB","position_full":"Left Back","foot":null,"class":"Senior","country":"USA","year":2023,"file":"match-year: 2023 report","body":"6’0”. Unique profile. High level tactical understanding and soccer IQ. Can tuck inside to overload the midfield and find gaps in the half-spaces. Smooth, glider on the ball. Great left-foot and final product. Good reading of the game and cutting of passing lanes. Wasn’t tested 1v1 defensively but showed a lot on and off the ball. Picks his moments well. Has a good understanding of how to combine with wingers and midfielders. Can pass and project forward. Gets the spacing right. Soccer athletic build. Will project well at the professional level in Europe where he fits the profile. Might get overlooked for MLS/USL because of lack of high-level athleticism.","category":null,"status":null,"role_name":"Inverted Fullback"}]},{"key":"aidan otoole","name":"Aidan O’Toole","class":"Grad Student","position":"AMF","positions":["AMF"],"position_full":"Attacking Mid","foot":null,"country":"USA","dob":null,"team":"Denver Pios","school":null,"intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2023],"year":2023,"category":null,"status":"Pitt Riverhounds","rolenum":7,"n_reports":1,"reports":[{"dates":["08/28/2023"],"match":"Denver Pios vs Grand Canyon","team":"Denver Pios","source":null,"grade":"B/B","grade_present":"B","grade_future":"B","role_code":"7-W3","jersey":7,"position":"AMF","position_full":"Attacking Mid","foot":null,"class":"Grad Student","country":"USA","year":2023,"file":"match-year: 2023 report","body":"Interesting profile. Good vision with the pass. Makes the right decision with the ball – high soccer IQ. Great technique and ball striking. Dynamic off-ball has good feel and tactical understanding. Can play with more change of pace and rhythm. Finds pocket and will get on the ball look to influence the build-out. But has good vision and has the technique to put it where it needs to be. Polished player. (AJ)","category":null,"status":"Pitt Riverhounds","role_name":"Inverted Winger"}]},{"key":"alex henderson","name":"Alex Henderson","class":"Senior","position":"CB","positions":["CB"],"position_full":"Center Back","foot":null,"country":"England","dob":null,"team":null,"school":null,"intl":true,"grade":"B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2023],"year":2023,"category":null,"status":"Graduated","rolenum":3,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"B","grade_present":"B","grade_future":"B","role_code":"3-CB1","jersey":3,"position":"CB","position_full":"Center Back","foot":null,"class":"Senior","country":"England","year":2023,"file":"match-year: 2023 report","body":"6’4”, lean build. Looks like he is coming off some sort of big knee injury and surgery, may have lost a step. Athletic ability is solid. Lacks a bit of mobility and is slightly stiff, but it’s not a glaring weakness. 1v1 defending is okay but tends to turn and twist his body with the attacker, instead of showing or ushering the attacker onto one foot or side. And he doesn’t have the speed to make up for it, so it is a problematic area. His ability to cover depth stands out, he cuts balls in-behind out beforehand and reads the game well. Very solid duel-winner on the ground and in the air. Has good defending technique and understands how to defend and play CB beyond relying on athletic ability. 1v1 defending needs some polish, must show attackers onto one side and foot, and not twist and turn with them. Solid in-possession. Solid technique with feet, technically-sound. Will mostly play simple, play your neighbor but isn’t overly limited to sideways and backwards. Has shown progressive passing ability, moments of stepping into midfield to slip an entry, hitting the diagonal. Can struggle when jumped and isn’t press resistant. He isn’t a bona fide ball-playing CB but is certainly above-average. Missed most of 2022 due to a knee injury, and as he continues to recover and gain strength, he can be a USL starting CB. (AJ)","category":null,"status":"Graduated","role_name":"Leader of the Line"}]},{"key":"alex vaz","name":"Alex Vaz","class":"Freshman","position":"CAM","positions":["CAM"],"position_full":"Attacking Mid","foot":null,"country":"USA","dob":null,"team":"Fairfield","school":"Fairfield","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":8,"n_reports":1,"reports":[{"dates":["10/16/2025"],"match":"Fairfield vs Merrimack","team":"Fairfield","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"8-CMF-8 3","jersey":8,"position":"CAM","position_full":"Attacking Mid","foot":null,"class":"Freshman","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6'2\" with a lean build. Good frame and size. Good feet and a smooth mover with easy change of pace, good acceleration, and overall pace. Smooth dribbler and ball manipulator who can receive and play out of tight spaces. Shows natural ease when dribbling and manipulating the ball—smooth changes of direction and good quality in tight areas to escape pressure or use a small touch/change of pace to beat a defender in midfield. Can try to do too much at times, which leads to some loose turnovers between the lines. Shows good defensive bite and willingness to tackle in midfield, using his agility and quick feet to engage. Technically sound with soft feet. Speed of play can improve, particularly in attacking transitions where he can be more decisive and clinical with his actions. Very good technique and final product—can threaten goal from distance and is a clinical ball-striker. Hasn’t featured since 10/16 – presume injured. Unique qualities for size, keep close eye out, especially if he transfers to a better conference. Should be on our board as an 8. (AJ)","category":null,"status":null,"role_name":"Jack of All Trades"}]},{"key":"alexander stjernegaard","name":"Alexander Stjernegaard","class":"Senior","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"count and is a set-piece threat. Technically okay. Does see the entry and can find a variety of passes. Isn’t just side to side. Can make rash decisions out the back and isn’t super press resistant. Solid technique. Excellent 1v1 defender. Patient and doesn’t dive in. Waits for you to make your move and then uses his elite power and agility to cut you off or smash you on the tackle. Steps to attackers between the lines and denies their space but can foul too much. Uses his excellent pace and long strides to cover depth well and get to balls in-behind first. Sharp into the tackle and times his tackling. Pocketed Alec Hughes and held him to zero shots. Knows how to play the ball and uses his athleticism to do so. Elite athlete with solid technical and tactical tools. Elite mentality and love for the game. (AJ)","category":null,"status":null,"role_name":"Big Athletic Presence"}]},{"key":"andres rodriguez","name":"Andres Rodriguez","class":"Senior","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"USA","dob":null,"team":"VCU","school":"VCU","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2024],"year":2024,"category":null,"status":null,"rolenum":6,"n_reports":2,"reports":[{"dates":["10/10/2024"],"match":"VCU vs Davidson","team":"VCU","source":"Live","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Junior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5’8”, skinny build. Fantastic quality. Has a nose for tempo-setting and is a calming influence in midfield. Has excellent positioning and always aligns his body to provide an option to play into. Will just sit and draw the opposition block out while he dictates and plays with tempo. Efficient. Smooth. Can play a one-touch pass on the money. He was causing us so many issues in the first half we had to switch formations from a 442 into a 4231 so we could man-mark him out the game. Good range of passing. His diagonals are perfectly weighted. Can be slightly more adventurous with his passing. Prefers just to connect but is a high-level connector. Defensively reads the game and can anticipate entries and cut things out. Athletically is fine. High level tactical and technical quality. USL C starter/USL C bench. (AJ)","category":null,"status":null,"role_name":"True #6 (Double Pivot)"},{"dates":["10/10/2024"],"match":"VCU vs Davidson","team":"VCU","source":"Live","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5’9” with a skinny build. Light-footed player with excellent soft, quick feet. Shows okay pace and acceleration, with good engine and mobility. Primarily operates between the half-spaces, covering ground well laterally. Reads play intelligently, times challenges well, and delays transitions effectively. Currently lacks lower-body drive and power; not especially forceful in duels but sharp and quick to engage. Stays disciplined in position, shielding the backline effectively. Defensively has room to grow — shows the right instincts and intangibles but needs to become more physical and assertive. Looked leggy at times against Clemson, diving into challenges without moving his feet. Just adequate aerially. Two-footed with excellent technical quality. Secure in possession, consistently circulates with 1–2 touch play and keeps rhythm. Extremely soft feet in the pocket and can escape tight spaces with quick manipulation. Right-footed ball striking is clean with good variety over short and medium range. Very secure 10–30 yd passing but lacks power and texture on longer deliveries. Average passing range, limited mostly to diagonals and clipped/chipped balls in behind. Doesn’t consistently split lines on the ground into the 10 or forwards’ feet. High game IQ and strong feel for tempo; plays a step ahead. Would expect more progressive distribution given his technical and tactical quality. Set-piece service is below average — floated rather than driven with dip or pace. Best profile is as a holder in a double pivot, ideally paired with a more athletic and forward-progressive partner who can break lines via dribble or pass. Can function as a single pivot in a 4-3-3 but not naturally dominant there yet. At present projects as an above-average USL Championship starter: technically and tactically superior at that level but requiring physical and defensive maturation. With development in those areas, projects as an MLS starter in the coming years. (AJ)","category":null,"status":null,"role_name":"True #6 (Double Pivot)"}]},{"key":"andrew de gannes","name":"Andrew De Gannes","class":"Junior","position":"LB","positions":["LB"],"position_full":"Left Back","foot":null,"country":"Trinidad and Tobago","dob":null,"team":"Oregon St.","school":"Oregon St","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":5,"n_reports":2,"reports":[{"dates":["09/01/2025"],"match":"Oregon St. vs Indiana","team":"Oregon St.","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"5-FB2","jersey":5,"position":"LB","position_full":"Left Back","foot":null,"class":"Junior","country":"Trinidad and Tobago","year":2025,"file":"match-year: 2025 report","body":"5’9” thick build. A bit stiff in the hips and just okay feet. Good strength and power. Exceptional out the back. Excellent technique and technically sound. Fantastic processing and vision. Always knows where the pressure is coming from and where the open pass is. Has a variety of entry balls and textures with his ball-striking and technique. Press-resistant and seemingly can play out of any pressure structure and find the open player between the lines. Excellent vision and processing of the game. Ideal LB/OCB for building in a 3-2-2-3/3-2-3-2. 1v1 defending is just okay. Has just okay feet and can dive in. showed better 1v1 defending last season and has been below-average this year. Can be a step slow and is on the stiffer side, struggles to mirror attackers and be patient. Can project forward and his technique allows him to deliver high quality service, but Oregon St. prefers him to be the LOCB in a 3-2-5 build, limiting his opportunities to project forward up the line. Crossing can use some refinement and should be better than is given his technique. High IQ and good feel for the game. Excellent decision-maker with the ball. If the feet can marginally improve which will allow him to defend better 1v1 and be sharper into the tackle, would be a top college LB. Unique profile out the back. Trinidad and Tobago U20s. USL Championship starter/bench. (AJ)","category":null,"status":null,"role_name":"Inverted Fullback"},{"dates":["09/01/2025"],"match":"Oregon St. vs Indiana","team":"Oregon St.","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"5-FB2","jersey":5,"position":"LB","position_full":"Left Back","foot":null,"class":"Junior","country":null,"year":2025,"file":"match-year: 2025 report","body":"5’9”, strong build, technically excellent and very press-resistant. Outstanding vision and passing range, consistently finds solutions under pressure and profiles well as a LB/LCB in 3-at-the-back structures. High IQ and composed decision-maker in possession. Defensively limited: stiff hips, average feet, and below-average 1v1 this season after showing better last year. Crossing should be sharper given his technique, but he delivers quality when projecting forward. If defensive footwork improves, could be a top college LB. Current projection: USL Championship starter/bench with potential to rise. (AJ)","category":null,"status":null,"role_name":"Inverted Fullback"}]},{"key":"angel fernandez","name":"Angel Fernandez","class":"Junior","position":"CM","positions":["CM"],"position_full":"Central Mid","foot":null,"country":"USA","dob":null,"team":"San Jose St.","school":"San Jose St","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":8,"n_reports":1,"reports":[{"dates":["09/18/2025"],"match":"San Jose St. vs Stanford","team":"San Jose St.","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"8-CMF-8 3","jersey":8,"position":"CM","position_full":"Central Mid","foot":null,"class":"Junior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5”10, lean, solid build. Excellent, bright feet. Smooth and dynamic movement profile with smooth changes of pace and good lateral movement. High work-rate and energy. Buzzes around the park. Technically sound. Good speed of play. Good on the half turn and can progress the ball through short forward entries or carrying forward. Sharp feet and timing into the duel. Good athlete that can play both ways in the pocket. Solid passing range and good technique. USL starter/bench. (AJ)","category":null,"status":null,"role_name":"Jack of All Trades"}]},{"key":"arnau farnos","name":"Arnau Farnos","class":"Sophomore","position":"RM","positions":["RM"],"position_full":"Right Mid","foot":null,"country":"Spain","dob":null,"team":null,"school":"Wyscout Video Report (Video)","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2024],"year":2024,"category":null,"status":"25 Dr NYCFC 84th","rolenum":7,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"7-W3","jersey":7,"position":"RM","position_full":"Right Mid","foot":null,"class":"Sophomore","country":"Spain","year":2024,"file":"match-year: 2024 report","body":"Skinny build. Technically quality stands out. Average athlete. Great off-ball movement. Comfortable in pockets. Understands the game and has good decision-making. Solid vision and can play forward. Hasn’t shown enough risk taking in the final-third, very comfortable playing simple and what he sees. Shows final ball ability. Would be better as a 10.","category":null,"status":"25 Dr NYCFC 84th","role_name":"Inverted Winger"}]},{"key":"ashton kamden","name":"Ashton Kamden","class":"Senior","position":"LB","positions":["LB"],"position_full":"Left Back","foot":null,"country":"USA","dob":null,"team":"Akron.","school":"Akron","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":5,"n_reports":1,"reports":[{"dates":["09/20/2025","08/30/2025"],"match":"Akron. vs UConn","team":"Akron.","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"5-FB1","jersey":5,"position":"LB","position_full":"Left Back","foot":null,"class":"Senior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5’10”, strong, solid build. Pacey with a good burst. Clean feet, strong lower-body drive, and reliable in the air. Athleticism translates to the next level. Technically sound with soft feet. Composed playing out from the back—anticipates pressure and moves the ball before it arrives. Good vision and decision-making. Excellent left foot with crisp passing and sharp speed of play. Long passing technique is solid but inconsistent. Shows flashes of combination play with the winger and CM to escape tight spaces. Defensively, strong 1v1—patient, agile, and uses timing well. Has recovery pace to cover in-behind and off the shoulder. Can occasionally dive into tackles when stepping to forwards between the lines. Fits well as an LB who can drop into a back three to help build. Projects forward cleanly off the ball, but final product is limited despite sound technique. Polished across technical, tactical, and physical areas, with clear upside. Current level: MLS bench/USL Championship, with potential to grow into an MLS starter.","category":null,"status":null,"role_name":"Wing Back"}]},{"key":"bailey sparks","name":"Bailey Sparks","class":"Senior","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"USA","dob":null,"team":"SMU","school":"SMU","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2024],"year":2024,"category":null,"status":"25 Dr Miami 52nd","rolenum":6,"n_reports":2,"reports":[{"dates":["10/12/2024"],"match":"SMU vs Stanford","team":"SMU","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"6-CMF-6 2","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6’0”, lean build. High energy. Buzzes around the park. Great agility and clean feet. Solid in the air. Solid pace and good strength. High soccer IQ. Good progressive dribbling ability. Can impact the game with his polished final product in the final third. Can project forward as an 8/10 from the 6 position. Technically sound. Composure and calm on the ball. Great feel for the game and off-ball movement. Soft feet and can get on the half-turn out of tight spaces. Made his penalty in ACC Tourney vs Wake. Defensively is good enough. Two-footed. Great technique. Sees the game and can break lines. Final ball has shown flashes but isn’t entirely there. MLS bench/USL Championship starter. (AJ)","category":null,"status":"25 Dr Miami 52nd","role_name":"Single Pivot Holder"},{"dates":["10/12/2024"],"match":"SMU vs Stanford","team":"SMU","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"6-CMF-6 2","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6’0”. Skinny build. Very savvy on the ball. Great composure and decision-making in-possession. Fantastic technique. Sees the pass well – good vision. High soccer IQ and tactical understanding. Great off-ball movement. Clean in tight spaces. Very technical player. Gets around the park and has shown some duel-winning ability as well. I think he has more creativity than he shows. A bit of a tweener fit, isn’t explosive enough to play winger, but doesn’t have top creativity to play the 10. If he showed a touch more creativity, he would get an A. For now, he gets a A-/B+.","category":null,"status":"25 Dr Miami 52nd","role_name":"Single Pivot Holder"}]},{"key":"basit umar","name":"Basit Umar","class":"Junior","position":"CAM","positions":["CAM"],"position_full":"Attacking Mid","foot":null,"country":"Ghana","dob":null,"team":"Wake Forest","school":"Wake Forest","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":10,"n_reports":1,"reports":[{"dates":["08/24/2025"],"match":"Wake Forest vs UCF","team":"Wake Forest","source":"Stream","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"10-AMF-10 2","jersey":10,"position":"CAM","position_full":"Attacking Mid","foot":null,"class":"Junior","country":"Ghana","year":2025,"file":"match-year: 2025 report","body":"5’8”, skinny build with thick lower body. Excellent lower body stability and sturdiness. Excellent feet, has quick feet and close ball control. Strong change of pace and explosiveness thanks to thick lower body drive. Technically sound with clean touches in tight space and good ease when manipulating the ball. Has defensive bite and tackling. Finds intelligent pockets between the lines and supports play fluidly with positional rotations. Can be incisive with the pass and break lines. Must show more consistent creativity, production and final product to round out his strong box-box play. Likely an 8 at the next level, lacks top-end creativity and final third production to project as a 10. Ideal 10 in a 3421/3412. USL Championship starter/bench. Right to Dream Academy. (AJ)","category":null,"status":null,"role_name":"Modern 3-4-2-1 #10"}]},{"key":"ben assane","name":"Ben Assane","class":"R-Senior","position":"RW","positions":["RW"],"position_full":"Right Wing","foot":null,"country":"Senegal","dob":null,"team":"Grand Canyon","school":"Grand Canyon","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":7,"n_reports":1,"reports":[{"dates":["09/10/2025","09/06/2025"],"match":"Grand Canyon vs Santa Clara","team":"Grand Canyon","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"7-W1","jersey":7,"position":"RW","position_full":"Right Wing","foot":null,"class":"R-Senior","country":"Senegal","year":2025,"file":"match-year: 2025 report","body":"Tall (6’2”) with a thick, solid build, he moves well for his size, showing excellent feet, strong pace, and the ability to separate with a quick first step and change of pace. Though a bit stiff, he maintains balance, agility, and control in tight spaces, using medium-to-long strides to cover ground. He has vision and a final pass in his game, but his weaker left foot and slightly awkward ball-striking limit consistency, and he can sometimes play too quickly in the final third for his technical quality. One-footed and not especially diverse 1v1, he also doesn’t always track back defensively. Even so, his size, presence, pace, and footwork make him a constant problem for defenders, with flashes of finesse and touch—he just needs to show greater consistency against quicker, more athletic competition. FYI, Aug 7th 1997 is birthday, meaning he’s 28. (AJ)","category":null,"status":null,"role_name":"Chalk-on-Boots Winger"}]},{"key":"brayden beason","name":"Brayden Beason","class":"Sophomore","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"USA","dob":null,"team":"San Francisco","school":"San Francisco","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2024],"year":2024,"category":null,"status":null,"rolenum":9,"n_reports":1,"reports":[{"dates":["11/17/2024"],"match":"San Francisco vs Santa Clara","team":"San Francisco","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"9-FWD1","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Sophomore","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6'2\", lean build. Good size and frame. Great first step and low center of gravity. Good lower body drive and power. Can spin defenders on the turn. Average pace and okay fluidness. A touch stiff. Okay balance. Poor in the air. Technically solid. Average-below average in tight spaces. Poor weak foot and very one footed in terms of his right foot. Can only finish with his right. Active, mobile, aggressive for 90 minutes. Plays off the shoulder and wants to get in-behind. Transition threat. Movement in-behind is largely straight and direct, lacks some curvature and variety. Willing to check deeper and has a good knack for turning and driving at backlines but can be loose and has average feet and technical quality. Final ball, link up play, and hold up play all need polish and cleanliness but has shown promising signs. Aggressive presser but needs to refine angles. A bit hindered by the turf field San Francisco plays on. Has the tools to become a USL Starter down the line, needs a bit of polish and is a very one-footed finisher that must put more quality chances away. (AJ)","category":null,"status":null,"role_name":"True #9 (Target)"}]},{"key":"calle mollerberg","name":"Calle Mollerberg","class":"R-Sophomore","position":"LCB","positions":["LCB"],"position_full":"Left Center Back","foot":null,"country":null,"dob":null,"team":"CS UC Santa Barbara","school":"CS UC Santa Barbara","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":3,"n_reports":1,"reports":[{"dates":["11/09/2025"],"match":"CS UC Santa Barbara vs UC Davis","team":"CS UC Santa Barbara","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"3-CB3","jersey":3,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"R-Sophomore","country":null,"year":2025,"file":"match-year: 2025 report","body":"6’3”, skinny build. Solid pace. Moves laterally well enough for the next level. Okay strength and frame can get bodied by bigger forwards. Not prolific in duels but does well enough. Good front footed defender that excels when facing forward and stepping into challenges and duels. Steps strong with good timing. Just okay defending 1v1 in the channel, moves well enough and is athletic enough combined with good timing and anticipation. Great out the back with clean circulation and strong vision for line breaking entries and potent balls in-behind. Excellent right footed technique left foot is just okay. RCB at the next level, solid profile. USL starter. (AJ)","category":null,"status":null,"role_name":"Ball-Playing CB"}]},{"key":"carlos fernandez","name":"Carlos Fernandez","class":"Senior","position":"RW","positions":["RW"],"position_full":"Right Wing","foot":null,"country":"Spain","dob":null,"team":null,"school":null,"intl":true,"grade":"B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2023],"year":2023,"category":null,"status":null,"rolenum":7,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"B","grade_present":"B","grade_future":"B","role_code":"7-W3","jersey":7,"position":"RW","position_full":"Right Wing","foot":null,"class":"Senior","country":"Spain","year":2023,"file":"match-year: 2023 report","body":"6’1”, skinny build. Mediocre athlete. Excellent technical quality and technique. Very crafty player. Plays with good tempo and has different rhythms to his game. Great in tight spaces, rarely loses possession. Provides excellent pin-point service and crossing. Also enjoys playing in the pocket, and while he lacks consistent final through ball vision and execution, he is very tricky. He can cut onto either foot, he can slip an attacker etc. Technically, he is fantastic, his technique is so good, the service he can provide is top-tier, and he has some unique abilities in tight spaces and in the final third where he is very crafty and tricky. (AJ)","category":null,"status":null,"role_name":"Inverted Winger"}]},{"key":"carlos leatherman","name":"Carlos Leatherman","class":"Sophomore","position":"RB","positions":["RB"],"position_full":"Right Back","foot":null,"country":"USA","dob":null,"team":"Saint Louis","school":"Saint Louis","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2024],"year":2024,"category":null,"status":null,"rolenum":2,"n_reports":1,"reports":[{"year":2024,"grade":"C/B","grade_present":"C","grade_future":"B","position":"RB","position_full":"Right Back","foot":null,"dates":["11/14/2024","10/27/2024"],"match":"Saint Louis vs George Mason","source":"Video","role_code":"2-FB1","role_name":"Wing Back","jersey":2,"body":"5’5”, thicker build. Great athlete. Bouncy, explosive, quick first step, great in open space. Good jumper. Excellent lung capacity. Great pace. Technically sound. Two-footed. Good close ball-control. Sees and can execute the forward pass. Solid defender and sharp into the challenge. Efficient in-possession. Can beat you off the dribble with his pace but doesn’t have a ton of 1v1 tricks. Smooth dribbler. Excellent progressive dribbling ability. Has a bit of final product but doesn’t provide enough service. More of an inverted FB who can drive at backlines and progress the ball. High IQ and good tactical understanding. USL C starter/USL C bench. Minnesota United academy.","class":"Sophomore","country":"USA","team":"Saint Louis","status":null,"file":"manual entry"}]},{"key":"cesar bahena","name":"Cesar Bahena","class":"Senior","position":"FWD","positions":["FWD"],"position_full":"FWD","foot":null,"country":null,"dob":null,"team":"Cal St. Fullerton","school":"Cal St. Fullerton","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":10,"n_reports":1,"reports":[{"dates":["11/06/2025","11/02/2025"],"match":"Cal St. Fullerton vs UC Davis","team":"Cal St. Fullerton","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"10-AMF-10 2","jersey":10,"position":"FWD","position_full":"FWD","foot":null,"class":"Senior","country":null,"year":2025,"file":"match-year: 2025 report","body":"5’9”, skinny build. Superb mobility and excellent pace. Excellent change of pace to beat a defender and exploit space in-behind. Agile and low center of gravity. Springy and explosive. Poor strength and poor in the air, wont rough up and handle the CBs. Excellent, dangerous and intelligent movement into channels off the shoulder and pockets between the lines. Technically excellent. Soft feet. Natural ease when manipulating and dribbling with the ball. Links play between the lines smartly, with the ability to slip a final ball in-behind or also play simple. Does the defensive work and presses hard. Can play a bit too fast for his technical quality, and decision-making in the final third can lack clarity and decisiveness. Can do a bit too much and simple actions can be performed with more consistency. High IQ and excellent feel for the game. Excellent technique and polished final product. Has a final pass when he drops in but also has final product and quality to finish an attacking moment, either poaching or creating his own space. Weaker left foot isn’t there, one footed finisher. Unique profile whose mobility, movement and technical quality would make an excellent USL 9, despite lack of size. Lots of finesse and craft. (AJ)","category":null,"status":null,"role_name":"Modern 3-4-2-1 #10"}]},{"key":"christian engmann","name":"Christian Engmann","class":"Senior","position":"RCB","positions":["RCB"],"position_full":"Right Center Back","foot":null,"country":"USA","dob":null,"team":"San Diego St.","school":"San Diego St","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":3,"n_reports":1,"reports":[{"dates":["10/05/2025","09/22/2025"],"match":"San Diego St. vs Air Force","team":"San Diego St.","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"3-CB1","jersey":3,"position":"RCB","position_full":"Right Center Back","foot":null,"class":"Senior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6'3\" with a wiry frame. Excellent athleticism and physicality. Excellent agility and feet. Dominant in the air. Sound 1v1 defender who moves his feet well and uses his strong lower-body stability and power to mirror and step to the ball. Great first-step on the ball in duels and tackles. Good strength that allows him to withstand contact in duels. On the ball he keeps it simple out of the back with adequate technique and an okay left foot. Below-average passing range and technique out the back. Press resistance is just okay and he connects simple passes rather than breaking lines. Defends facing forward well. Can drop too deep to protect space in behind, which opens pockets between the lines. Can also overstep, but his athletic tools cover. Left foot is good enough to provide LCB cover as well. (AJ)","category":null,"status":null,"role_name":"Leader of the Line"}]},{"key":"clarence awoudor","name":"Clarence Awoudor","class":"Senior","position":"AMF","positions":["AMF"],"position_full":"Attacking Mid","foot":null,"country":"France","dob":null,"team":"UCF","school":"UCF","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":10,"n_reports":1,"reports":[{"dates":["08/24/2025"],"match":"UCF vs Wake Forest","team":"UCF","source":"Stream","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"10-AMF-10 1","jersey":10,"position":"AMF","position_full":"Attacking Mid","foot":null,"class":"Senior","country":"France","year":2025,"file":"match-year: 2025 report","body":"5’7”, stocky build. Quiet game for him as UCF largely sat in a mid/low block vs Wake’s possession. Still flashed his creativity and final ball. Excellent ball control under pressure and in tight spaces. Excellent technical quality. Didn’t get on the ball much today but still showed a few good moments. Monitor. (AJ)","category":null,"status":null,"role_name":"Enganche (Playmaker #10)"}]},{"key":"cooper forcellini","name":"Cooper Forcellini","class":"Senior","position":"AMF","positions":["AMF"],"position_full":"Attacking Mid","foot":null,"country":null,"dob":null,"team":"Xavier","school":"Xavier","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":8,"n_reports":1,"reports":[{"dates":["10/25/2025"],"match":"Xavier vs Akron","team":"Xavier","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"8-CMF-8 3","jersey":8,"position":"AMF","position_full":"Attacking Mid","foot":null,"class":"Senior","country":null,"year":2025,"file":"match-year: 2025 report","body":"6’1”, lean, wiry build with a good frame, engine, and stride length. Solid balance, good first step and 3–5 yards, and once into his stride he has enough top-end pace to generate a bit of separation in open space. Overall movement is underscored by slight stiffness, with just-okay change of direction and below-average upper-body strength. On-ball, he has good overall technical quality: clean first touch, crisp short passer, comfortable 1–2 touch between the lines and in the pocket, and a good progressive carrier who uses his longer strides and ball manipulation to drive forward. Solid two-footedness, good ball-striking power from distance, and good final ball/vision when combining into the final third. Main issues are stiffness and processing speed in tight spaces—can be slow to sort his feet, lacks finesse/shape on crosses and long passing, doesn’t really progress with the pass when dropping deep, and struggles to consistently create his own space in final-third 1v1s. Off-ball, he has good tactical quality and feel for the game: intelligent third-man runs, good movements into wide areas and half-spaces, active engine, tracks runners and competes in duels and pressing moments, and is good in the air. MLS reserve with room to grow into MLS starter in 1-2 years. (AJ)","category":null,"status":null,"role_name":"Jack of All Trades"}]},{"key":"daniel dippolito","name":"Daniel D’ippolito","class":"Senior","position":"CAM","positions":["CAM"],"position_full":"Attacking Mid","foot":null,"country":"USA","dob":null,"team":"Fordham","school":"Fordham","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2024,2025],"year":2025,"category":null,"status":null,"rolenum":10,"n_reports":2,"reports":[{"dates":["10/06/2024","10/10/2024"],"match":"Fordham vs VCU","team":"Fordham","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"10-AMF-10 2","jersey":10,"position":"CAM","position_full":"Attacking Mid","foot":null,"class":"Junior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5’11”, lean build. Great athlete. Great lung capacity. Great pace. Workhorse. Just an athlete. Has a bit of final ball and product when given time and space. Doesn’t really process it at a high level. Great right foot and is two-footed. Can provide service and beat you off the dribble. Doesn’t have 1v1 trickery. Technically just okay. Poor in tight spaces. Can play winger, CAM or ST. Could be a RB at the next level. USL C bench. (AJ)","category":null,"status":null,"role_name":"Modern 3-4-2-1 #10"},{"dates":["11/12/2025"],"match":"Fordham vs Dayton","team":"Fordham","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"9-FWD2","jersey":9,"position":"CAM","position_full":"Attacking Mid","foot":null,"class":"Senior","country":null,"year":2025,"file":"match-year: 2025 report","body":"5’11”, good frame. Pacey, mobile, lung capacity with good feet and agility. Low IQ and poor feel for the game between the lines as a 10. Speed of play is inconsistent and decision-making is spotty. Excellent ball-striking and final product. Final ball is inconsistent. Good craft and feet around the 18-yard box, can create space for himself to apply his excellent final product. Best projects as a 9 at the next level with the athletic qualities to stretch backlines and has the technical qualities to consistently finish and score goals around the 18-yard box. (AJ)","category":null,"status":null,"role_name":"Poacher / Finisher"}]},{"key":"daniel longo","name":"Daniel Longo","class":"Senior","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"Canada","dob":null,"team":"UNC Greensboro","school":"UNC Greensboro","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":6,"n_reports":1,"reports":[{"dates":["09/13/2025"],"match":"UNC Greensboro vs South Carolina","team":"UNC Greensboro","source":"Live","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Senior","country":"Canada","year":2025,"file":"match-year: 2025 report","body":"6’0”, skinny build. Good feet with strong energy and lung capacity. Pace is only okay, but balanced and fleet-footed, with a sharp first step and burst. High football IQ with excellent game reading, spatial awareness, and consistent scanning. Actively fills defensive and second-ball gaps, stepping sharply to intercept or challenge in the pocket. Mobile, high-energy profile. Fantastic in tight spaces with excellent ball retention, security, and circulation. A reliable connector who keeps play simple, though lacking in progression and line-breaking passes. Strong defensive qualities: tracks and secures second balls, steps decisively to opponents between the lines, and shows strength, timing, and technique in duels. Anticipates play well and often operates a step ahead. Overall, a sharp, intelligent midfielder with strong defensive instincts and secure ball circulation but limited to a simple connecting role in possession. Transfer from Canisius. (AJ)","category":null,"status":null,"role_name":"True #6 (Double Pivot)"}]},{"key":"daniel lugo","name":"Daniel Lugo","class":"R-Sophomore","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"USA","dob":null,"team":"High Point","school":"High Point","intl":false,"grade":"B/A","grade_val":10,"grade_val_present":7,"grade_present":"B","grade_future":"A","years":[2025],"year":2025,"category":null,"status":null,"rolenum":9,"n_reports":1,"reports":[{"year":2025,"grade":"B/A","grade_present":"B","grade_future":"A","position":"ST","position_full":"Striker","foot":null,"dates":["10/28/2025"],"match":"High Point vs Davidson","source":"Live","role_code":"9-FWD2","role_name":"Poacher / Finisher","jersey":9,"body":"6’2”, lean build. Excellent feet. Solid athlete that does the defensive work. Good initial burst, not elite separation in space when forward-facing, above-average athlete that would be average in USL C. Makes up for it with feet and feel for the game. Can spin you with nifty touches, makes up what he lacks in size and physicality in traditional back to goal hold up play with craft, feet, feel for the game and movement. Excellent movement into pockets and half space, can link play with simple connections and find an occasional final ball, but is sightly turnover prone back to goal and can be handled by more physical CBs. Pace is good enough to threaten in-behind, and can provide forward running in transition. Ability to use his excellent agility to create his own space to provide final product. Exceptional poacher in the box with exceptional finishing, composure and technique. Elite movement in the 18 yd box to finish a chance. Needs some physical robustness, and movement can threaten in-behind more and stretch backlines, instead of always dropping in to link play. (AJ)","class":"R-Sophomore","country":"USA","team":"High Point","status":null,"file":"manual entry"}]},{"key":"dario cavada","name":"Dario Cavada","class":"Grad Student","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"Spain","dob":null,"team":"Quinnipiac Bobcats","school":null,"intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2023],"year":2023,"category":null,"status":"Graduated","rolenum":9,"n_reports":1,"reports":[{"dates":["08/28/2023"],"match":"Quinnipiac Bobcats vs Boston College","team":"Quinnipiac Bobcats","source":null,"grade":"B/B","grade_present":"B","grade_future":"B","role_code":"9-FWD2","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Grad Student","country":"Spain","year":2023,"file":"match-year: 2023 report","body":"5’10’’. Good vision for the pass. Can drop in, turn, receive, and break a line. Acts as a solid outlet to relieve pressure. High level technical quality. Great off-ball movement and tactical understanding. Uses a variety of runs well. Dangerous in the final third. Runs off the shoulder well, and has great ball-striking and technique.","category":null,"status":"Graduated","role_name":"Poacher / Finisher"}]},{"key":"david raphael","name":"David Raphael","class":"Sophomore","position":"RW","positions":["RW"],"position_full":"Right Wing","foot":null,"country":"Haiti","dob":null,"team":"San Francisco","school":"San Francisco","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":7,"n_reports":1,"reports":[{"dates":["10/26/2025","10/23/2025"],"match":"San Francisco vs LMU","team":"San Francisco","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"7-W1","jersey":7,"position":"RW","position_full":"Right Wing","foot":null,"class":"Sophomore","country":"Haiti","year":2025,"file":"match-year: 2025 report","body":"5'8\", skinny, light build. Good pace and quickness—bright, lively, mobile, dynamic. Excellent feet and agility. Lacks strength and can struggle in 1v1s when defenders get tight and use their size to body him, rather than letting him exploit his first step. Excellent 1v1 attacker both ways, prefers his left; explosive first step and change of pace; variety of feints, touches, and shoulder dips to gain a yard. Excellent ball-manipulation in tight spaces. Technique and ball striking are excellent with a polished final product. Right foot is just okay. Goes 1v1 too often in low-percentage or tight spaces where he needs to play simple or recycle. Off-ball movement and pace don’t threaten in behind; wants it to feet. Good defensive work rate with bite in the challenge. Links play nicely when showing to feet—can combine with CMs and FBs and use the players around him. Provides quality set-piece service. Poor back-to-goal profile and struggles to hold the ball up. Can struggle versus bigger, more physical defenders who try to out-muscle him; thrives in true 1v1s when opponents try to mirror—his patience, burst, change of pace, and unpredictability come through. MLS bench/USL starter. Has a Green Card. (AJ)","category":null,"status":null,"role_name":"Chalk-on-Boots Winger"}]},{"key":"dren dobruna","name":"Dren Dobruna","class":"Sophomore","position":"LB","positions":["LB"],"position_full":"Left Back","foot":null,"country":"USA","dob":null,"team":"Dayton","school":"Dayton","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":5,"n_reports":1,"reports":[{"dates":["10/09/2025","09/28/2025"],"match":"Dayton vs Fordham","team":"Dayton","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"5-FB1","jersey":5,"position":"LB","position_full":"Left Back","foot":null,"class":"Sophomore","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5’9”, skinny build. Excellent feet. Low center of gravity. Good pace and burst. Clean in tight spaces. Technically sound with soft feet. Good tempo and speed of play out the back. Clean ball-striker with average dip and curve, solid power. High IQ. Balanced and sharp in defensive duels with timing. Can be slightly flat footed when closing 1v1 – does best when closes early and continues to move feet, where excellent agility and low center of gravity shine. Projects forward cleanly into the final third with timing and combines well once there with the ability to provide quality service with clean left footed ball striking, even if potency is still developing. Can play simple forward passes out the back. Ability to combine down the flank and into the final third. Athleticism is a touch short of pace and lower-body power but otherwise has every tool. USL starter with MLS starter upside. (AJ)","category":null,"status":null,"role_name":"Wing Back"}]},{"key":"dylan kropp","name":"Dylan Kropp","class":"Senior","position":"LCB","positions":["LCB"],"position_full":"Left Center Back","foot":null,"country":"USA","dob":null,"team":"North Carolina","school":"North Carolina","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":3,"n_reports":2,"reports":[{"dates":["10/04/2025"],"match":"North Carolina vs Louisville","team":"North Carolina","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"3-CB3","jersey":3,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"Senior","country":null,"year":2025,"file":"match-year: 2025 report","body":"6’2”, lean build. Above-average feet for his size with solid pace and medium-length stride. Lateral agility is solid; vertical stop-start is about average. Shows solid strength and good balance. Excellent in the air: times his jumps well, heads cleanly, and gets distance on clearance headers. Defends more through timing and ball-playing than brute force. Steps aggressively into FWDs between the lines to poke away entry passes and rarely gets spun when he engages early. Slight tendency to overstep and go to ground when he steps to FWDs late. Good technique into the challenge and largely stays balanced. Covers off-the-shoulder runs well and is seldom beaten into the channel due to poor positioning. 1v1 defending is sound and projects to the next level but patience can still improve. Looked steadier in this area last year at Xavier; early matches with UNC in 2025 saw him a bit divey/over-aggressive, but he’s settled and improved game by game. Defends the box excellently with good positioning, anticipation, and clearances. On the ball he’s clean out of the back with good tempo and reliable technique. Passing range is solid; the diagonal can float slightly. Finds entries when given time and space and isn’t turnover-prone under pressure. Above-average ball-progression with the capability to deliver line-splitting entries and balls in-behind. Shows consistent forward passing and clean right-footed ball striking. Displayed more progression from CCB3 than from LCB. MLS bench/USL starter. (AJ)","category":null,"status":null,"role_name":"Ball-Playing CB"},{"dates":["10/04/2025"],"match":"North Carolina vs Louisville","team":"North Carolina","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"3-CB3","jersey":3,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"Senior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6’2”, lean build. Above-average feet for his size with solid pace and medium-length stride. Lateral agility is solid; vertical stop-start is about average. Shows solid strength and good balance. Excellent in the air: times his jumps well, heads cleanly, and gets distance on clearance headers. Defends more through timing and ball-playing than brute force. Steps aggressively into FWDs between the lines to poke away entry passes and rarely gets spun when he engages early. Slight tendency to overstep and go to ground when he steps to FWDs late. Good technique into the challenge and largely stays balanced. Covers off-the-shoulder runs well and is seldom beaten into the channel due to poor positioning. 1v1 defending is sound and projects to the next level but patience can still improve. Looked steadier in this area last year at Xavier; early matches with UNC in 2025 saw him a bit divey/over-aggressive, but he’s settled and improved game by game. Defends the box excellently with good positioning, anticipation, and clearances. On the ball he’s clean out of the back with good tempo and reliable technique. Passing range is solid; the diagonal can float slightly. Finds entries when given time and space and isn’t turnover-prone under pressure. Shows consistent forward passing and clean right-footed ball striking. Displayed more progression from CCB3 than from LCB. MLS bench/USL starter. (AJ)","category":null,"status":null,"role_name":"Ball-Playing CB"}]},{"key":"edouard nys","name":"Edouard Nys","class":"Sophomore","position":"CAM","positions":["CAM"],"position_full":"Attacking Mid","foot":null,"country":"Belgium","dob":null,"team":"UIC Flames","school":"UIC Flames","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":10,"n_reports":1,"reports":[{"dates":["10/26/2025","10/19/2025"],"match":"UIC Flames vs Northern Illinois","team":"UIC Flames","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"10-AMF-10 1","jersey":10,"position":"CAM","position_full":"Attacking Mid","foot":null,"class":"Sophomore","country":"Belgium","year":2025,"file":"match-year: 2025 report","body":"5’8”, skinny build. Excellent 3–5 yd initial burst; only okay separation over longer distances. Lovely, soft, quick feet—exceptional in tight spaces and 1v1 in the final third. Can be outmuscled in duels; strength is a limitation. Drifts intelligently to find pockets, receives on the half-turn to face forward, and looks to dribble or play forward quickly. Movement is superb with high level feel for timing and space. Finishes well in tight areas and threatens goal from multiple angles and distances. Vision for the final pass is unique with a variety of textures and techniques. Excellent conviction, quality and texture to his ball-striking. Superb technically. Can try too much at times; decision-making is still maturing, especially in the final third. To reach full potential at the next level, needs to sharpen choices and consistency. The final product, final ball, quality in tight spaces, 1v1 threat, goal threat, and passing/dribbling outputs are all excellent and unique but inconsistent in quality, despite high volume. (AJ)","category":null,"status":null,"role_name":"Enganche (Playmaker #10)"}]},{"key":"elie kisoka","name":"Elie Kisoka","class":"Junior","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"France","dob":null,"team":"UMKC","school":"UMKC","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2024],"year":2024,"category":null,"status":null,"rolenum":9,"n_reports":1,"reports":[{"dates":["12/01/2024","11/25/2024"],"match":"UMKC vs Pittsburgh","team":"UMKC","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"9-FWD3","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Junior","country":"France","year":2024,"file":"match-year: 2024 report","body":"6’1”, thick, stocky build. Pro frame. Strong. Good athlete. Good in the air but doesn’t excel. Slightly stiff, doesn’t have the elite power or pace but is quick enough. Two-footed and can finish with both feet. Clean between the lines with soft feet. Excellent touch. Entries and balls into him, air and ground, stick well. Solid hold-up and link-up play. Could use his body and frame to engage the defender better and back into him to create more space. Has good agility and feet. Good in tight spaces for his frame and size. Can dribble and play out of things. Loves dropping into pockets, picking up 2nd balls, receiving entries, getting on the half-turn/full-turn and finding final balls/through balls to the wingers. High soccer IQ and good tactical quality. Has the vision and technique for the final pass. Uses occasional 1-2s and combinations in the final third but lacks the burst of pace to be an effective runner in-behind and really threaten backlines. Has flashed ability to poach in the box and has great finishing technique. Would be an above-average USL Championship striker and would work excellently in a two-striker system with a partner who will stretch backlines. Ideal false 9 in a 433 with aggressive, athletic wingers. (AJ)","category":null,"status":null,"role_name":"False 9 / 2nd Striker"}]},{"key":"enzo dovlo","name":"Enzo Dovlo","class":"Junior","position":"RW","positions":["RW"],"position_full":"Right Wing","foot":null,"country":"France","dob":null,"team":"UNC Greensboro","school":"UNCG Greensboro","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2024,2025],"year":2025,"category":null,"status":null,"rolenum":2,"n_reports":3,"reports":[{"dates":["09/25/2024"],"match":"UNCG Greensboro vs High Point Panthers","team":"UNCG Greensboro","source":"Live","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"2-FB1","jersey":2,"position":"RW","position_full":"Right Wing","foot":null,"class":"Junior","country":"France","year":2024,"file":"match-year: 2024 report","body":"6’0”, lean, lanky build. Excellent pace with a loose, fluid athletic profile. Accelerates naturally and creates separation through long strides. Brings strong energy and enterprise down the flank, constantly putting defenders on their heels and attacking 1v1. Off-ball movement shows variety, timing, and rhythm. Can attack either shoulder but prefers the outside, giving himself room to cut onto his excellent left foot. Very effective running into channels, in behind, or receiving to feet in wide areas. Links play well by checking down and combining in the final third. Defensively, doesn’t track overly deep, preferring to stay higher as a direct outlet in transition. Provides threat driving at backlines from deeper zones in low/mid blocks, gaining territory or going directly to goal in attacking transition. Technically, feet are generally clean but can get tangled in tight spaces. Strong left-foot preference, though he has shown flashes of quality service with his right. Good soccer IQ with an occasional final ball and vision, but consistency is lacking. Has end product but can add more against low blocks to polish his game. In this match, was largely double-teamed, forced to cut inside from deeper areas and create off the pass. Delivered a few moments of high-quality service but not consistently enough — an area for improvement. (AJ)","category":null,"status":null,"role_name":"Wing Back"},{"dates":["09/25/2024"],"match":"UNCG Greensboro vs High Point Panthers","team":"UNCG Greensboro","source":"Live","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"2-FB1","jersey":2,"position":"RW","position_full":"Right Wing","foot":null,"class":"Sophomore","country":"France","year":2024,"file":"match-year: 2024 report","body":"6’0”, lean, thick, solid build. Fantastic pace. Energy and lung capacity. Is a big threat in-behind. Slippery on and off the ball, dangerous in the final third. Has the ability to attack space and threaten backlines with his dribbling, off-ball movement, and pace in-behind. Has a bit of combination play and ability to play 1-2s to get out things. Can struggle with his back to goal and is turnover prone in tight spaces. Needs to be more diverse with his movement. Technically sound and good technique. Need to see more final product wise. Projects best at the pro level as an RB with his athletic gifts. One to keep an eye on. USL starter right now with potential to be an MLS starter by his senior year if he improves his movement and play in tight spaces. Has all the tools just needs a bit of tactical polish. (AJ)","category":null,"status":null,"role_name":"Wing Back"},{"dates":["09/13/2025"],"match":"UNC Greensboro vs South Carolina","team":"UNC Greensboro","source":"Live","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"11-W1","jersey":11,"position":"RW","position_full":"Right Wing","foot":null,"class":"Junior","country":null,"year":2025,"file":"match-year: 2025 report","body":"6’0” lean, lanky build. Excellent pace with long, fluid strides that allow him to separate quickly. Brings strong energy down the flank, constantly forcing defenders to retreat and attacking 1v1. Off-ball movement is varied and well-timed, able to threaten both shoulders but more comfortable on the outside, where he can cut onto his excellent left foot. Very effective when running into channels, making penetrative movements in behind, or receiving to feet wide. Combines well in the final third, linking play through short layoffs and simple connections. Defensively, rarely tracks all the way back, instead staying higher to serve as a direct outlet in transition. Carries threat when driving from deeper zones against low or mid blocks, advancing play or attacking goal directly. On the ball, technique is sound but can become untidy under tight pressure. Strong left-foot preference, though he has shown some ability to deliver with his right. Flashes vision and quality in his final ball, but execution is inconsistent. Has end product, yet needs to refine his service against set defenses to round out his attacking profile. In this match, was often double-teamed, forced inside from deeper positions, and relied more on combining than isolating. Produced a few moments of high-quality delivery but not with regularity — consistency in chance creation remains an area for development. (AJ)","category":null,"status":null,"role_name":"Chalk-on-Boots Winger"}]},{"key":"frankie defrancesco","name":"Frankie DeFrancesco","class":"Freshman","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"USA","dob":null,"team":"High Point Panthers","school":"NC State","intl":false,"grade":null,"grade_val":null,"grade_val_present":null,"grade_present":null,"grade_future":null,"years":[],"year":null,"category":null,"status":null,"rolenum":9,"n_reports":0,"reports":[]},{"key":"frederik jorgenson","name":"Frederik Jorgenson","class":"Senior","position":"LWB","positions":["LWB"],"position_full":"Left Wingback","foot":null,"country":"Denmark","dob":null,"team":"West Virginia","school":"West Virginia","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2024],"year":2024,"category":null,"status":"Graduated","rolenum":5,"n_reports":1,"reports":[{"dates":[],"match":"West Virginia vs North Florida","team":"West Virginia","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"5-FB1","jersey":5,"position":"LWB","position_full":"Left Wingback","foot":null,"class":"Senior","country":"Denmark","year":2024,"file":"match-year: 2024 report","body":"5’9”, lean build. Energetic and aggressive. Great feet and agility. Good athlete. Clean in-possession. Has some savviness and comfort on the ball. Can project forward and provide service. Defensively sound. Technically sound. Sharp on the ball. Makes good decisions. Isn’t elite but is above average. Didn’t see a ton in terms of final product or him providing service – doesn’t mean he doesn’t have it, just didn’t see it. Dangerous in transition and has good reactions. (AJ)","category":null,"status":"Graduated","role_name":"Wing Back"}]},{"key":"fumiya shiraishi","name":"Fumiya Shiraishi","class":"Senior","position":"LW","positions":["LW"],"position_full":"Left Wing","foot":null,"country":"Japan","dob":null,"team":"Missouri St.","school":"Missouri St","intl":true,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":11,"n_reports":1,"reports":[{"dates":["09/01/2025"],"match":"Missouri St. vs Penn St","team":"Missouri St.","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"11-W1","jersey":11,"position":"LW","position_full":"Left Wing","foot":null,"class":"Senior","country":"Japan","year":2025,"file":"match-year: 2025 report","body":"5’7”, skinny, pace- and agility-based attacker with confidence and aggression on the dribble. Smooth, slippery in tight spaces, and consistently drives inside onto a strong right foot. Excellent feet and a clean, powerful strike make him a polished finisher and reliable final-third threat. Intelligent off-ball mover — attacks the shoulder well but also checks deeper to unbalance fullbacks. Sharp decision-maker with mature sense of timing in the final third. Limitations: lacks true top-end pace to separate at higher levels, overly right-footed, and has a fairly narrow 1v1 repertoire. Overall profile: direct, confident attacker with product and intelligent movement, projecting as a creative wide threat. (AJ)","category":null,"status":null,"role_name":"Chalk-on-Boots Winger"}]},{"key":"gilberto rivera","name":"Gilberto Rivera","class":"Junior","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"USA","dob":null,"team":"San Jose St.","school":"San Jose St","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":6,"n_reports":1,"reports":[{"dates":["09/18/2025"],"match":"San Jose St. vs Stanford","team":"San Jose St.","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Junior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5’10”, stocky, thick build. Great feet with excellent change of direction and a fluid overall movement profile. Shows a strong initial burst driven by his lower-body power and carries solid overall pace. Very good balance and sturdiness. Strength and top-end power are only average, but functional. Technically excellent. Consistently clean in the pocket and always looking to get on the ball to dictate tempo and rhythm. Excellent 1–2 touch connector with reliable weight on his passes, making it easy for teammates to play into and out of his feet. Shows strong passing range and vision on diagonals and balls in behind. His progression is mainly via longer switches or balls in-behind onto cutting inside wingers/9 in-behind, or short 5–15 yd entries into advanced midfielders checking to feet, or 5–15 yd wide entries into advanced FBs. Lacks some line-splitting ground entries over longer distances, which becomes more noticeable under pressure. His longer balls can lose accuracy/weight, and he can default to bumping sideways or backward when pressed, occasionally inviting pressure onto teammates. This is his main limitation, though not a glaring one given his above-average press resistance and ability to skip out of pressure on the dribble using his burst. Soft feet and a steady circulator in the pocket; when given time and space he can hit precise balls in behind and diagonals that open the game. Controls tempo well—knows when to slow the match and when to accelerate—showing high IQ and an excellent feel for the game. Defensively, he has sharp feet and strong anticipation, with the lower-body quickness to tackle and protect the back line in the pocket. Shows confidence, attitude, and a strong mentality. Can drop into the back line to build in a 3 and has flashed occasional final-third quality with late forward runs. Profiles as a true single-pivot holder in a 4-3-3 or a deep-lying playmaker in a double pivot. While SOS in the WAC is a mild concern, he showed well vs #3 Stanford. Projects as an excellent USL starter at the 6 now, with room to grow into an MLS starter. (AJ)","category":null,"status":null,"role_name":"True #6 (Double Pivot)"}]},{"key":"gilles aurelien","name":"Gilles Aurelien","class":"Senior","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"USA","dob":null,"team":"Utah Valley","school":"Utah Valley","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":8,"n_reports":1,"reports":[{"dates":["10/24/2025","10/12/2025"],"match":"Utah Valley vs UNLV","team":"Utah Valley","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"8-CMF-8 1","jersey":8,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Senior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5'10\", thick, solid, stocky build with good lower-body density. Good pace with a strong 3–5 yards burst. Clean feet and agile in the middle of the park, which helps him in duels and tight spaces. High energy and good mobility. Technically sound. Makes himself available in the pocket. Capable of finding line-splitting entries and balls in behind, but not prolific in volume. Good in tight spaces where his agility, low center of gravity, and burst stand out. Solid ball carrier who can drive into space. Has the capability to run box to box, but current scheme fit as a 6 in a 3-4-3 doesn’t allow him to. Occasionally tries to do too much in tight spaces or with the pass. Can play simpler more often instead of trying to win attacking duels in his own and central thirds. Good timing and bite in challenges. Good technique. Bright and active. (AJ)","category":null,"status":null,"role_name":"Box-to-Box Grinder"}]},{"key":"isaac heffess","name":"Isaac Heffess","class":"Senior","position":"RCB","positions":["RCB"],"position_full":"Right Center Back","foot":null,"country":"USA","dob":null,"team":"NC State","school":"NC State","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":3,"n_reports":1,"reports":[{"dates":["08/21/2025"],"match":"NC State vs Queens","team":"NC State","source":"Stream","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"3-CB3","jersey":3,"position":"RCB","position_full":"Right Center Back","foot":null,"class":"Senior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5’11”, thick, solid build. Undersized for the position but allows him to have a lower center of gravity with excellent balance, feet, and agility. Fantastic reading of the game and anticipation. Struggled
