 in the spring season, he had some egregious turnovers in his own end where he gets caught with his back to goal. If he improves his speed of play and decision-making, projects best at the 6. But right now, hard to see him pro ready. Technically it’s there, athletically in terms of his movement it’s there, but tactically he’s not ready. If he shows better decision-making and polish his senior year, would be a 1st round pick in 2026. USLC starter/bench right now. (AJ)","category":null,"status":null,"role_name":"Jack of All Trades"},{"dates":["09/14/2024"],"match":"Wake Forest Deamon Deacons vs Virginia Cavaliers","team":"Wake Forest Deamon Deacons","source":"Live","grade":"C/B-","grade_present":"C","grade_future":"B-","role_code":"8-CMF-8 3","jersey":8,"position":"CAM","position_full":"Attacking Mid","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6’0”, skinny build. Smooth player with excellent technical quality. Clean on the ball and in tight spaces, has a natural ease and fluidity on the half-turn and fantastic texture with his ball-striking and technique. Excellent energy, buzzes around the park, finds intelligent pockets and positions himself to receive with time and space. Processing and decision-making are just average and is why he lacks consistent final ball and struggles to pick locks vs mid/low blocks and is rendered to a box-to-box shuttler/connector. Has the technique to crush a goalkeeper from longer range and provide excellent set-piece service. Just doesn’t process it fast enough and understand how to penetrate with the pass or dribble consistently. Physical scrawniness and lack of duel-winning underscore a positional question mark with him at the next level, isn’t a natural fit for a 10,8,6 spot in MLS. Would an excellent 8 or 10 in USL Championship, and if he can physically and tactically mature in USL, can easily be MLS midfielder. (AJ)","category":null,"status":null,"role_name":"Jack of All Trades"},{"dates":["08/24/2025"],"match":"Wake Forest vs UCF","team":"Wake Forest","source":"Stream","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"8-CMF-8 3","jersey":8,"position":"CM","position_full":"Central Mid","foot":null,"class":"Senior","country":null,"year":2025,"file":"match-year: 2025 report","body":"6’0”, skinny build. Smooth player with excellent technical quality. Clean on the ball and in tight spaces, has a natural ease and fluidity on the half-turn and fantastic texture with his ball-striking and technique. Excellent energy, buzzes around the park, finds intelligent pockets and positions himself to receive with time and space. Processing and decision-making are just average and is why he lacks consistent final ball and struggles to pick locks vs mid/low blocks and is rendered to a box-to-box shuttler/connector. Has the technique to crush a goalkeeper from longer range and provide excellent set-piece service. Physical scrawniness and lack of duel-winning underscore a positional question mark with him at the next level, isn’t a natural fit for a 10,8,6 spot in MLS. Would an excellent 8 or 10 in USL Championship, and if he can physically and tactically mature in USL, can easily be MLS midfielder. (AJ)","category":null,"status":null,"role_name":"Jack of All Trades"}]},{"key":"daniel krueger","name":"Daniel Krueger","class":"Sophomore","position":"RCB","positions":["RCB"],"position_full":"Right Center Back","foot":null,"country":"USA","dob":null,"team":"Wake Forest","school":"Wake Forest","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":3,"n_reports":1,"reports":[{"dates":["11/01/2025","10/05/2025"],"match":"Wake Forest vs Notre Dame","team":"Wake Forest","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"3-CB3","jersey":3,"position":"RCB","position_full":"Right Center Back","foot":null,"class":"Sophomore","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6’1”, lean build. Good feet and a fluid mover with solid pace—stride length better than height suggests—and he covers depth well. Above-average balance and solid in the air. Not overly confrontational in duels; relies more on timing and balance than strength or aggression, showing good technique and patience 1v1. On the ball he has the tools to find progressive passes and entries and shows solid press-resistance, can carry or play through pressure, but execution is inconsistent. Technique and decision-making out from the back must improve—too many loose turnovers, rushed choices, and forced long balls. Has potential to an above-average USL starter, is only an 06’ as a Sophomore. (AJ)","category":null,"status":null,"role_name":"Ball-Playing CB"}]},{"key":"donavan phillip","name":"Donavan Phillip","class":"Junior","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"USA","dob":null,"team":"NC State","school":"NC State","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":9,"n_reports":1,"reports":[{"dates":["08/21/2025"],"match":"NC State vs Queens","team":"NC State","source":"Stream","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"9-FWD1","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Junior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6'2\", thick, lean, solid build. Great feet and power for his size. Lower body drive and acceleration. Quick feet in tight spaces. Has final product and clean ball-striker. Attacks the space into the channel. Big bruiser that can rough up the CBs. Lacks some finesse and cleanliness between the lines but has it around the box. Attacks the shoulder and space in-behind. Lacks some hold-up, link up play and general variety but poses a consistent problem with his physicality, running, feet, and final product. (AJ)","category":null,"status":null,"role_name":"True #9 (Target)"}]},{"key":"dylan borso","name":"Dylan Borso","class":"Freshman","position":"CAM","positions":["CAM"],"position_full":"Attacking Mid","foot":null,"country":null,"dob":null,"team":"Wake Forest Deamon Deacons","school":"Wake Forest Deamon Deacons","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2024],"year":2024,"category":null,"status":null,"rolenum":10,"n_reports":1,"reports":[{"dates":["09/14/2024"],"match":"Wake Forest Deamon Deacons vs Virginia Cavaliers","team":"Wake Forest Deamon Deacons","source":"Live","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"10-AMF-10 1","jersey":10,"position":"CAM","position_full":"Attacking Mid","foot":null,"class":"Freshman","country":null,"year":2024,"file":"match-year: 2024 report","body":"Came on as a sub and showed flashes of his quality. Still young and a freshman but certainly has potential to be one of the top players in the country. Keep an eye on. (AJ)","category":null,"status":null,"role_name":"Enganche (Playmaker #10)"}]},{"key":"elias khodri","name":"Elias Khodri","class":"Senior","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"France","dob":null,"team":"New Hampshire","school":"New Hampshire","intl":true,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":9,"n_reports":1,"reports":[{"dates":["08/21/2025"],"match":"New Hampshire vs Boston University","team":"New Hampshire","source":"Stream","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"9-FWD1","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Senior","country":"France","year":2025,"file":"match-year: 2025 report","body":"6’0”, Dynamic, pacey, lively. Plays off the shoulder but can also check deeper and spin a defender. Good technique with both feet. Clean ball striking. Good lower body drive with slightly choppy running style. (AJ)","category":null,"status":null,"role_name":"True #9 (Target)"}]},{"key":"elliot goldthorp","name":"Elliot Goldthorp","class":"Junior","position":"CAM","positions":["CAM"],"position_full":"Attacking Mid","foot":null,"country":"England","dob":null,"team":"Des Moines Menace","school":"Des Moines Menace","intl":true,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2023],"year":2023,"category":null,"status":"USL C Lexington","rolenum":10,"n_reports":1,"reports":[{"dates":["07/28/2023"],"match":"Des Moines Menace vs Flint City Bucks","team":"Des Moines Menace","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"10-AMF-10 1","jersey":10,"position":"CAM","position_full":"Attacking Mid","foot":null,"class":"Junior","country":"England","year":2023,"file":"match-year: 2023 report","body":"Tough game for Goldthorp. Showed some flashes of the elite ball control, technical quality, off-ball movement and soccer IQ that he has. However, struggled with his back to goal, didn’t combine well with the players around him, and was turnover prone. Could’ve been more creative and dynamic with his positioning and movement, I would’ve liked to see him drift out wide to receive to feet, drop deeper to receive, and try to be more involved. With the three Flint City CMs, Des Moines were largely outnumbered in the midfield, and I would’ve liked to see some more problem solving ability and adjusting from Goldthorp. Still a fantastic player who has the technical quality and soccer IQ to be an above-average USL C starter.","category":null,"status":"USL C Lexington","role_name":"Enganche (Playmaker #10)"}]},{"key":"evan rabush","name":"Evan Rabush","class":"Junior","position":"LB","positions":["LB"],"position_full":"Left Back","foot":null,"country":"USA","dob":null,"team":"Mary","school":"William & Mary","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":2,"n_reports":1,"reports":[{"dates":["11/02/2025","10/25/2025"],"match":"Mary vs Elon","team":"Mary","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"2-FB1","jersey":2,"position":"LB","position_full":"Left Back","foot":null,"class":"Junior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5’11”, skinny build. Wiry frame. Good stride length with clean feet and good pace. Good balance, especially when stepping forward to loose balls or defensive duels; good strength and physicality in contact. Tough. Quality first step and fluid hips. Flexible with good body control. Soft feet. Fluid and smooth movement profile. Good close down technique in duels, can press higher up the pitch without being beaten easily, arrives with balance and clean footwork. Quality defensive technique across the board, like the feet, balance, timing and footwork – although can get spun and turnt by 1v1 quickness when he doesn’t arrive on time. Technically sound and clean out the back. Comes inside to help build in a 3, as a RF LB. Has a bit of forward projection with solid timing – again is hampered here as a RF LB. Good IQ and reading of the game. Connects well and can slip 5-15 yd forward entries into the feet of advanced players. Has a bit of 1v1 change of pace and pop to get a step on a defender. Strong in the air. See more at RB next year. (AJ)","category":null,"status":null,"role_name":"Wing Back"}]},{"key":"henry wassarman","name":"Henry Wassarman","class":"Freshman","position":"RCB","positions":["RCB"],"position_full":"Right Center Back","foot":null,"country":"USA","dob":null,"team":"Boston College","school":"Boston College","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2025],"year":2025,"category":null,"status":null,"rolenum":3,"n_reports":1,"reports":[{"year":2025,"grade":"C/C","grade_present":"C","grade_future":"C","position":"RCB","position_full":"Right Center Back","foot":null,"dates":["10/25/2025","11/01/2025"],"match":"Boston College vs Notre Dame","source":"Video","role_code":"3-CB3","role_name":"Ball-Playing CB","jersey":3,"body":"6’2”, skinny build. Solid feet. Clean out the back with good circulation. Good composure under pressure and can play quicker when pressed to break pressure. Okay passing range with okay technique on longer diagonals and balls in-behind. Steps strong with timing to intercept and disrupt entries into FWDs feet. Gets tight early in 1v1 situations, and while has just okay feet, uses his length and timing to tackle. Ball playing CB that’s young with good size, and good out the back. Small sample of games but see more next year. (AJ)","class":"Freshman","country":"USA","team":"Boston College","status":null,"file":"manual entry"}]},{"key":"jaylen yearwood","name":"Jaylen Yearwood","class":"Senior","position":"RWB","positions":["RWB"],"position_full":"Right Wingback","foot":null,"country":"USA","dob":null,"team":"North Florida","school":"NCAA Tournament 1st Round, North Florida","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2024],"year":2024,"category":null,"status":null,"rolenum":2,"n_reports":1,"reports":[{"dates":["11/21/2024"],"match":"North Florida vs West Virginia","team":"North Florida","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"2-FB1","jersey":2,"position":"RWB","position_full":"Right Wingback","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6’0”, lean build. Good athlete. Can project forward. Gets up and down. Good agility and feet. Defensively strong. Held his own on the right side the entire match except for one moment when he dove in, let WVU LW cut inside and find a back-post ball for the opening goal. Soft feet and good touch. Can combine and play out tight spaces on the sideline. Composure and good decision-making. Final product is just non-existent. Technique is okay. (AJ)","category":null,"status":null,"role_name":"Wing Back"}]},{"key":"jesper moksnes","name":"Jesper Moksnes","class":"Senior","position":"LCB","positions":["LCB"],"position_full":"Left Center Back","foot":null,"country":"Norway","dob":null,"team":"Davidson","school":"Davidson","intl":true,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2024],"year":2024,"category":null,"status":"Graduated","rolenum":4,"n_reports":1,"reports":[{"dates":["10/20/2024"],"match":"Davidson vs Duquesne","team":"Davidson","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"4-CB3","jersey":4,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"Senior","country":"Norway","year":2024,"file":"match-year: 2024 report","body":"6’2”, lean build. Excellent out the back. Fantastic passer. Great technique. Sees a lot of different entries. Good defender. Can defend with his back to goal. Solid athlete. Nothing special defensively, but fantastic out the back.","category":null,"status":"Graduated","role_name":"Ball-Playing CB"}]},{"key":"joe highfield","name":"Joe Highfield","class":"R-Sophomore","position":"AMF","positions":["AMF"],"position_full":"Attacking Mid","foot":null,"country":"USA","dob":null,"team":"Portland","school":"Portland","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":10,"n_reports":1,"reports":[{"dates":["10/10/2025"],"match":"Portland vs San Diego","team":"Portland","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"10-AMF-10 2","jersey":10,"position":"AMF","position_full":"Attacking Mid","foot":null,"class":"R-Sophomore","country":null,"year":2025,"file":"match-year: 2025 report","body":"6’4”, solid build. Okay strength. Good pace and acceleration. Gets above-average separation in space and is a downhill runner. Excellent first-few steps and initial burst. Above-average stride length helps pace and separation from defenders. Technically just okay, is prone to turnovers between the lines and struggles to consistently handle entries. Has good feel and some creativity around the 18-yard box. Good technique. Just doesn’t impact the game between the lines enough and in build phases. Only is a threat in attacking transition. Technically a bit too loose despite intriguing physical tools, decision-making and tactical just average as well, movement in-behind and into pockets doesn’t threaten enough. See more. (AJ)","category":null,"status":null,"role_name":"Modern 3-4-2-1 #10"}]},{"key":"joschi schelb","name":"Joschi Schelb","class":"Sophomore","position":"CM","positions":["CM"],"position_full":"Central Mid","foot":null,"country":"Germany","dob":null,"team":"Saint Francis PA","school":"UNC","intl":true,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2024],"year":2024,"category":null,"status":null,"rolenum":8,"n_reports":1,"reports":[{"dates":["11/14/2024","11/03/2024"],"match":"Saint Francis PA vs LIU","team":"Saint Francis PA","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"8-CMF-8 3","jersey":8,"position":"CM","position_full":"Central Mid","foot":null,"class":"Sophomore","country":"Germany","year":2024,"file":"match-year: 2024 report","body":"6’0”, lean build. Gets around. Solid work-rate. Moves well. Good feet. Okay pace and power. Good jumper. Tidy player. Clean on the ball. Great right foot and good technique. Two-footed. Smooth operator. Has some pop and get away off the dribble. Sees longer 30+ yd passes but doesn’t see the pass between the lines. Good recovery defender in midfield. Won’t break up much in-front but can recover and make an impact defensively. Has shown a strong ability to project forward from midfield and be a 3rd man runner. Has goals from these actions as well. Has a bit of composure in the final third and can put away chances. Tactically is solid. Doesn’t process it overly fast but is good enough. Plays with okay tempo and rhythm. Has better processing and feel in the final third when he projects forward. Won’t dominate and set tempo when deeper and supporting the build. Okay in tight spaces. Certainly, has something. Could develop into a solid USL Championship midfielder. But is playing at a level where he’s given more time and space than most D1 conferences will give you. (AJ)","category":null,"status":null,"role_name":"Jack of All Trades"}]},{"key":"jose perez","name":"Jose Perez","class":"Junior","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"USA","dob":null,"team":"Wake Forest","school":"Wake Forest","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":6,"n_reports":1,"reports":[{"dates":["08/24/2025"],"match":"Wake Forest vs UCF","team":"Wake Forest","source":"Stream","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Junior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5’8”, skinny build. Excellent technical quality. Polished passer with both feet. Assured in possession and rarely loses the ball. Simple, reliable passer with excellent ball circulation and connection. Defensive positioning is spotty and can leave gaps for opposition central entries. Need to see more defensively but excellent connector with good tempo, and good decision-maker. (AJ)","category":null,"status":null,"role_name":"True #6 (Double Pivot)"}]},{"key":"jose de la torre","name":"Jose de la Torre","class":"Sophomore","position":"CAM","positions":["CAM"],"position_full":"Attacking Mid","foot":null,"country":null,"dob":null,"team":"CS Fullerton","school":"CS Fullerton","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":8,"n_reports":1,"reports":[{"dates":["11/06/2025"],"match":"CS Fullerton vs UC Davis","team":"CS Fullerton","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"8-CMF-8 3","jersey":8,"position":"CAM","position_full":"Attacking Mid","foot":null,"class":"Sophomore","country":null,"year":2025,"file":"match-year: 2025 report","body":"5’7”, skinny build. Bright, mobile, active. Great initial burst with below-average separation over longer distances. Technically sound with good feet between the lines and in tight spaces. Strong ball control and manipulation. Good 1v1 burst and pop to take players on in transition. Soldi final ball and product - can be slightly inconsistent and can play too fast for his vision and quality. Drifts into pockets well to find and exploit space. Final product in the final third isn’t entirely there but has flashed well. Has some good upside. (AJ)","category":null,"status":null,"role_name":"Jack of All Trades"}]},{"key":"josh gordon","name":"Josh Gordon","class":"Junior","position":"LB/RB","positions":["LB/RB"],"position_full":"Left Back / Right Back","foot":null,"country":"Canada","dob":null,"team":"Kentucky","school":"Kentucky","intl":true,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":2,"n_reports":1,"reports":[{"dates":["11/13/2025","11/09/2025"],"match":"Kentucky vs UCF","team":"Kentucky","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"2-FB3","jersey":2,"position":"LB/RB","position_full":"Left Back / Right Back","foot":null,"class":"Junior","country":"Canada","year":2025,"file":"match-year: 2025 report","body":"6'0\" with a solid, thick, stocky build and a low center of gravity. Good pace and close-down speed with a strong first few steps. Very strong upper body and excellent physicality in duels; difficult to knock off balance and absorbs contact extremely well. Has the pace and athleticism not to get beaten easily off the dribble, and tackles with good force and timing. Excellent in 1v1 duels and commits fully when challenging. Steps hard to loose balls and entries into the OM/W with timing and strength. Reads runs in behind and drops to cover. Can occasionally get spun 1v1 by sharper, quicker attackers. Shows good enterprise down the flank. Technically just okay and doesn’t always sort his feet out cleanly; touch can be inconsistent, especially in tight spaces and under pressure. Good weaker left foot. Willing to take defenders on 1v1 to provide service, using small changes of pace, short touches, and body feints. Shows good ball control and manipulation overall and can cut onto either foot to deliver. End product lacks precision – tends to put balls into the mixer or into the general area of teammates rather than finding specific targets. Solid playing out from the back. Comfortable keeping it simple and can hit a good diagonal but doesn’t consistently provide ground progression or find solutions out of pressure. Has the athletic tools for the next level with some interesting technical and tactical traits, particularly his willingness to get forward and provide service even if the final ball still needs refining. (AJ)","category":null,"status":null,"role_name":"Defensive Fullback"}]},{"key":"junior diouf","name":"Junior Diouf","class":"Freshman","position":"ST","positions":["ST","FWD"],"position_full":"Striker","foot":null,"country":"Senegal","dob":null,"team":"Grand Canyon","school":"Grand Canyon","intl":true,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":9,"n_reports":2,"reports":[{"dates":["09/01/2025"],"match":"Grand Canyon vs Sacramento State","team":"Grand Canyon","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"9-FWD1","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Freshman","country":"Senegal","year":2025,"file":"match-year: 2025 report","body":"6’1”, lean, wiry, long levers, slender. Springy and explosive. Excellent change of pace and has natural acceleration. Poor upper body strength despite good frame. Excellent pace. Long strides means once he gets a bit of separation, he is gone. Slightly hard feet and inconsistent touch. But has quick feet and excellent ball manipulation in tight spaces for his frame and size. Not clean enough between the lines where his inconsistent touch and poor upper body strength means he gets knocked off the ball easily or fails to control entries. Does flash moments where he can play quickly and handle the ball cleanly. Good technique and clean ball-striker. Has the instincts and feel for the off-ball movements of a 9. Attacks the shoulder violently in transition moments but needs to do it more often in the build phase. Still learning when to go 1v1 vs defenders and when to play simple. Is a slamoly 1v1 attacker, uses his quick feet and lots of feints, cuts, and dips of the shoulder to gain a yard of separation. Has final product and finishes his chances. Athletic profiles, attacking instincts and quick feet for his size means he shows lots of potential if he improves his consistency and raises the floor of his play. Needs to play faster, offer more between the lines, and generally needs technical polish. Is a bit of a lottery currently, can either offer a poor turnover or an excellent piece of attacking play. Must see him vs better competition as well. CBs who can anticipate his running in-behind and can step to him aggressively between the lines can pose an issue. Certainly a GA candidate however, and the USL/MLS pro-environment has the potential to unlock European prospect.","category":null,"status":null,"role_name":"True #9 (Target)"},{"dates":["09/01/2025"],"match":"Grand Canyon vs Sacramento State","team":"Grand Canyon","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"9-FWD1","jersey":9,"position":"FWD","position_full":"FWD","foot":null,"class":"Freshman","country":null,"year":2025,"file":"match-year: 2025 report","body":"6’1”, lean and explosive with long strides, quick acceleration, and real separation pace. Instinctive mover who attacks the shoulder well and is a constant threat in transition. Slippery 1v1 with quick feet, refined ball manipulation for his frame, and clean ball-striking that gives him genuine final product. Still raw between the lines — first touch inconsistent, lacks upper-body strength, and struggles to hold play under pressure. High-variance profile: capable of a brilliant attacking action or a costly turnover in quick succession. Needs to improve technical consistency, decision-making rhythm, and physical robustness. Currently is far too big of a lottery/boom or bust player. Intriguing GA candidate; USL/MLS pro pathway could unlock a European ceiling given his athleticism, instincts, and 1v1 ability. (AJ)","category":null,"status":null,"role_name":"True #9 (Target)"}]},{"key":"kevin pierre","name":"Kevin Pierre","class":"Grad Student","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"USA","dob":null,"team":"Georgia Southern","school":"Georgia Southern","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":8,"n_reports":1,"reports":[{"dates":["11/10/2025","11/05/2025"],"match":"Georgia Southern vs UCF","team":"Georgia Southern","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"8-CMF-8 2","jersey":8,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Grad Student","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6'1\", lean, solid build with excellent athleticism and a powerful lower body that shows up in aerials, acceleration, and stability in duels. Movement profile is on the stiffer side with average agility and slightly heavy feet, which can hurt him in tight spaces and lead to the odd loose touch, but he’s still a strong carrier who can drive into space and manipulate the ball well when he’s facing forward. Technically just okay/solid: can take 1–2 extra touches, weight of pass is inconsistent (bouncing balls, wrong foot), and he can struggle with back to goal in the final third and in tight pockets, though he’s generally reliable enough in the pocket and okay on the half turn, connects play simply, and offers average progression with wide entries and the occasional ball in behind. Defensively he’s excellent in duels, with good positioning, timing, bite, and force, and he covers ground aggressively in transition, both facing his own goal and sideline to sideline. Has flashed third man and half-space runs, late box arrivals, and service when pushed higher, and overall has the athletic tools of a USL-level box-to-box midfielder who can win duels, cover ground, and give you functional on-ball output if he tidies up his tight-space play and final product. USL C starter/bench. (AJ)","category":null,"status":null,"role_name":"Box-to-Box Shuttler"}]},{"key":"mamadou diarra","name":"Mamadou Diarra","class":"Senior","position":"AMF","positions":["AMF"],"position_full":"Attacking Mid","foot":null,"country":"Mali","dob":null,"team":"Florida Atlantic","school":"Florida Atlantic","intl":true,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2024],"year":2024,"category":null,"status":"Graduated","rolenum":7,"n_reports":1,"reports":[{"dates":["11/17/2024","11/03/2024"],"match":"Florida Atlantic vs FIU","team":"Florida Atlantic","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"7-W2","jersey":7,"position":"AMF","position_full":"Attacking Mid","foot":null,"class":"Senior","country":"Mali","year":2024,"file":"match-year: 2024 report","body":"5’10”, lean build. Good athlete. Good pace and power. Strong legs. Energy and lung capacity. Okay feet. Slightly above-average fluidness for his build. Just okay between the lines. Not super clean and doesn’t see a ton in terms of final ball/laying-off. More vertical. Feels like a winger/striker, not someone who should be played centrally between the lines. Finds good space. Lively and dynamic. Wants to run at backlines and exploit the space behind. Has good feel for the game and nose for space in the final third. Has a good variety and curve with his movement. Makes good decisions. Defensively impacts the game with his willingness to press and defensive bite. Has some bite and ability to get stuck in. Technically okay. Technique is okay. Combination of athleticism, frame, and feel for the game in the final third stands out. Technically needs a touch of polish but would be fine at winger or striker at the next level. Has poaching ability and final product. Strong on the dribble, provides 1v1 pop and acceleration. Doesn’t have a ton of tricks but can take a risk and create a yard of space 1v1. I like him at winger where he provides a serious threat on the backside for crosses, can use his variety of movements to exploit the space behind, and can provide a defensive and pressing presence. Just doesn’t have hold-up play/between the lines play to be a 9 at the next level. Could also be a solid wing-back options in a 3-back and has flashed above-average defensive output. Has the tools. Would be a solid USL C addition for any side, with a high floor and medium-high ceiling. (AJ)","category":null,"status":"Graduated","role_name":"Vertical Grinder"}]},{"key":"mason sullivan","name":"Mason Sullivan","class":"Sophomore","position":"LCB","positions":["LCB"],"position_full":"Left Center Back","foot":null,"country":"USA","dob":null,"team":"Wake Forest","school":"Wake Forest","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":4,"n_reports":1,"reports":[{"dates":["08/24/2025"],"match":"Wake Forest vs UCF","team":"Wake Forest","source":"Stream","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"4-CB3","jersey":4,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"Sophomore","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6’5”, skinny build. Excellent technique and left foot. Clean ball-striker with weight, timing, and texture. Excellent distribution out the back. Has a variety of entries, can break lines with ground splitting entries, has the channel ball in-behind into the 9 or the diagonal into the weakside winger, all with consistent execution. Can fall into the habit of playing direct too often. Ball-playing defender that intercepts and anticipates well. Must see more in terms of 1v1 defending and hasn’t been tested. Is vulnerable off the shoulder and has average recovery pace with medium strides. Monitor closely. (AJ)","category":null,"status":null,"role_name":"Ball-Playing CB"}]},{"key":"micah garnette","name":"Micah Garnette","class":"Junior","position":"LWB","positions":["LWB"],"position_full":"Left Wingback","foot":null,"country":"USA","dob":null,"team":"Portland","school":"Portland","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":5,"n_reports":1,"reports":[{"dates":["10/10/2025"],"match":"Portland vs San Diego","team":"Portland","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"5-FB1","jersey":5,"position":"LWB","position_full":"Left Wingback","foot":null,"class":"Junior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5’10”, solid, stocky build. Good pace and acceleration. Ability to separate in open-field and space. Showed good enterprise and work-rate down the flank from LWB. Projects forward cleanly and can provide high quality service. Clean left footed ball striker. Good physical tools and athlete. Technically sound. See more. (AJ)","category":null,"status":null,"role_name":"Wing Back"}]},{"key":"mikkel madsen","name":"Mikkel Madsen","class":"Freshman","position":"LCB","positions":["LCB"],"position_full":"Left Center Back","foot":null,"country":null,"dob":null,"team":"Dayton","school":"Dayton","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":4,"n_reports":1,"reports":[{"dates":["08/31/2025"],"match":"Dayton vs Oakland","team":"Dayton","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"4-CB3","jersey":4,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"Freshman","country":null,"year":2025,"file":"match-year: 2025 report","body":"6’0”, lean, left-footed centre-back with a light frame. Technically sound with a clean left foot, smooth side-to-side movement, and comfort progressing play from the back. Sees and executes line-splitting passes above average, giving him value as a ball-playing option. Defensively, solid in 1v1s with quick feet to mirror attackers, but not particularly sharp or aggressive in the tackle. Can be passive when stepping into forwards between the lines, allowing 9s to lay off and spin. Shows good recovery speed and anticipation to cover ground when exposed. Overall, a feel-based, progressive defender who looks composed and reliable, but still needs to prove he can handle stronger competition — both in wide 1v1 defending and against physical centre-forwards. (AJ)","category":null,"status":null,"role_name":"Ball-Playing CB"}]},{"key":"mouhammed ibrahim","name":"Mouhammed Ibrahim","class":"Sophomore","position":"CAM","positions":["CAM"],"position_full":"Attacking Mid","foot":null,"country":"Ghana","dob":null,"team":"VCU","school":"VCU","intl":true,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":9,"n_reports":1,"reports":[{"dates":["11/01/2025"],"match":"VCU vs Davidson","team":"VCU","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"9-FWD1","jersey":9,"position":"CAM","position_full":"Attacking Mid","foot":null,"class":"Sophomore","country":"Ghana","year":2025,"file":"match-year: 2025 report","body":"5’7”, skinny build. Excellent pace. Combines it with good movement into the channels and half-spaces. Great mobility and lung capacity. Clean and good ball-striker. Technically can be loose and play too fast for his feet and technical quality. Has some good 1v1 pop and acceleration to create half a yard. Isn’t overly clean on the turn and in tight spaces. Can be a box to box 8 that can run the half-spaces and provide service or a winger at the next level. Needs to tighten up technical quality however, and decision-making can be spotty in the final third. (AJ)","category":null,"status":null,"role_name":"True #9 (Target)"}]},{"key":"moussa ndiaye","name":"Moussa Ndiaye","class":"Junior","position":"CB","positions":["CB"],"position_full":"Center Back","foot":null,"country":"Senegal","dob":null,"team":"Davidson","school":"Davidson","intl":true,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2024],"year":2024,"category":null,"status":null,"rolenum":4,"n_reports":1,"reports":[{"dates":["10/10/2024"],"match":"Davidson vs VCU","team":"Davidson","source":"Live","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"4-CB1","jersey":4,"position":"CB","position_full":"Center Back","foot":null,"class":"Junior","country":"Senegal","year":2024,"file":"match-year: 2024 report","body":"6’, solid, lean build. Sharp into the tackle. Very good defending with his back to goal. Reads the game well and times his challenges. Wins a lot of tackles. Very good out the back. Can find an entry and slip midfielders. Sees it well. Can get caught over the top, however. We found our 2nd goal from a ball over his shoulder, and he was caught out. Has the athletic tools and technical tools, however. Two-footed. Good technique. USL C starter/USL C bench. (AJ)","category":null,"status":null,"role_name":"Leader of the Line"}]},{"key":"nacho martinez","name":"Nacho Martinez","class":"Sophomore","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"Argentina","dob":null,"team":"West Virginia","school":"West Virginia","intl":true,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":6,"n_reports":1,"reports":[{"dates":["11/05/2025","11/01/2025"],"match":"West Virginia vs South Carolina","team":"West Virginia","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Sophomore","country":"Argentina","year":2025,"file":"match-year: 2025 report","body":"5’9”, skinny build. Low center of gravity. Good, clean, quick feet. Solid pace. Okay burst. Okay strength but great balance. Consistently clean technically and in the pocket. Drifts to find a variety of areas on the field to support ball progression and has good body shape to receive and continue circulating the ball. Not a great tempo setter, just a consistent circulator. Okay technique on diagonals and longer passes, with average passing range. Ball progression is just okay, consists of shorter 5-15 yard wide entries. Can get slightly rushed under pressure. Good in tight spaces. Patient in tackles, and strong 1v1 defender in transition when having to defend space. Excellent timing in duels. Doesn’t vacate the space unnecessarily. Would be a good USL 6, but is just solid at everything, doesn’t excel in any category. (AJ)","category":null,"status":null,"role_name":"True #6 (Double Pivot)"}]},{"key":"nathan simes","name":"Nathan Simes","class":"Senior","position":"FWD","positions":["FWD"],"position_full":"FWD","foot":null,"country":"New Zealand","dob":null,"team":"Wofford","school":"Wofford","intl":true,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":9,"n_reports":1,"reports":[{"dates":["10/08/2025","10/01/2025"],"match":"Wofford vs Gardner-Webb","team":"Wofford","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"9-FWD1","jersey":9,"position":"FWD","position_full":"FWD","foot":null,"class":"Senior","country":"New Zealand","year":2025,"file":"match-year: 2025 report","body":"6’, lean, solid build. Good work-rate and industry. Good size. Movement and athletic profile wise on the stiffer side. Okay feet. Excellent movement. Finds and exploits space in-behind and checks into pockets to link play. Great feel for the game. Technically just okay. Entries stick well but speed of play and quality between the lines is inconsistent. Largely links play with simple passes and connections with an occasional final ball and ability to spin a defender. USL L1 starter/bench, has some good tactical aspects but technical and physical are below USL Championship average. Transfer from Fordham. (AJ)","category":null,"status":null,"role_name":"True #9 (Target)"}]},{"key":"nicholas simmonds","name":"Nicholas Simmonds","class":"Freshman","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"USA","dob":null,"team":"Virginia Cavaliers","school":"Virginia Cavaliers","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":9,"n_reports":1,"reports":[{"dates":["08/21/2025"],"match":"Virginia Cavaliers vs San Diego St.","team":"Virginia Cavaliers","source":"Stream","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"9-FWD1","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Freshman","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6’4”, stocky, thick build. Okay feet for his size. Okay pace, good power. Good jumper. Showed some good hold up play moments when dropping in. Entries stick well, largely plays simple between the lines. Struggles in 1v1 scenarios when defenders get tight to him due to just okay feet and agility. Provides good running up top and has good mobility. Flashed elite poaching instincts and movement in the box but must see more. Needs to show better link-up play and better creativity and progression between the lines. Clean and powerful ball-striker. Solid feel and soccer IQ. Just a freshman in his first game but track closely. Jamaica U18. (AJ)","category":null,"status":null,"role_name":"True #9 (Target)"}]},{"key":"nick lockermann","name":"Nick Lockermann","class":"Junior","position":"LB","positions":["LB"],"position_full":"Left Back","foot":null,"country":"Germany","dob":null,"team":"Vermont","school":"North Carolina","intl":true,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":5,"n_reports":1,"reports":[{"dates":["10/19/2025"],"match":"Vermont vs New Hampshire","team":"Vermont","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"5-FB1","jersey":5,"position":"LB","position_full":"Left Back","foot":null,"class":"Junior","country":"Germany","year":2025,"file":"match-year: 2025 report","body":"5’11”, solid thick build. Just okay feet. Good balance and sturdiness. Good frame for height. Okay technically. On the stiffer side movement. Okay ball striking and texture. Solid in duels, good physicality and timing into the challenge. Projects forward with average endeavor and cleanliness, can be slow to recognize the moments to change and pace and accelerate higher up the field. Final product is just okay, tends to float crosses into the mixer. Largely simple out the back. Good technique on set-pieces and when given time and space, drops off under pressure. Just solid all-round. On the older side for a junior. USL L1 starter. (AJ)","category":null,"status":null,"role_name":"Wing Back"}]},{"key":"nico cavallo","name":"Nico Cavallo","class":"Senior","position":"LB","positions":["LB"],"position_full":"Left Back","foot":null,"country":null,"dob":null,"team":"Davidson Wildcats","school":null,"intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2023],"year":2023,"category":null,"status":null,"rolenum":5,"n_reports":1,"reports":[{"dates":["09/03/2023"],"match":"Davidson Wildcats vs Virginia Tech","team":"Davidson Wildcats","source":null,"grade":"C/B","grade_present":"C","grade_future":"B","role_code":"5-LB1-5","jersey":5,"position":"LB","position_full":"Left Back","foot":null,"class":"Senior","country":null,"year":2023,"file":"match-year: 2023 report","body":"Tough game for Cavallo as well. Got beat 1v1 for the lone V-Tech goal. Didn’t solve problems, break lines, and play quick combinations out of the build phase like he can. Went long too often. Too much dribbling and not enough dialogue with the midfield when he did project forward and received the ball. Davidson’s formation and structure doesn’t do him a ton of favors as well. Not his best game by any means.","category":null,"status":null,"role_name":"Wing Back"}]},{"key":"nikola markovic","name":"Nikola Markovic","class":"Sophomore","position":"LCB","positions":["LCB"],"position_full":"Left Center Back","foot":null,"country":"Canada","dob":null,"team":"NC State","school":"NC State","intl":true,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":3,"n_reports":1,"reports":[{"dates":["09/06/2025"],"match":"NC State vs North Carolina","team":"NC State","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"3-CB1","jersey":3,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"Sophomore","country":"Canada","year":2025,"file":"match-year: 2025 report","body":"6’4”, 205 lbs, powerful frame with strong lower body giving drive and stability. Right-footed but plays LCB, keeping distribution clean and simple. Circulates possession at a steady tempo with solid press resistance and composure under pressure, though vision and ball progression are only average — occasional entries come through carries or when afforded time. Defensively strongest facing forward: aggressive into challenges, tackles with real force, and covers ground well with medium strides. Can look stiff and divey in 1v1s, relying on size and timing to recover, which may be exposed against quicker, more agile attackers. Despite size, only average in the air, lacking timing and authority on defensive headers. Will track into wide areas and defend off the shoulder, but recovery against balls in behind is limited by pace and anticipation. (AJ)","category":null,"status":null,"role_name":"Leader of the Line"}]},{"key":"noah de blasis","name":"Noah De Blasis","class":"Sophomore","position":"RCB","positions":["RCB"],"position_full":"Right Center Back","foot":null,"country":"Canada","dob":null,"team":"Louisville","school":"Louisville","intl":true,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":3,"n_reports":1,"reports":[{"dates":["11/06/2025","10/31/2025"],"match":"Louisville vs NC State","team":"Louisville","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"3-CB2","jersey":3,"position":"RCB","position_full":"Right Center Back","foot":null,"class":"Sophomore","country":"Canada","year":2025,"file":"match-year: 2025 report","body":"6'3\" with a skinny build. Shows good pace, quick initial burst. Feet are above average and he moves laterally well. Not especially physical in duels and carries only okay upper-body strength. Defensively, he prioritizes protecting the space in behind and is more of a sweeper than a front-foot stopper. Rather than following FWDs between the lines to disrupt their hold-up play, he prefers to make the first contact, then drop off and re-engage once they’re forward-facing or forced negative. Positions himself well to protect depth and rarely gets beaten off the shoulder, though he can drop too deep at times and needs to step higher when FWDs receive. When he engages early, he can be strong in duels, using his above-average feet and nimbleness to win tackles. Solid 1v1 defender with the lateral agility to mirror and jockey, but his timing into challenges can improve. On the ball, he’s just okay out the back. Long-ball technique is below average, press resistance is limited, and his circulation is only serviceable. Offers little true ball progression in build situations. (AJ)","category":null,"status":null,"role_name":"Big Athletic Presence"}]},{"key":"noah holmstrom","name":"Noah Holmstrom","class":"Sophomore","position":"RCB","positions":["RCB"],"position_full":"Right Center Back","foot":null,"country":"USA","dob":null,"team":"Georgia Southern","school":"Georgia Southern","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":3,"n_reports":1,"reports":[{"dates":["11/10/2025"],"match":"Georgia Southern vs UCF","team":"Georgia Southern","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"3-CB2","jersey":3,"position":"RCB","position_full":"Right Center Back","foot":null,"class":"Sophomore","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6’2”, thick, solid lean build. Below-average pace and acceleration. Just okay feet. Good lower body sturdiness and thickness. Okay balance. Aggressive front footed defender that thrives in duels when facing forward. Steps strong and with good timing to knock away entries and deny 9s with their back to goal. Below-average feet shows up when defending 1v1 in space, is a liability to get beat in-behind due to below-average pace, sometimes makes up for it with timing into the challenge. Solid out the back with good circulation, but can play faster. Lacks forward ball progression and the ability to fire entry passes. Solid technique on longer balls although doesn’t hit them very often. USL C starter/bench. (AJ)","category":null,"status":null,"role_name":"Big Athletic Presence"}]},{"key":"noeh hernandez","name":"Noeh Hernandez","class":"Senior","position":"RM","positions":["RM"],"position_full":"Right Mid","foot":null,"country":"USA","dob":null,"team":null,"school":null,"intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2023],"year":2023,"category":null,"status":null,"rolenum":7,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"7-W3","jersey":7,"position":"RM","position_full":"Right Mid","foot":null,"class":"Senior","country":"USA","year":2023,"file":"match-year: 2023 report","body":"Skinny build. Good technical player. Plays with good tempo and rhythm. Can combine out of things and play one touch. Has some good ideas with the ball on the pass. Average athlete. Final ball needs consistency but has shown flashes. Not much there in terms of final product or final third creativity. Has some good ideas between the lines. Can be turnover prone between the lines. Played RM but a 10 or 8. Need to see him more centrally. Not a winger.","category":null,"status":null,"role_name":"Inverted Winger"}]},{"key":"quin delamater","name":"Quin DeLaMater","class":"Senior","position":"RCBRB","positions":["RCBRB"],"position_full":null,"foot":null,"country":"RCB RB","dob":null,"team":"Boston University","school":"Boston University","intl":true,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":3,"n_reports":2,"reports":[{"dates":["08/21/2025"],"match":"Boston University vs New Hampshire","team":"Boston University","source":"Stream","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"3-CB1","jersey":3,"position":null,"position_full":null,"foot":null,"class":"Senior","country":"RCB RB","year":2025,"file":"match-year: 2025 report","body":"6’2”, lean, solid build. Entry, technique, big presence. Excellent technique and has a variety of entry balls. Can play a touch faster out the back but has above-average vision for entry and forward pass. Good diagonal. Doesn’t drive and carry into space. Just okay feet for his size. Can be casual out the back and does delivery some difficult/bouncing passes. Excellent long-range passing and good range. Diagonals and balls in-behind have excellent weight and accuracy, with timing. Can be casual and imprecise on 5-15 yards entries and passes out the back which can be polished and cleaned up with more attention to detail. Strong and covers depth well. Must see more regarding defending 1v1 and covering depth. (AJ)","category":null,"status":null,"role_name":"Leader of the Line"},{"dates":["08/21/2025"],"match":"Boston University vs New Hampshire","team":"Boston University","source":"Stream","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"3-CB1","jersey":3,"position":"RCBRB","position_full":"RCBRB","foot":null,"class":"Senior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6’2”, lean, solid build. Entry, technique, big presence. Excellent technique and has a variety of entry balls. Can play a touch faster out the back but has above-average vision for entry and forward pass. Good diagonal. Doesnt drive and carry into space. Just okay feet for his size. Can be casual out the back and does delivery some difficult/bouncing passes. Excellent long range passing and good range. Diagonals and balls in-behind have excellent weight and accuracy, with timing. Can be casual and imprecise on 5-15 yards entries and passes out the back which can be polished and cleaned up with more attention to detail. Strong and covers depth well. Have to see more regarding defending 1v1 and covering depth. Got cramps towards the end of the game despite being around 70 degrees in NH, so might’ve just been feeling a touch heavy legged and not 100% to start the year.","category":null,"status":null,"role_name":"Leader of the Line"}]},{"key":"riley moloney","name":"Riley Moloney","class":"Freshman","position":"LB","positions":["LB"],"position_full":"Left Back","foot":null,"country":"England","dob":null,"team":"NC State","school":"NC State","intl":true,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":5,"n_reports":1,"reports":[{"dates":["08/21/2025"],"match":"NC State vs Queens","team":"NC State","source":"Stream","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"5-FB1","jersey":5,"position":"LB","position_full":"Left Back","foot":null,"class":"Freshman","country":"England","year":2025,"file":"match-year: 2025 report","body":"5'11\", lean build. Smooth, technically sound, projects forward, good left foot. Decision-making is average. Soft feet and comfortable on the ball. Excellent technique and has some vision and forward progression with the pass. Just like his makeup, savviness and comfort on the ball. Monitor. (AJ)","category":null,"status":null,"role_name":"Wing Back"}]},{"key":"riley thomas","name":"Riley Thomas","class":"Grad Student","position":"RB","positions":["RB"],"position_full":"Right Back","foot":null,"country":"USA","dob":null,"team":null,"school":"MLS NP","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2024],"year":2024,"category":null,"status":"25 Dr Austin","rolenum":2,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":null,"grade":"C/B","grade_present":"C","grade_future":"B","role_code":"2-FB3","jersey":2,"position":"RB","position_full":"Right Back","foot":null,"class":"Grad Student","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6’0”, 170lbs. Thick, upper-body–heavy build with strong physical presence in contact. Upper body strength allows him to run wingers off the line or disrupt attackers trying to turn between the lines, but build is over-proportioned to lower body, leading to just okay drive, footwork, and balance. Prone to slipping or losing footing when planting and changing direction. Closes aggressively in 1v1 duels and can impose himself physically, but tendency to dive in leaves him vulnerable to quick changes of direction. Solid pace with adequate recovery speed, though hip mobility is average and overall movement is a touch stiff. Speed of play and processing are serviceable but inconsistent—can appear casual on video but has sharp reactions in longer pressing jumps and transition moments. Technically secure enough in tight spaces to connect and combine, showing occasional forward pass recognition and short bursts of 1v1 dribble ability. Projects forward with average coverage; crossing output is limited to 1–2 per game with service quality that lacks precision and creativity, often delivered into general areas rather than targeted. Aggressive and tough in duels, but further improvement in lower-body mechanics, balance, and speed of play would enhance overall reliability.","category":null,"status":"25 Dr Austin","role_name":"Defensive Fullback"}]},{"key":"sean albittron","name":"Sean Albittron","class":"Freshman","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"USA","dob":null,"team":"Fairfield","school":"Fairfield","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":9,"n_reports":1,"reports":[{"dates":["11/06/2025"],"match":"Fairfield vs Sacred Heart","team":"Fairfield","source":"Video","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"9-FWD2","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Freshman","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6’1”, lean build. Long, lanky, good stride, good pace. Solid feet for size. Okay strength, below-average physicality for size. Good instincts to attack the space in-behind. Powerful and technical ball striker with good finishing. Just okay between the lines and has below-average hold-up play and physicality up top. Gets knocked off the ball too easily by CBs. Just okay in the air. Provides good running and mobility in-behind, using his longer stride and pace and good instincts. Movement needs more diversity, and lacks a bit of finesse between the lines, and physicality up top, but finds moments to attack the space in-behind in attacking transition to bury a chance. Austin and RSL Academy, dual Costa Rica and US passport. (AJ)","category":null,"status":null,"role_name":"Poacher / Finisher"}]},{"key":"shakir nixon","name":"Shakir Nixon","class":"Sophomore","position":"RB","positions":["RB"],"position_full":"Right Back","foot":"Right","country":"USA","dob":null,"team":"UCLA","school":"UCLA","intl":false,"grade":"B/B","grade_val":7,"grade_val_present":7,"grade_present":"B","grade_future":"B","years":[2025,2026],"year":2026,"category":null,"status":null,"rolenum":2,"n_reports":2,"reports":[{"year":2025,"grade":"B/B","grade_present":"B","grade_future":"B","position":"RB","position_full":"Right Back","foot":null,"dates":["09/01/2025","08/25/2025"],"match":"UCLA vs Kentucky","source":"Video","role_code":"2-FB1","role_name":"Wing Back","jersey":2,"body":"5’11”, lean build with slightly long levers. Moves with good pace and easy acceleration, using medium-to-long strides and creating clear separation in open space. Strong progressive dribbler and ball carrier—carries and glides into midfield or space during transitions and from the build-up phase. Absorbs contact well and is difficult to stop once he gains separation. Can break pressure and skip past challenges, though not overly press-resistant. Technically serviceable but not standout. Below-average processing speed and inconsistent tempo in possession. Passing can be hesitant and lacks crispness, leading to avoidable turnovers. Right-footed technique is adequate with average ball striking. Frequently cuts inside onto his left to escape pressure, but left foot is poor. Shows flashes of 1v1 ability and could be more aggressive attacking defenders down the line. Projects forward cleanly with his athleticism, though does so less often than expected given his tools. Final product is okay. Defensively, is strong in 1v1 situations—uses quick feet, balance, and athleticism to mirror and stand up attackers effectively. Overall, he has the athletic profile to play at the next level, but his technical quality and tactical understanding need polish. (AJ)","class":"Sophomore","country":"USA","team":"UCLA","status":null,"file":"manual entry"},{"year":2026,"grade":"B/B","grade_present":"B","grade_future":"B","position":"RB","position_full":"Right Back","foot":"Right","dates":["09/01/2026"],"match":"Denver","source":"Video","role_code":"2-FB1","role_name":"Wing Back","jersey":2,"body":"Has improved from last year. Smooth ball carrier, fluid athlete, decision making with the ball has gotten much better. Is being played in an ideal RWB 352 for his skillset. Can pass and run forward with the ball. Has good ability to project forward into the final third. Average ball-striker and crossing technique, can put a decent ball in but is inconsistent. Still has the tendency to overplay with the pass and dribble out the back leading to turnovers. Excellent defensive qualities.","class":"Sophomore","country":"USA","team":"UCLA","status":null,"file":"manual entry"}]},{"key":"taig healy","name":"Taig Healy","class":"Senior","position":"CAM","positions":["CAM"],"position_full":"Attacking Mid","foot":null,"country":"USA","dob":null,"team":"NC State","school":"NC State","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2024,2025],"year":2025,"category":null,"status":null,"rolenum":10,"n_reports":2,"reports":[{"dates":[],"match":"NC State vs Charlotte","team":"NC State","source":"Live","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"10-AMF-10 1","jersey":10,"position":"CAM","position_full":"Attacking Mid","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5’7”, skinny build. Creator. Fantastic technical quality. Has eyes in the back of his head – vision for the pass is excellent. Can pick locks and find final balls. Plays with tempo and urgency. Dangerous in the final third. Has final product. Good close ball control. High soccer IQ and tactical understanding. Unique profile. Came alive in the 2nd half and made a big difference. Set-up two prime scoring chances with his final ball. Volleyed a 2nd ball off a corner which thundered into the post. Set up the game winner with a fantastic final ball with his signature left foot. Just has ‘it’ factor when it comes to creating in the final third. Uses fantastic weight and timing on his through ball as well. Good off-ball movement and finds good pockets. Lacks 1v1 ability and not great at creating his own space. But excellent at finding and exploiting space. (AJ)","category":null,"status":null,"role_name":"Enganche (Playmaker #10)"},{"dates":["08/21/2025"],"match":"NC State vs Queens","team":"NC State","source":"Stream","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"10-AMF-10 1","jersey":10,"position":"CAM","position_full":"Attacking Mid","foot":null,"class":"Senior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5’7”, skinny build. Elite vision for the final pass and technique. Superb left foot. Creative with high level processing. Can get a bit disconnected from the game and not impact it off the ball. Average pace and poor lower body drive. Had some loose turnovers trying to combine and play 1-2s in the middle of the park. Flashed his elite technical and tactical tools but lacked some consistency and polish today. Still has the unique creativity and soccer IQ to impact the game with the ball at any moment, just has to be cleaner between the lines in build and transition moments. (AJ)","category":null,"status":null,"role_name":"Enganche (Playmaker #10)"}]},{"key":"theo harris","name":"Theo Harris","class":"Sophomore","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"USA","dob":null,"team":"Rhode Island","school":"Rhode Island","intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2025],"year":2025,"category":null,"status":null,"rolenum":9,"n_reports":1,"reports":[{"dates":["10/11/2025","11/01/2025"],"match":"Rhode Island vs Davidson","team":"Rhode Island","source":"Live","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"9-FWD1","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Sophomore","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6’2”, lean, solid build. Good frame and size. Good pace and strength. Makes first contact with the CBs and can provide physicality up top with his size, frame, and density. Just okay feet – can be slow to sort them out but when he does can link play nicely with simple one-touch layoffs and slips. Good in the air. Provides solid running in-behind. Solid technique. Solid feel for the game. Overall, lacks a bit of finesse and feel to his game but physicality makes up for it and has solid technical and tactical tools. (AJ)","category":null,"status":null,"role_name":"True #9 (Target)"}]},{"key":"trey gardiner","name":"Trey Gardiner","class":"Senior","position":"CB","positions":["CB"],"position_full":"Center Back","foot":null,"country":null,"dob":null,"team":"Davidson Wildcats","school":null,"intl":false,"grade":"C/B","grade_val":7,"grade_val_present":4,"grade_present":"C","grade_future":"B","years":[2023],"year":2023,"category":null,"status":null,"rolenum":4,"n_reports":1,"reports":[{"dates":["09/03/2023"],"match":"Davidson Wildcats vs Virginia Tech","team":"Davidson Wildcats","source":null,"grade":"C/B","grade_present":"C","grade_future":"B","role_code":"4-CB2-3","jersey":4,"position":"CB","position_full":"Center Back","foot":null,"class":"Senior","country":null,"year":2023,"file":"match-year: 2023 report","body":"Not his best game. Did well a couple times not to let Escoe win the ball when V-Tech went long. Struggled at times to deal with the direct play and took too many touches. Wasn’t as assured and confident stepping into midfield, winning duels and being a big athletic presence. Struggled to break lines in the build against a very basic mid-block. Didn’t make an impact on set piece offense or defense.","category":null,"status":null,"role_name":"Big Athletic Presence"}]},{"key":"zach zengue","name":"Zach Zengue","class":"Senior","position":"LW","positions":["LW"],"position_full":"Left Wing","foot":null,"country":null,"dob":null,"team":"Ge B/B-","grade_present":"B","grade_future":"B-","role_code":"3-CB2","jersey":3,"position":"RCB","position_full":"Right Center Back","foot":null,"class":"Grad Student","country":"Ghana","year":2024,"file":"match-year: 2024 report","body":"6’4”, lean, muscular build. Elite athlete. Pro frame. Athletic upside. Set-piece threat. Excellent in the air. Good right foot and solid technique. Can find an entry and slip a midfielder when not pressured and given time. However, struggles and is very turnover prone when pressured. Good lateral movement and covers depth well. Athletic ability and technical quality projects, but tactical and decision-making doesn’t. USLC starter/bench. (AJ)","category":null,"status":"Graduated","role_name":"Big Athletic Presence"}]},{"key":"ian pilcher","name":"Ian Pilcher","class":"Senior","position":"LCB","positions":["LCB"],"position_full":"Left Center Back","foot":null,"country":"USA","dob":null,"team":"Charlotte 49ers","school":"Charlotte 49ers","intl":false,"grade":"B/B-","grade_val":6,"grade_val_present":7,"grade_present":"B","grade_future":"B-","years":[2024],"year":2024,"category":null,"status":"25 Dr San Diego","rolenum":4,"n_reports":3,"reports":[{"dates":["08/24/2024"],"match":"Charlotte 49ers vs Davidson Wildcats","team":"Charlotte 49ers","source":"Stream","grade":"B/B-","grade_present":"B","grade_future":"B-","role_code":"4-CB1","jersey":4,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6’1”, 154lbs. Wiry and lean with medium frame. Just solid all-round. Don’t make mistakes. Covers depth well, wins duels, knocks down entries, steps into midfield. Technically solid and plays simple for the most part. Technique is okay, doesn’t stand out. Genuine set piece threat. Got up for a great near-post flick header for a goal. Just a good college soccer CB but doesn’t have any unique physical, tactical or technical attributes to help him make the jump to a USL C or MLS level. B- projection. (AJ)","category":null,"status":"25 Dr San Diego","role_name":"Leader of the Line"},{"dates":["08/24/2024"],"match":"Charlotte 49ers vs Davidson Wildcats","team":"Charlotte 49ers","source":"Stream","grade":"B/B-","grade_present":"B","grade_future":"B-","role_code":"4-CB1","jersey":4,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"Solid game for Pilcher who did well vs a dynamic NC State attack for large portions of the game. Karamoko rarely was able to expose in open space and both of NC State goals weren’t on him but were just moments of excellent quality from Taig Healy and a set-piece 2nd ball. However, Charlotte got pinned in because of his lack of ability to find entries, break lines, and poor ball-playing ability under pressure. NC State rank high in all the pressing metrics and pressed Charlotte high up the field. Pilcher was unable to help Charlotte sustain possession and get a hold of the game, and constantly turned it over when jumped. Just doesn’t meet the minimum requirements of playing out the back as a CB at the professional. Can’t find the entry and struggles massively when pressed. (AJ)","category":null,"status":"25 Dr San Diego","role_name":"Leader of the Line"},{"dates":["09/21/2024"],"match":"Charlotte 49ers vs USF Bulls","team":"Charlotte 49ers","source":"Live","grade":"B/B-","grade_present":"B","grade_future":"B-","role_code":"4CB1","jersey":4,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"Senior","country":null,"year":2024,"file":"match-year: 2024 report","body":"6’2”, lean build. Smart. Steps well, reads the game, covers depth. Excellent anticipation and processing of the game. Knows how to defend. Excellent positioning. Rarely makes mistakes. Has vision and technique for entry when give time and space. Technique is okay but a bit awkward. Isn’t smooth on the ball. Passing and playing out the back lacks fluidity. Under pressure is a liability. Isn’t convincing when jumped, gets rushed and hurried. Can get handled by stronger attackers and has below average size. Balance and physicaly is okay. USLC bench/USL L1 starter. (AJ)","category":null,"status":null,"role_name":"Leader of the Line"}]},{"key":"prince amponsah","name":"Prince Amponsah","class":"Grad Student","position":"LCB","positions":["LCB"],"position_full":"Left Center Back","foot":null,"country":"USA","dob":null,"team":"Wake Forest Deamon Deacons","school":"Wake Forest Deamon Deacons","intl":false,"grade":"B/B-","grade_val":6,"grade_val_present":7,"grade_present":"B","grade_future":"B-","years":[2024],"year":2024,"category":null,"status":"MLS NP NYCFC","rolenum":4,"n_reports":1,"reports":[{"dates":["09/14/2024"],"match":"Wake Forest Deamon Deacons vs Virginia Cavaliers","team":"Wake Forest Deamon Deacons","source":"Live","grade":"B/B-","grade_present":"B","grade_future":"B-","role_code":"4-CB3","jersey":4,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"Grad Student","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5’11”, thicker lean build, wiry. Good left foot. Sees the entry and has the left foot to execute it. Has vision for the forward pass. Ball playing CB. Can break lines. Not afraid to drive into midfield. Can take more advanced positions in the build phase as well to pin teams into their mid/low blocks. Did well to find multiple entries into Niang’s and the 9s feet in the final third as Virginia sat off. Defensively, isn’t entirely convincing. Has some shaky moments. Good talker and communicator. Good player but I am not entirely convinced. Technical ability to play out projects but defensive technique and overall consistency does not. USLC bench/USL League One starter. (AJ)","category":null,"status":"MLS NP NYCFC","role_name":"Ball-Playing CB"}]},{"key":"sam bassett","name":"Sam Bassett","class":"Senior","position":"LM","posi ass":"Junior","country":"Spain","year":2023,"file":"match-year: 2023 report","body":"5’8”, skinny build. Very lively. Good athlete, lung capacity, and covers a lot of ground. Has some solid defensive attributes at the 9. Solid soccer IQ and tactical understanding. Good technical quality and technique. Processes the game and plays a step-ahead. Not an in-behind threat but is a proper false 9. Loves to drop into pockets, drop deep, and look to lay-off to the wingbacks, or slip a ball in-behind. The vision when playing between the lines is good, knows how to find the right pass. Can lay off to the wingbacks, 10 or opposing 9, can look to slip the wingbacks or 9 in-behind, can look to turn and combine with the 10 or 9. Has a variety of link up and hold up play traits. Needs the ball to feet though, very under-sized and won’t win aerial duels. Movement in and around the box is just okay, isn’t a great poacher. A good operator in tight spaces, in the final third, between the lines, is a threat as a false 9 and makes the right decision often. Lacks 1v1 and goal threat however. (AJ)","category":null,"status":null,"role_name":"False 9 / 2nd Striker"}]},{"key":"yuki sekiguchi","name":"Yuki Sekiguchi","class":"Sophomore","position":"W","positions":["W"],"position_full":"Winger","foot":null,"country":"Japan","dob":null,"team":null,"school":"Tulsa","intl":true,"grade":"C+/B-","grade_val":6,"grade_val_present":5,"grade_present":"C+","grade_future":"B-","years":[2023],"year":2023,"category":null,"status":null,"rolenum":11,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"C+/B-","grade_present":"C+","grade_future":"B-","role_code":"11-W2","jersey":11,"position":"W","position_full":"Winger","foot":null,"class":"Sophomore","country":"Japan","year":2023,"file":"match-year: 2023 report","body":"5’6”, skinny build. Very shifty and agile winger. Solid pressing and defensive attributes. Has some solid 1v1 ability, has a few tricks but nothing special. Aggressive presser from minute one. Solid pace. Good off-ball movement can run in-behind or cut inside. Weak foot is solid, isn’t a liability but isn’t a strength. Good technical quality and soccer IQ. Can make an impact when given time and space to operate but struggles to create in non-isolated moments. Decent player. (AJ)","category":null,"status":null,"role_name":"Vertical Grinder"}]},{"key":"abdel talabi","name":"Abdel Talabi","class":"Grad Student","position":"RB/RCB","positions":["RB/RCB"],"position_full":"Right Back / Right Center Back","foot":null,"country":"USA","dob":null,"team":"Bryant","school":"Bryant","intl":false,"grade":"C/B-","grade_val":6,"grade_val_present":4,"grade_present":"C","grade_future":"B-","years":[2025],"year":2025,"category":null,"status":null,"rolenum":3,"n_reports":1,"reports":[{"dates":["10/21/2025","09/24/2025"],"match":"Bryant vs Princeton","team":"Bryant","source":"Video","grade":"C/B-","grade_present":"C","grade_future":"B-","role_code":"3-CB2","jersey":3,"position":"RB/RCB","position_full":"Right Back / Right Center Back","foot":null,"class":"Grad Student","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6’2”, lean, solid build with above-average levers. Good strength in duels and contact. Pace and acceleration are average. Movement profile is underscored by slight stiffness in lateral agility and a below-average pivot/hip turn that shows when defending 1v1 in space, off the shoulder, or when recovering after stepping high. Good reach in duels and tackles; thicker, strong lower body gives force and drive, and he times engagements well with average balance. Despite the slight physical limitations, his reach and timing make him an above-average 1v1 defender. Can occasionally fail to fully close space and give the attacker half a yard—he tends to protect depth first before stepping in, consistent with slightly heavy feet and a stiffer turning profile. Technically solid. Clean playing out from 5–20 yards. Technique is below average on longer balls and diagonals. Handles pressure well enough to find simple connections and can play into the front four’s feet, though the entry ball isn’t always clean. Slightly above-average ball progressor overall, but the underlying stiffness and heavy feet can surface despite a sound technical base and general passing cleanliness. Aerial ability is just okay—doesn’t excel here. Played CF last year; RCB the two years prior. This season has been a stay-at-home RB, RCB, and LCB. Weaker left foot is good enough to cover LCB in a pinch. Projects as an average USL starting-caliber RCB with limited upside given age and general movement profile. (AJ)","category":null,"status":null,"role_name":"Big Athletic Presence"}]},{"key":"babacar niang","name":"Babacar Niang","class":"Senior","position":"LW","positions":["LW"],"position_full":"Left Wing","foot":null,"country":"Senegal","dob":null,"team":"Wake Forest Deamon Deacons","school":"Wake Forest Deamon Deacons","intl":true,"grade":"C/B-","grade_val":6,"grade_val_present":4,"grade_present":"C","grade_future":"B-","years":[2024],"year":2024,"category":null,"status":"24 Dr Minnesota 78th","rolenum":11,"n_reports":1,"reports":[{"dates":["09/14/2024"],"match":"Wake Forest Deamon Deacons vs Virginia Cavaliers","team":"Wake Forest Deamon Deacons","source":"Live","grade":"C/B-","grade_present":"C","grade_future":"B-","role_code":"11-W","jersey":11,"position":"LW","position_full":"Left Wing","foot":null,"class":"Senior","country":"Senegal","year":2024,"file":"match-year: 2024 report","body":"5’11”, thicker sturdy build. Good pace. Willing to take risks and drive at backlines. Willing to go 1v1. Dynamic off the dribble. But he was very wasteful in the final third vs Virginia. Didn’t show ability to provide service. Went 1v1 multiple times and it led to turnovers and transition moments. Didn’t create enough. Wasn’t his best game but flashed his dynamic ability off the dribble and willingness to take a risk in
