 center of gravity effectively to stay engaged in 1v1s and defensive duels. Timing in these duels is a real strength. Technically good and generally solid playing out from the back, though he can get rushed under pressure. Below-average passing range with okay technique over distance, but he shows good quality in tight spaces, using his quick feet and burst to escape pressure. Right-footed player currently used on the left side, so he often tucks inside to form a back three in build-up. USL L1 starter right now, would like to see mor at RB next year. SKC academy. (AJ)","category":null,"status":null,"role_name":"Inverted Fullback"}]},{"key":"matthew roou","name":"Matthew Roou","class":"Senior","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"USA","dob":null,"team":"Notre Dame","school":"Notre Dame","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024],"year":2024,"category":null,"status":"Graduated","rolenum":9,"n_reports":1,"reports":[{"dates":["11/07/2024","11/02/2024"],"match":"Notre Dame vs Stanford","team":"Notre Dame","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"9-FWD3","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5’11”, lean build. Okay athlete. Good feet. Soccer athletic. Soft feet. Technically sound. Clean between the lines. Uses subtle movements to provide an option for the entry ball. Has feel for the back to goal play. Plays simple and efficient. Won’t find a final ball but will connect and link the backline/midfield to the forwards and attacking midfielders. Drags CBs into midfield with his movement. Solid. Okay poacher. Can occasionally threaten in-behind and run off the shoulder. Good right foot. Won’t hurt you. Not a risk-taker. Safe player. Would be a solid player in USL. (AJ)","category":null,"status":"Graduated","role_name":"False 9 / 2nd Striker"}]},{"key":"michael asare","name":"Michael Asare","class":"Sophomore","position":"RW","positions":["RW"],"position_full":"Right Wing","foot":null,"country":"Ghana","dob":null,"team":"Boston College","school":"Boston College","intl":true,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2025],"year":2025,"category":null,"status":null,"rolenum":7,"n_reports":1,"reports":[{"dates":["08/21/2025"],"match":"Boston College vs Binghampton","team":"Boston College","source":"Stream","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"7-W2","jersey":7,"position":"RW","position_full":"Right Wing","foot":null,"class":"Sophomore","country":"Ghana","year":2025,"file":"match-year: 2025 report","body":"6’0”, skinny and light build. Fantastic pace and first step. Powerful drive and explosion. Fantastic runner and easy and loose change of pace. Finds and attacks space in-behind and has top-end/elite separation and get-away speed. Poor technique and poor right foot. Zero final product and poor finisher. Disconnected from the game in build and defenses phases and only excels in transition moments. Zero back to goal profile and won’t support build phases with movement towards to the ball. (AJ)","category":null,"status":null,"role_name":"Vertical Grinder"}]},{"key":"momo diop","name":"Momo Diop","class":"Senior","position":"LW","positions":["LW"],"position_full":"Left Wing","foot":null,"country":"Senegal","dob":null,"team":"Iona","school":"Iona","intl":true,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024],"year":2024,"category":null,"status":null,"rolenum":11,"n_reports":1,"reports":[{"dates":["11/17/2024"],"match":"Iona vs Rider","team":"Iona","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"11-W1","jersey":11,"position":"LW","position_full":"Left Wing","foot":null,"class":"Senior","country":"Senegal","year":2024,"file":"match-year: 2024 report","body":"6’2”, skinny build. Okay pace. Okay power. Certainly, wants it at his feet more instead of running in-behind. Okay feet. Technically solid. Not great in tight spaces. Good final third play. Strong combination play and 1-2s with teammates. Has final product and consistent finishing. Has a bit of 1v1 pop and trickery and can cut onto both feet but is more right footed. Solid winger. Nothing special. Makes okay decisions on the ball. Movement in-behind is lacking. (AJ)","category":null,"status":null,"role_name":"Chalk-on-Boots Winger"}]},{"key":"nick relerford","name":"Nick Relerford","class":"Senior","position":"RB","positions":["RB"],"position_full":"Right Back","foot":null,"country":"USA","dob":null,"team":"Cal St. Fullerton","school":"Cal St. Fullerton","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2025],"year":2025,"category":null,"status":null,"rolenum":2,"n_reports":1,"reports":[{"dates":["11/06/2025","11/02/2025"],"match":"Cal St. Fullerton vs UC Davis","team":"Cal St. Fullerton","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"2-FB1","jersey":2,"position":"RB","position_full":"Right Back","foot":null,"class":"Senior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5’9”, thick, stocky build. Excellent lower body explosion and pace. Low center of gravity. Excellent initial burst with solid separation over distances. Fluid and loose athlete. Good feet and lateral movement. Technically sound. Can be a bit turnover prone with the pass and isn’t press resistance. But breaks pressure using his burst, through dribbling and ball carrying with strong ball manipulation and control. Active and energetic down the flank. Okay ability to project forward and use a change of pace to provide service, but technique and final product isn’t there. Can project forward more. Sharp into duels with the athletic ability to defend 1v1, timing, feet and solid technique. Defensive awareness and IQ is just okay, tends to get disconnected from the back 4 and ball watch, either stepping too high or dropping off too deep to protect in-behind. Pace, acceleration, and dribbling technique stands out but can be more effective with his tools. USL L1 starter. (AJ)","category":null,"status":null,"role_name":"Wing Back"}]},{"key":"philip hildebrandt","name":"Philip Hildebrandt","class":"Gr","position":"RB","positions":["RB"],"position_full":"Right Back","foot":null,"country":"Denmark","dob":null,"team":"FIU Panthers","school":null,"intl":true,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2023],"year":2023,"category":null,"status":"Graduated","rolenum":2,"n_reports":1,"reports":[{"dates":["10/08/2023"],"match":"FIU Panthers vs SMU Mustangs vs","team":"FIU Panthers","source":null,"grade":"C/C","grade_present":"C","grade_future":"C","role_code":"2-FB2","jersey":2,"position":"RB","position_full":"Right Back","foot":null,"class":"Gr","country":"Denmark","year":2023,"file":"match-year: 2023 report","body":"6’2”, big, thick frame. Really good technique. Can play out of tight spots and is a good progressive passer thanks to his vision and technique. Can serve a great cross or ball. Wins his aerial duels because of his above average size. A bit stiff on the ball and defensively and lacks mobility. But good technical quality","category":null,"status":"Graduated","role_name":"Inverted Fullback"}]},{"key":"raphael kistmann","name":"Raphael Kistmann","class":"Sophomore","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"Brazil","dob":null,"team":"UMKC","school":"NCAA Tournament, UMKC","intl":true,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024],"year":2024,"category":null,"status":null,"rolenum":10,"n_reports":1,"reports":[{"dates":["12/01/2024","11/25/2024"],"match":"UMKC vs Pittsburgh","team":"UMKC","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"10-AMF-10 2","jersey":10,"position":"ST","position_full":"Striker","foot":null,"class":"Sophomore","country":"Brazil","year":2024,"file":"match-year: 2024 report","body":"6’0”, lean build. Mainly coming off the bench for them. Most likely because they play a true 532 and there’s not a ton of room for an AMF in that formation when you’d rather have two out and out 9s and three true midfielders. Tidy footballer. Smooth, glides with the ball. Technically sound. Has final product. Composure in the final third. Excellent body control. Aggressive presser. Good in tight spaces and can wiggle out of things. Just lacks execution in the final third. Has some good ideas and wants to be creative and dynamic but just doesn’t execute enough. Clean between the lines and is an above average connector. He is more of an 8/10 to me than a true 9. Struggles as a 9 and lacks the physicality and sharpness. Needs to play deeper and needs some polish. Has some technical quality though, smooth, fluid, easy on the eye. (AJ)","category":null,"status":null,"role_name":"Modern 3-4-2-1 #10"}]},{"key":"reid roberts","name":"Reid Roberts","class":"Sophomore","position":"CB","positions":["CB"],"position_full":"Center Back","foot":null,"country":"USA","dob":null,"team":null,"school":"Pacific Tigers","intl":false,"grade":"C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2023],"year":2023,"category":null,"status":"25 Dr San Jose","rolenum":3,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"C","grade_present":"C","grade_future":"C","role_code":"3-CB2","jersey":3,"position":"CB","position_full":"Center Back","foot":null,"class":"Sophomore","country":"USA","year":2023,"file":"match-year: 2023 report","body":"6’1”, stocky build. Monster athlete. Can cover depth, good recovery speed, great duel-winner, can win big headers. Dives in when defending 1v1 and doesn’t have great mobility and agility. Positioning is just okay. Struggles building out the back. Stiff on the ball, panicky and lacks composure. Can only plays sideways or backwards. Monster athlete, but doesn’t have the game reading, defending technique and building out the back quality to go with it. (AJ)","category":null,"status":"25 Dr San Jose","role_name":"Big Athletic Presence"}]},{"key":"riley lynch","name":"Riley Lynch","class":"Junior","position":"LW","positions":["LW"],"position_full":"Left Wing","foot":null,"country":"USA","dob":null,"team":null,"school":"St. Mary’s Gaels","intl":false,"grade":"C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2023],"year":2023,"category":null,"status":"24 Dr San Jose","rolenum":11,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"C","grade_present":"C","grade_future":"C","role_code":"11-W2","jersey":11,"position":"LW","position_full":"Left Wing","foot":null,"class":"Junior","country":"USA","year":2023,"file":"match-year: 2023 report","body":"5’10”, lean build. Great grinder. Covers a lot of ground. Great pace, lung capacity, running, and work-rate. Technique and technical quality are both solid. 1v1 ability is okay. Lacks high level tactical understanding and off-ball movement. He stays mostly wide and vertical, can get robotic and predictable. Final product is solid. Knows how to press and defensively gets the job done. Has some upside with his combination and link up play. But can play too fast for his technical quality and struggles between the lines and in tight spaces. Good athlete and grinder, but doesn’t have the tactical and technical upside to go with it. (AJ)","category":null,"status":"24 Dr San Jose","role_name":"Vertical Grinder"}]},{"key":"ryan baer","name":"Ryan Baer","class":"Grad Student","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"USA","dob":null,"team":"NCAA Tournament 1st Round West Virginia","school":"NCAA Tournament 1st Round West Virginia","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024],"year":2024,"category":null,"status":"25 Dr Seattle","rolenum":6,"n_reports":1,"reports":[{"dates":["11/21/2024"],"match":"NCAA Tournament 1st Round West Virginia vs North Florida","team":"NCAA Tournament 1st Round West Virginia","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Grad Student","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5’8”, lean build. Wasn’t impressed by him this game. Didn’t assert himself onto the game and frankly got dominated in midfield. As expected, was sideline to sideline, broke some stuff up, didn’t leave gaps in midfield, was very solid defensively. But on the ball? Just a connector. Didn’t set tempo or dictate in midfield. Doesn’t process the game fast enough and doesn’t see anything in terms of the forward pass or breaking a line. Can only play simple. Not good enough. (AJ)","category":null,"status":"25 Dr Seattle","role_name":"True #6 (Double Pivot)"}]},{"key":"slade starnes","name":"Slade Starnes","class":"Senior","position":"RCB","positions":["RCB"],"position_full":"Right Center Back","foot":null,"country":"USA","dob":null,"team":"Marshall","school":"Marshall","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2025],"year":2025,"category":null,"status":null,"rolenum":3,"n_reports":1,"reports":[{"dates":["10/23/2025","10/15/2025"],"match":"Marshall vs South Carolina","team":"Marshall","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"3-CB2","jersey":3,"position":"RCB","position_full":"Right Center Back","foot":null,"class":"Senior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6’3”, skinny build with good size and frame. Strong in the air. Movement profile is on the stiffer side—poor feet and lateral agility. Struggles to move his feet when defending 1v1 or in space. Aggressive, front-footed defender who thrives on stepping high and toughness in the tackle; goes to ground often. Shows good positioning and anticipation in the box. Technically solid with okay technique. Simple out the back. Limited ball progression and passing range—lacks a diagonal and is mostly restricted to side-to-side connections with occasional forward passes into the 6’s feet. Defensively, posture is poor in 1v1s and in space: doesn’t get low to mirror, stays too upright, and tends to swipe at the ball without balance or timing. Positioning between the lines is poor—consistently oversteps to attackers. Good frame and aggression, but limited elsewhere. FC Dallas academy. USL L1 player. (AJ)","category":null,"status":null,"role_name":"Big Athletic Presence"}]},{"key":"teva lossec","name":"Teva Lossec","class":"Senior","position":"LB","positions":["LB"],"position_full":"Left Back","foot":null,"country":null,"dob":null,"team":null,"school":"UNCG","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2025],"year":2025,"category":null,"status":null,"rolenum":5,"n_reports":1,"reports":[{"dates":["09/13/2025"],"match":null,"team":null,"source":"Live","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"5-FB1","jersey":5,"position":"LB","position_full":"Left Back","foot":null,"class":"Senior","country":null,"year":2025,"file":"match-year: 2025 report","body":"5’10” solid build. Good feet. Can tuck inside and invert. Steps well to wingers between the lines and sharp into the challenge. Comfortable in and out of tight spaces. Poor positioning across the back line and vulnerable on the outside shoulder. Both SC goals he gave the SC RW far too much space to exploit and got sucked in centrally. (AJ)","category":null,"status":null,"role_name":"Wing Back"}]},{"key":"theo klein","name":"Theo Klein","class":"Senior","position":"CM","positions":["CM"],"position_full":"Central Mid","foot":null,"country":"France","dob":null,"team":"Omaha","school":"Omaha","intl":true,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024],"year":2024,"category":null,"status":"Graduated","rolenum":8,"n_reports":1,"reports":[{"dates":["11/02/2024","10/17/2024"],"match":"Omaha vs St. Thomas","team":"Omaha","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"8-CMF-8 3","jersey":8,"position":"CM","position_full":"Central Mid","foot":null,"class":"Senior","country":"France","year":2024,"file":"match-year: 2024 report","body":"5’11”, lean build. Has moved deeper more to an 8/10 position where last year he was more of a false 9/2nd striker. Technically solid. Great technique, nice right foot. When given time and space he can find a forward pass and break a line. Forward thinking - is a willing combiner and 3rd man runner going forward. Has some ideas in the final third but doesn’t execute. Not great in tight spaces. Plays two-touch and is a good connector. Can lack composure and get rushed in midfield. But does find some smart little forward passes and exploits the space well with his above-average feel and processing of the game. Defensively is a zero. Tough projection because he doesn’t have the final ball/execution to be a 10. And doesn’t have the defensive traits to be a true 8. But isn’t technical enough and composed to be a 6. More of a box-to-box shuttler. I think he’d be a useful addition and a different profile in midfield for many USL teams, especially off the bench. USL bench/USL L1 starter. (AJ)","category":null,"status":"Graduated","role_name":"Jack of All Trades"}]},{"key":"tim timchenko","name":"Tim Timchenko","class":"Junior","position":"CB","positions":["CB"],"position_full":"Center Back","foot":null,"country":"Ukraine","dob":null,"team":"Iona Gaels","school":"Iona Gaels","intl":true,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2023],"year":2023,"category":null,"status":"Graduated","rolenum":4,"n_reports":1,"reports":[{"dates":["08/25/2023"],"match":"Iona Gaels vs Virginia Cavaliers","team":"Iona Gaels","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"4-CB2-3","jersey":4,"position":"CB","position_full":"Center Back","foot":null,"class":"Junior","country":"Ukraine","year":2023,"file":"match-year: 2023 report","body":"Big frame and size. Good in the air. But his ability to find players over the top with his right foot stood out. Picked some nice balls, skipping multiple lines, to players in space. Defended okay. Good technique and ability to play out. Need to see more.","category":null,"status":"Graduated","role_name":"Big Athletic Presence"}]},{"key":"timothy arias","name":"Timothy Arias","class":"Sophomore","position":"RB","positions":["RB"],"position_full":"Right Back","foot":null,"country":"Costa Rica","dob":null,"team":null,"school":"University of Central Florida","intl":true,"grade":"C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2023],"year":2023,"category":null,"status":null,"rolenum":2,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"C","grade_present":"C","grade_future":"C","role_code":"2- FB3","jersey":2,"position":"RB","position_full":"Right Back","foot":null,"class":"Sophomore","country":"Costa Rica","year":2023,"file":"match-year: 2023 report","body":"6’0, lean build. Fluid, strong, and good athlete. Smooth and powerful dribbler. Good progressive carrying and dribbling attributes. Technically sound. Body shape when receiving is good, opens the hips up, allows him to play forward. Technique is good. Solid tactical understanding and soccer IQ. Picks his moments to go forward well, but largely a stay-at-home RB. Showed good tactical understanding of when to stay narrow to let the winger hug sideline. Final product and crossing are non-existent. Offensive game needs work and improvement. Has shown some ability to break lines and pass forward. Is competent and efficient in possession. Upside on the duel winning front, aerial and ground. Will win most of them. But 1v1 defense technique is below-average, has shown a big tendency to dive in and get shook by body feints and a bit of patience. Has potential but needs polish in 1v1 defense technique, final product, and offensive game.","category":null,"status":null,"role_name":"Defensive Fullback"}]},{"key":"tyler trimnal","name":"Tyler Trimnal","class":"Senior","position":"ST","positions":["ST","FWD"],"position_full":"Striker","foot":null,"country":"USA","dob":null,"team":"South Carolina","school":"Clemson","intl":false,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024,2025],"year":2025,"category":null,"status":null,"rolenum":7,"n_reports":2,"reports":[{"dates":["11/25/2024","11/17/2024"],"match":"Clemson vs Wake Forest","team":"Clemson","source":"Video","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"7-W2","jersey":7,"position":"ST","position_full":"Striker","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6’3”, lean build. Excellent pace. Has all the physical tools. Good lung capacity and energy. Okay balance. A touch stiff. Physical tools project. Technically too loose. Entries don’t stick. Below-average in tight spaces. Below-average technical quality. Good movement into the channels. Provides a threat in-behind with his pace. Has good feel for the movement behind and in-front of backlines. Can drop in as well. Aggressive presser and does the defensive work. Struggles to create off the shot, pass or dribble. Not someone who can really hurt backlines and create/finish high-quality goal scoring chances. Doesn’t process it in the final third, lacks clarity of thought and decisiveness. Can find a pass or get his head up when given time and space in transition. Lacks 1v1 ability and final product. Just doesn’t have the technical quality or soccer IQ to impact the game at the pro level when time and spaces becomes more limited. Athletic tools project, but that’s it. USL is ceiling. (AJ)","category":null,"status":null,"role_name":"Vertical Grinder"},{"dates":["09/13/2025"],"match":"South Carolina vs UNC Greensboro","team":"South Carolina","source":"Live","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"7-W3","jersey":7,"position":"FWD","position_full":"FWD","foot":null,"class":"Senior","country":null,"year":2025,"file":"match-year: 2025 report","body":"6’0”, skinny build. Excellent pace but on the stiffer side. Feet are okay to poor, struggles to handle entries consistently. Light frame, lacks mass, and offers little in the air — doesn’t track aerial balls well. Work rate and mobility are good, but balance is poor. Technically loose and unreliable in tight spaces. Doesn’t provide hold-up play and rarely moves effectively into pockets between the lines. Can occasionally take an entry cleanly, spin a defender, and either pick a pass or drive at the backline, and can also get off the shoulder into the channel to chase balls in behind. However, these moments are inconsistent. Overall, a robotic player who lacks natural feel and technical quality, with limited reliability despite pace and the occasional clean action. USL L1 starter/bench. Transfer from Clemson. (AJ)","category":null,"status":null,"role_name":"Inverted Winger"}]},{"key":"ugo bertulli","name":"Ugo Bertulli","class":"Junior","position":"CM","positions":["CM"],"position_full":"Central Mid","foot":null,"country":"France","dob":null,"team":"Campbell","school":"Campbell","intl":true,"grade":"C/C","grade_val":4,"grade_val_present":4,"grade_present":"C","grade_future":"C","years":[2024],"year":2024,"category":null,"status":null,"rolenum":6,"n_reports":1,"reports":[{"dates":["09/03/2024"],"match":"Campbell vs Davidson","team":"Campbell","source":"Live","grade":"C/C","grade_present":"C","grade_future":"C","role_code":"6-CMF-6 1","jersey":6,"position":"CM","position_full":"Central Mid","foot":null,"class":"Junior","country":"France","year":2024,"file":"match-year: 2024 report","body":"5’6”, skinny build. Technically sound. High energy and has some pop. Good feel for the game and high IQ. Sees the forward pass. Good in tight spaces. Excellent ball progression. Can carry and pass into space and skip lines. Has feel for combinations and quick 1-2s. Polished player. Played really well the first half of the season but got hurt for the rest of the season. In the transfer portal, and one to keep an eye on for next year.","category":null,"status":null,"role_name":"True #6 (Double Pivot)"}]},{"key":"colin griffith","name":"Colin Griffith","class":"Senior","position":"LW","positions":["LW"],"position_full":"Left Wing","foot":null,"country":"USA","dob":null,"team":"NCAA Tournament Maryland","school":"NCAA Tournament Maryland","intl":false,"grade":"D/C","grade_val":4,"grade_val_present":1,"grade_present":"D","grade_future":"C","years":[2024],"year":2024,"category":null,"status":null,"rolenum":11,"n_reports":1,"reports":[{"dates":["11/25/2024","11/21/2024"],"match":"NCAA Tournament Maryland vs Wake Forest","team":"NCAA Tournament Maryland","source":"Video","grade":"D/C","grade_present":"D","grade_future":"C","role_code":"11-W1","jersey":11,"position":"LW","position_full":"Left Wing","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5’10”, lean build. Strong. Good pace and power. Solid athlete. On the stiffer side. Solid power. Good balance. Okay feet. Not great in tight spaces but can spin defenders and drive into space. Struggles in tight spaces up against the sideline when there isn’t space to exploit in-behind. Strong dribbler and difficult to disposes. Hard to stop when he is at full speed. Technically okay. Good passer 5-15 yds. Below-average technique on longer passes and crosses. Has a bit of 1v1 ability. Has a few tricks. Doesn’t execute, however, majority of the time. Lacks agility and quick feet to threaten 1v1. Has some 1v1 burst and pop. Poor decision-making in the final third, when to pass/shoot/dribble. Not efficient and clinical with his 1v1 chances and half-chances. Final product isn’t there. Struggles to impact the game off-the ball. Needs it at his feet all the time. Doesn’t threaten in-behind or cutting inside. Over-dribbles often in the final third. Has some athletic ability and is still figuring how to apply them with his technical and tactical quality. But right now, it largely isn’t there. (AJ)","category":null,"status":null,"role_name":"Chalk-on-Boots Winger"}]},{"key":"luka zajovic","name":"Luka Zajovic","class":"Freshman","position":"RB","positions":["RB"],"position_full":"Right Back","foot":null,"country":"USA","dob":null,"team":"South Florida","school":"South Florida","intl":false,"grade":"D/C","grade_val":4,"grade_val_present":1,"grade_present":"D","grade_future":"C","years":[2025],"year":2025,"category":null,"status":null,"rolenum":2,"n_reports":1,"reports":[{"dates":["11/08/2025"],"match":"South Florida vs Tulsa","team":"South Florida","source":"Video","grade":"D/C","grade_present":"D","grade_future":"C","role_code":"2-FB1","jersey":2,"position":"RB","position_full":"Right Back","foot":null,"class":"Freshman","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6’1”, long, lean build. Good frame and size. Movement profile is on the fluid side, good stride and pace, just okay feet. Right footed LB currently, that can project as a 6 or RB going forward. Lateral movement and feet are just okay which is why he can get spun when defending 1v1 attackers with quick feet. When given time and space, connects the game well and can find a good pace. Is a bit un-decisive and liable on the ball, especially when forced onto his right foot, under pressure. Soft and not strong in duels. Must see more at a better positional fit, but also hasn’t shown enough at LB currently. (AJ)","category":null,"status":null,"role_name":"Wing Back"}]},{"key":"nikola djordjevic","name":"Nikola Djordjevic","class":"Junior","position":"RB","positions":["RB"],"position_full":"Right Back","foot":null,"country":"USA","dob":null,"team":"SMU","school":"SMU","intl":false,"grade":"D/C","grade_val":4,"grade_val_present":1,"grade_present":"D","grade_future":"C","years":[2024],"year":2024,"category":null,"status":"25 Dr Vancouver","rolenum":2,"n_reports":1,"reports":[{"dates":["12/08/2024","12/01/2024"],"match":"SMU vs Marshall","team":"SMU","source":"Video","grade":"D/C","grade_present":"D","grade_future":"C","role_code":"2-FB1","jersey":2,"position":"RB","position_full":"Right Back","foot":null,"class":"Junior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5’9”, thick, stocky build. Strong. Good pace and power. Has a bit of getaway speed and pop. Technically sound. Has good close ball control but is turnover prone in tight spaces. Over-dribbler. Went 1v2 a few too many times. Good right foot and has okay final product. Decision-making is spotty, both defending and on the ball. Can step too high and get caught in-behind. Cuts-inside too often instead of playing simple. Doesn’t show with good angles, body-positioning when receiving and passing is poor. Defensively okay. Two-footed. Doesn’t see the entry ball and isn’t press-resistant. Struggled with the pace of play in the NCAA QF vs Marshall. Decision-making was slow and had multiple bad turnovers in his own third because of overdribbling and poor decision-making. Struggled defending 1v1 vs Dayton, dived in too often and poor positioning across the backline leaving space in-behind. (AJ)","category":null,"status":"25 Dr Vancouver","role_name":"Wing Back"}]},{"key":"ryan quintos","name":"Ryan Quintos","class":"Junior","position":"RCB","positions":["RCB"],"position_full":"Right Center Back","foot":null,"country":"USA","dob":null,"team":"Louisville","school":"Louisville","intl":false,"grade":"D/C","grade_val":4,"grade_val_present":1,"grade_present":"D","grade_future":"C","years":[2025],"year":2025,"category":null,"status":null,"rolenum":3,"n_reports":1,"reports":[{"dates":["09/27/2025","09/23/2025"],"match":"Louisville vs Duke","team":"Louisville","source":"Video","grade":"D/C","grade_present":"D","grade_future":"C","role_code":"3-CB1","jersey":3,"position":"RCB","position_full":"Right Center Back","foot":null,"class":"Junior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5’11”, skinny build, with a lower center of gravity and tidy feet. Below-average strength in duels and struggles to withstand contact, but uses quick feet and agility to nick the ball and time tackles. Defends well on the front foot when facing play; can dive in when isolated in the channel 1v1. In possession he’s just okay out from the back—adequate technique, can find the occasional slip or clipped pass between the lines, but mainly keeps circulation simple. Not especially press-resistant; under pressure tends to float long balls or take the safe connect, and he struggles to fire entries or consistently break lines. In the air his reach is limited, but he compensates with good jump timing. Overall just okay—nothing standout. USL L1 starter. (AJ)","category":null,"status":null,"role_name":"Leader of the Line"}]},{"key":"arik duncan","name":"Arik Duncan","class":"Junior","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"USA","dob":null,"team":null,"school":"California Golden Bears","intl":false,"grade":"D+","grade_val":2,"grade_val_present":2,"grade_present":"D+","grade_future":"D+","years":[2023],"year":2023,"category":null,"status":"25 Dr Montreal 44th","rolenum":7,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"D+","grade_present":"D+","grade_future":"D+","role_code":"7-W2","jersey":7,"position":"ST","position_full":"Striker","foot":null,"class":"Junior","country":"USA","year":2023,"file":"match-year: 2023 report","body":"6’4”, thick and stocky build. Big frame and size. Fantastic athlete but lacks top-end acceleration and pace over longer distances. He is technically sound. Good technique. Wins aerial duels, but can win more considering his size and height, especially from attacking set-pieces. Stiff on the ball. Not great in tight spaces. Struggles to dribble and play out of pressure, sticky spots or when pressed up against the sideline. Lacks the body control for his massive frame and size. Is turnover prone and decision-making can let him down. 1v1 ability is just okay. Isn’t a massive goal or transition threat for teams, mainly just a big body that is useful on set-pieces, back-stick service, foul-winning and duel winning. (AJ)","category":null,"status":"25 Dr Montreal 44th","role_name":"Vertical Grinder"}]},{"key":"bennett painter","name":"Bennett Painter","class":"Sophomore","position":"LW","positions":["LW"],"position_full":"Left Wing","foot":null,"country":"USA","dob":null,"team":"Bowling Green","school":"Indiana","intl":false,"grade":"C/D","grade_val":1,"grade_val_present":4,"grade_present":"C","grade_future":"D","years":[2024],"year":2024,"category":null,"status":null,"rolenum":11,"n_reports":1,"reports":[{"dates":["11/17/2024","11/11/2024"],"match":"Bowling Green vs Evansville","team":"Bowling Green","source":"Video","grade":"C/D","grade_present":"C","grade_future":"D","role_code":"11-W3","jersey":11,"position":"LW","position_full":"Left Wing","foot":null,"class":"Sophomore","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5’8”, lean build. Good athlete. Can get up and down. Good pace. Good feet. Soft feet. Technically sound. Solid player. Okay 1v1 ability. Can occasionally create a yard with a feint or change of pace. Okay technique. Can poach but won’t hurt you from 20+ yards with his final product. Safe player. Connects in the final third. Doesn’t see a ton with the pass. Can occasionally get you service. Presses well and gets up and down. Makes okay decisions in the final third. Not a pro. (AJ)","category":null,"status":null,"role_name":"Inverted Winger"}]},{"key":"camil azzam ruiz","name":"Camil Azzam Ruiz","class":"Grad Student","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"Spain","dob":null,"team":"Iona Gaels","school":null,"intl":true,"grade":"C/D","grade_val":1,"grade_val_present":4,"grade_present":"C","grade_future":"D","years":[2023],"year":2023,"category":null,"status":"Free Agent","rolenum":9,"n_reports":1,"reports":[{"dates":["08/25/2023"],"match":"Iona Gaels vs Virginia Cavaliers","team":"Iona Gaels","source":"Video","grade":"C/D","grade_present":"C","grade_future":"D","role_code":"9-FWD1","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Grad Student","country":"Spain","year":2023,"file":"match-year: 2023 report","body":"6’2”. Showed some flashes of fantastic hold-up and link up play. Worked hard to keep possession and win duels as Iona bunkered in. Had some moments of quality combinations. Didn’t show a ton in the final third and when given space to operate. But displayed great work-rate, bits of hold-up play and was a big physical presence all night long.","category":null,"status":"Free Agent","role_name":"True #9 (Target)"}]},{"key":"carlo cavalar","name":"Carlo Cavalar","class":"Senior","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"Germany","dob":null,"team":"Binghampton","school":"Binghampton","intl":true,"grade":"C/D","grade_val":1,"grade_val_present":4,"grade_present":"C","grade_future":"D","years":[2024],"year":2024,"category":null,"status":"Graduated","rolenum":6,"n_reports":1,"reports":[{"dates -footed. Has an okay left foot and solid right. Technique doesn’t stand out. Okay feel for the game and understanding. Wont vacate his position too much but can get forward. Great athlete, strong, moves well, covers ground, good agility. Powerful with above-average balance. Robust 1v1 defender. Moves his feet well and times his challenge. Strong into the tackle. Just okay on the ball. Can project forward but doesn’t provide much service or attacking threat. Just plays simple out the back. Occasionally can play forward and break a line. Lacks 1v1 ability and can’t create his own space. Can drive into open space with his solid pace and good power. Athletic ability can get ahead of his technical quality. Mainly an athlete, needs more technical and tactical polish to make the jump. (AJ)","category":null,"status":"LAFC MLS NP","role_name":"Defensive Fullback"}]},{"key":"lamar bynum","name":"Lamar Bynum","class":"Junior","position":"RB","positions":["RB"],"position_full":"Right Back","foot":null,"country":"USA","dob":null,"team":"SMU Mustangs","school":"SMU Mustangs","intl":false,"grade":"C/D","grade_val":1,"grade_val_present":4,"grade_present":"C","grade_future":"D","years":[2023],"year":2023,"category":null,"status":"Graduated","rolenum":2,"n_reports":1,"reports":[{"dates":["10/08/2023"],"match":"SMU Mustangs vs FIU Panthers","team":"SMU Mustangs","source":null,"grade":"C/D","grade_present":"C","grade_future":"D","role_code":"2-FB2","jersey":2,"position":"RB","position_full":"Right Back","foot":null,"class":"Junior","country":"USA","year":2023,"file":"match-year: 2023 report","body":"6’0”, big thick frame. Shocking on the ball and technically. Decision making is poor. But is a monster athlete who wins every duel, can grind, win 1v1 battles, and is an okay stay at home RB.","category":null,"status":"Graduated","role_name":"Inverted Fullback"}]},{"key":"trace terry","name":"Trace Terry","class":"Junior","position":"ST","positions":["ST"],"position_full":"Striker","foot":n od jumper and is a genuine set-piece threat. Technically below-average. Below-average technique. Poor positioning and body shape when playing and receiving out the back. Poor press-resistance. Mainly simple and side-to-side out the back. Doesn’t step to attackers between the lines well. Dives in and lets them turn. Doesn’t use his body well to steer attackers away from goal and deny space. Poor 1v1 defender. Lacks agility, patience and dives in. Not at the level and not a pro. (AJ)","category":null,"status":null,"role_name":"Leader of the Line"}]},{"key":"oje ofunfrien","name":"Oje Ofunfrien","class":"Junior","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"USA","dob":null,"team":null,"school":"Denver Pioneers","intl":false,"grade":"D","grade_val":1,"grade_val_present":1,"grade_present":"D","grade_future":"D","years":[2023],"year":2023,"category":null,"status":"Graduated","rolenum":9,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"D","grade_present":"D","grade_future":"D","role_code":"9-FWD2","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Junior","country":"USA","year":2023,"file":"match-year: 2023 report","body":"6’0”, lean build. Fantastic athlete. Excellent pace, aggressiveness, close-down speed, and work-rate. Tactically, just isn’t there for what you’d like to see out of your 9. Off-ball movement in-behind isn’t dangerous and threatening. He is always playing off the defender’s shoulder, doesn’t cut across, cut inside, cut outside-in etc., just doesn’t have enough variety to his movement. Soccer IQ and decision making is below-average to poor. Too many cheap giveaways and poor decisions in the final third. Technically, he is loose. Can win aerial and ground duels. Great pressing striker can close CBs and defenders fast. But lack the offensive skillset you’d like to see to complement his athletic ability. (AJ)","category":null,"status":"Graduated","role_name":"Poacher / Finisher"}]},{"key":"pietro fontana","name":"Pietro Fontana","class":"Sophomore","position":"CT","positions":["CT"],"position_full":"CT","foot":null,"country":"Italy","dob":null,"team":null,"school":"Central Arkansas","intl":true,"grade":"D","grade_val":1,"grade_val_present":1,"grade_present":"D","grade_future":"D","years":[2023],"year":2023,"category":null,"status":null,"rolenum":9,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"D","grade_present":"D","grade_future":"D","role_code":"9-FWD2","jersey":9,"position":"CT","position_full":"CT","foot":null,"class":"Sophomore","country":"Italy","year":2023,"file":"match-year: 2023 report","body":"5’11”. Skinny build. Good work-rate on both sides of the ball. Good in-behind threat/runner. Movement in-behind stands out the most, it is consistent, varied, and usually with good timing. Does well to press backlines and keeper, and for the most part uses proper curvature and angles, but can get loose and allow easy swings, and fail to cut the field in half. Hold up play, and decision making with back to goal is below-average – has shown flashes but is not consistent enough. Below-average size and jumping hurts him in aerial duels. Final third decision making, and overall product is below-average. Has some good attributes when facing goal, when he can use his above-average pace to knock it by defenders. But doesn’t have the 1v1 or change of pace that can complement the good pace. Right now, he is very one-paced and one dimensional. Can be turnover prone in the final third. Finishing and technique is good and shows composure when facing goal. (AJ)","category":null,"status":null,"role_name":"Poacher / Finisher"}]},{"key":"sebastien maza","name":"Sebastien Maza","class":"Sophomore","position":"CB","positions":["CB"],"position_full":"Center Back","foot":null,"country":null,"dob":null,"team":null,"school":"Cal Poly Mustangs","intl":false,"grade":"D","grade_val":1,"grade_val_present":1,"grade_present":"D","grade_future":"D","years":[2023],"year":2023,"category":null,"status":null,"rolenum":3,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"D","grade_present":"D","grade_future":"D","role_code":"3-RCB1","jersey":3,"position":"CB","position_full":"Center Back","foot":null,"class":"Sophomore","country":null,"year":2023,"file":"match-year: 2023 report","body":"6’2”, skinny build. Solid defensively. Has okay reading, anticipation and covers well. Good in the air. Duel-winning is good enough, but doesn’t stand out. Has okay technique. Playing out of the back and possession isn’t a strong suite. Mainly plays safe and simple. Struggles to pick out line breaking passes or hit accurate long balls. Can be prone to turnovers if pressured. Serviceable center-back with some solid athletic ability and okay technique.","category":null,"status":null,"role_name":"Leader of the Line"}]},{"key":"tom protzek","name":"Tom Protzek","class":"Junior","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"Germany","dob":null,"team":null,"school":"Tulsa Hurricane","intl":true,"grade":"D","grade_val":1,"grade_val_present":1,"grade_present":"D","grade_future":"D","years":[2023],"year":2023,"category":null,"status":null,"rolenum":9,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"D","grade_present":"D","grade_future":"D","role_code":"9-FWD3","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Junior","country":"Germany","year":2023,"file":"match-year: 2023 report","body":"5’9”, skinny build. Technically sound. Good work-rate and pressing ability. Aggressive. Good technique with his right foot. Solid pace. Solid player with his back to goal, plays simple and fast. Doesn’t offer a ton of final third product. Has shown flashes of smart passing, in terms of turning and slipping a forward in-behind. More of a false-9 or 10, than a true 9, but has some solid technical quality.","category":null,"status":null,"role_name":"False 9 / 2nd Striker"}]},{"key":"tomasso rossetto","name":"Tomasso Rossetto","class":"Grad Student","position":"LW","positions":["LW"],"position_full":"Left Wing","foot":null,"country":"Italy","dob":null,"team":null,"school":"Saint Joe’s","intl":true,"grade":"D/D","grade_val":1,"grade_val_present":1,"grade_present":"D","grade_future":"D","years":[2024],"year":2024,"category":null,"status":"Graduated","rolenum":11,"n_reports":1,"reports":[{"dates":["09/21/2024"],"match":null,"team":null,"source":"Video","grade":"D/D","grade_present":"D","grade_future":"D","role_code":"11-W2","jersey":11,"position":"LW","position_full":"Left Wing","foot":null,"class":"Grad Student","country":"Italy","year":2024,"file":"match-year: 2024 report","body":"6’1”, monster athlete. Can fly and get up and down. Good pace. Solid feet. Great frame and size. Lacks technical and tactical quality but has a bit of final product.","category":null,"status":"Graduated","role_name":"Vertical Grinder"}]},{"key":"turner humphrey","name":"Turner Humphrey","class":"R-Sophomore","position":"CB","positions":["CB"],"position_full":"Center Back","foot":null,"country":"USA","dob":null,"team":null,"school":"Portland Pilots","intl":false,"grade":"D","grade_val":1,"grade_val_present":1,"grade_present":"D","grade_future":"D","years":[2023],"year":2023,"category":null,"status":"24 Dr Dallas","rolenum":3,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"D","grade_present":"D","grade_future":"D","role_code":"3-CB2","jersey":3,"position":"CB","position_full":"Center Back","foot":null,"class":"R-Sophomore","country":"USA","year":2023,"file":"match-year: 2023 report","body":"6’4”, lean build. Fantastic in the air. Great aerial duel winner and is very good at defending the box. Is a threat on set-piece offense and defense. Strong, physical CB. But lacks mobility. Gets tunnel vision for the ball when defending 1v1, and often dives in with reckless abandon. Lacks the mobility and agility to recover from his poor 1v1 defending, so gets beat and spun by quicker, more agile, and smaller attackers. Very stiff defender and ball-playing CB. Is a safe player and only plays his neighbor. Technique is okay. Good at defending the box, but struggles to defend space, 1v1, and with his back to goal. (AJ)","category":null,"status":"24 Dr Dallas","role_name":"Big Athletic Presence"}]},{"key":"alex hall 2","name":"Alex Hall","reports":[{"year":2026,"grade":"B/A","grade_present":"B","grade_future":"A","position":"CMF","position_full":"Central Mid","foot":"Both","dates":["08/26/2026"],"match":"San Diego","source":"Video","role_code":"8-CMF-8 3","jersey":8,"body":"5'9\", skinny build. Excellent agility, feet, quickness and balance. Low to the ground. Has an excellent burst and initial few steps to separate from a defender. Does have good top-end pace with an average ability to separate. Excellent change of direction. Lacks physicality in duels. \n\nSuperb technically with soft, quick feet. Excellent first touch w/ natural, smooth, easy ball control and technique. Two-footed. Very comfortable on the ball in tight spaces and between the lines. Has some good 1v1 ability and can drive at backlines to create a yard of space to serve a cross or find a final pass. Excellent ability at getting to the end-line to provide cutbacks. Can combine between the lines with a change of pace, just superb at dribbling with the ball at his feet, at times seems faster with the ball then without. Good technique with both feet. Has the ability to slip a final pass and threaten with the shot and pass in the final third. Tendency to over dribble at times and can be liable to cheap turnovers with the pass when he tries too much.\n\nHigh IQ and good decision-maker overall. Currently is a hybrid inverted winger who can receive in the pocket but he also stays wide to receive to feet to go 1v1. Projects as a progressive 8 at the next level or an inside pocket player as an OM. Good defensively and has solid bite in duels with good work-rate. Sounders academy and could be a HG signing risk.","class":"Junior","country":"USA","team":"Washington Huskies","status":null,"file":"manual entry","role_name":"Jack of All Trades"}],"class":"Junior","position":"CMF","positions":["CMF"],"position_full":"Central Mid","foot":"Both","country":"USA","intl":false,"school":"Washington Huskies","team":"Washington Huskies","status":null,"dob":"10/24/05","grade":"B/A","grade_present":"B","grade_future":"A","grade_val":10,"grade_val_present":7,"years":[2026],"year":2026,"n_reports":1},{"key":"rocket ritarita","name":"Rocket Ritarita","reports":[{"year":2026,"grade":"C/B","grade_present":"C","grade_future":"B","position":"LW","position_full":"Left Wing","foot":"Both","dates":["08/26/2026"],"match":"New Haven and Pitt","source":"Video","role_code":"7-W1","role_name":"Chalk-on-Boots Winger","jersey":7,"body":"5'9\", light footed, agile, nimble, quick winger with good 1v1 ability, flair and final product.\n\nGood pace and first few steps. Slight build. Not overly powerful and lacking in ability to separate over big distances vs defender. Very quick/pacey in shorter distances and tight spaces. \n\nExcellent technically with excellent ball control and comfort. Smooth and creative dribbler with variety of tricks, feints, step overs etc. Has a bit of flair and personality on the ball. \n\nPrefers to receive to feet and attack 1v1 where he can take the defender onto his left and right, preferring his right. Has technique and polished final product with both feet, with powerful finishing technique with his right.  \n\nHas tools but is very erratic and direct. Can be one dimensional and easy to deal with. \n\nDoesnt threaten in-behind with his movement enough. Can struggle to link and combine play when he receives the ball to feet out-wide and bring others into the game. A bit one-dimensional in the final third and has average ability to threaten with the pass. Tendency to over-dribble on the ball and can play simple and quicker more often. Otherwise has unique tools. Charlotte FC and Atlanta United academy.","class":"Sophomore","country":"USA","team":"Maryland","status":null,"file":"manual entry"}],"class":"Sophomore","position":"LW","positions":["LW"],"position_full":"Left Wing","foot":"Both","country":"USA","intl":false,"school":"Maryland","team":"Maryland","status":null,"dob":null,"grade":"C/B","grade_present":"C","grade_future":"B","grade_val":7,"grade_val_present":4,"years":[2026],"year":2026,"n_reports":1},{"key":"loic sany kong","name":"Loic Sany Kong","reports":[{"year":2026,"grade":"C/B","grade_present":"C","grade_future":"B","position":"LW","position_full":"Left Wing","foot":"Left","dates":["08/27/2026"],"match":"USC Upstate","source":"Video","role_code":"7-W1","role_name":"Chalk-on-Boots Winger","jersey":7,"body":"6'1\", thick, solid build. Good frame and size. Explosive athlete with good pace, movement and acceleration. Good in tight spaces, combination play and has strong enterprise and endeavor down the left flank. Strong left footed technique which he uses to serve excellent dangerous crosses. Technically sound, good feet. Vertical winger with athleticism, technique and combination play. Would be a solid USL L1 player, and would be USL C bench at the moment. Continue monitoring.","class":"Junior","country":"Canada","team":"South Carolina","status":null,"file":"manual entry"}],"class":"Junior","position":"LW","positions":["LW"],"position_full":"Left Wing","foot":"Left","country":"Canada","intl":true,"school":"South Carolina","team":"South Carolina","status":null,"dob":null,"grade":"C/B","grade_present":"C","grade_future":"B","grade_val":7,"grade_val_present":4,"years":[2026],"year":2026,"n_reports":1},{"key":"oliver mollerjensen","name":"Oliver Moller-Jensen","reports":[{"year":2026,"grade":"B/B","grade_present":"B","grade_future":"B","position":"LW","position_full":"Left Wing","foot":"Right","dates":["09/11/2026"],"match":"Notre Dame, Evansville, Denver","source":"Video","role_code":"7-W3","role_name":"Inverted Winger","jersey":7,"body":"5'9\", lean build. Hybrid winger who can stay wide or come inside as a pocket player. Good physically with strong pace, fluid movement profile, good engine and stamina. Clean feet and very agile who is good in tight spaces. Easy acceleration to reach top speed, has a good burst. Above average in terms of pressing and duels for a W. Very fluid, smooth dribbler with the ball. Lovely technical quality. Soft feet. Has good ability to combine and bring others into the game with his clean first touch and good short to medium passing. Can link play in the pocket, but can also find progressive passes from deep and wide areas. Has strong movement in-behind and overall feel for the game. Has decent variety to his movement, both coming inside and running in-behind. Occasionally can drift from the game and not offer enough defensively when defending for stretches. Lacks verticality and directness. Good right footed ball-striker who can bury chances around the box but takes far too many long shots. Shot quality needs improvement. Okay 1v1 dribbler that is a bit one dimensional, is better in terms of running in-behind and link up play to create, not so much a high volume 1v1 attacker but is serviceable 1v1. Has some good tools to be a very good pro, transferred from FAU where he had 6 goals, 6 assists last year.","class":"Senior","country":"Denmark","team":"Indiana","status":null,"file":"manual entry"}],"class":"Senior","position":"LW","positions":["LW"],"position_full":"Left Wing","foot":"Right","country":"Denmark","intl":true,"school":"Indiana","team":"Indiana","status":null,"dob":"10/07/03","grade":"B/B","grade_present":"B","grade_future":"B","grade_val":7,"grade_val_present":7,"years":[2026],"year":2026,"n_reports":1},{"key":"ian shaul","name":"Ian Shaul","reports":[{"year":2026,"grade":"C/C","grade_present":"C","grade_future":"C","position":"CDM","position_full":"Defensive Mid","foot":"Right","dates":["08/27/2026"],"match":"Northwestern","source":"Video","role_code":"6-CMF-6 1","role_name":"True #6 (Double Pivot)","jersey":6,"body":"5'8\", stocky build. Covers tons of ground for 90 minutes and has an excellent engine. Otherwise, fairly average athlete, decent feet/agility, is low to the ground due to his size, has a little 3-5 yd burst to escape a tight space but that is it. Better defensively than with the ball in the pocket. Patient 1v1 defender who reads the game excellently to put out fires in transition moments. Doesn't dive in and moves his feet to force the attacker backwards or win the ball. On the ball is very simple and mainly is a connector who can occasionally progress the ball via line breaking passes or long balls. Has average technique and technical quality. Shows for it okay in the pocket, can move around too much instead of just sitting in the pocket to bounce and bump entries and keep things ticking. Overall just a solid college soccer CDM that could be a bench piece on a USL L1 team. Portland Timbers and MNUFC Academy.","class":"Junior","country":"USA","team":"Notre Dame","status":null,"file":"manual entry"}],"class":"Junior","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":"Right","country":"USA","intl":false,"school":"Notre Dame","team":"Notre Dame","status":null,"dob":null,"grade":"C/C","grade_present":"C","grade_future":"C","grade_val":4,"grade_val_present":4,"years":[2026],"year":2026,"n_reports":1},{"key":"caden grabfelder","name":"Caden Grabfelder","reports":[{"year":2026,"grade":"C/B","grade_present":"C","grade_future":"B","position":"CM","position_full":"Central Mid","foot":"Right","dates":["08/27/2026"],"match":"Maryland","source":"Video","role_code":"6-CMF-6 1","role_name":"True #6 (Double Pivot)","jersey":6,"body":"5'11\", skinny build. Soft and quick feet. Decent burst and pace. Nothing special athletically. Has good balance. Average athlete for a college 6, id say.\n\nTechnically very sound. Excellent right footed technique with power, shape and variety. A bit limited on the ball however, just connects the game simply and plays 2 touch. Good in tight spaces and can pass and dribble out of most sticky spots on the field. Just doesn't really impact the game as he should with his technical quality and technique. Has excellent set-piece service and ability to threaten goal from distance with his technique. Doesnt really have vision for the field and for the forward pass. Mostly plays the way he receives/faces. Decent defensively with okay bite and timing in duels. Just a tidy #6 that could make a USL L1 bench. Transfer from Penn State. Got drafted by Montreal in the 2025 Draft.","class":"Senior","country":"USA","team":"Pitt","status":null,"file":"manual entry"}],"class":"Senior","position":"CM","positions":["CM"],"position_full":"Central Mid","foot":"Right","country":"USA","intl":false,"school":"Pitt","team":"Pitt","status":null,"dob":null,"grade":"C/B","grade_present":"C","grade_future":"B","grade_val":7,"grade_val_present":4,"years":[2026],"year":2026,"n_reports":1},{"key":"donovan sessoms","name":"Donovan Sessoms","reports":[],"class":"Senior","position":"9","positions":["9"],"position_full":"9","foot":null,"country":null,"intl":null,"school":"USCB","team":"USCB","status":null,"dob":"07/23/03","grade":null,"grade_present":null,"grade_future":null,"grade_val":null,"grade_val_present":null,"years":[],"year":null,"n_reports":0},{"key":"donovan sessoms 2","name":"Donovan Sessoms","reports":[{"year":2026,"grade":"B/B+","grade_present":"B","grade_future":"B+","position":"RW","position_full":"Right Wing","foot":"Left","dates":["08/27/2026"],"match":"Marshall","source":"Video","role_code":"11-W2","role_name":"Vertical Grinder","jersey":11,"body":"Has all the tools to be a very good USL forward with MLS upside. 5’10”, lean, solid build. Physical profile with good frame and  a low center of gravity for his size. Good connector in midfield, fluidly linking play and showing glimpses of tempo-setting ability. Can set tempo more often and play with more rhythm and fluidity, speed of play can be inconsistent. Comfortable receiving in the pocket and keeping the game moving. High soccer IQ — often makes the right decision, usually the simple and secure option. Scans frequently and reads the game effectively. Defensively, breaks up play with sharp feet, a good first step, and strong anticipation. Can get divey when defending in open space and doesn’t always effectively delay in transition. Aggressive in 50/50s and reacts quickly to loose balls through sharp reading of play. Technically sound with soft feet, clean passing, and crisp ball-striking. Reliable under pressure. Average ball progressor — will find some forward passes and entries each game, but not at high volume. Okay in the air. Provides good set-piece delivery with his right foot, offering varied texture.","class":"Junior","country":"USA","team":"Furman","status":null,"file":"manual entry"}],"class":"Junior","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":"Right","country":"USA","intl":false,"school":"Furman","team":"Furman","status":null,"dob":null,"grade":"B/B","grade_present":"B","grade_future":"B","grade_val":7,"grade_val_present":7,"years":[2026],"year":2026,"n_reports":1},{"key":"hugo vogel","name":"Hugo Vogel","reports":[],"class":"Sophomore","position":"LB","positions":["LB"],"position_full":"Left Back","foot":"Left","country":"France","intl":true,"school":"UCF","team":"UCF","status":null,"dob":null,"grade":null,"grade_present":null,"grade_future":null,"grade_val":null,"grade_val_present":null,"years":[],"year":null,"n_reports":0},{"key":"hugo vogel 2","name":"Hugo Vogel","reports":[{"year":2026,"grade":"B/B+","grade_present":"B","grade_future":"B+","position":"LB","position_full":"Left Back","foot":"Left","dates":[],"match":"FAU and Boston U","source":"Video","role_code":"5-FB1","role_name":"Wing Back","jersey":5,"body":"5'11\" with a solid, powerful build and a thicker lower half. A lower-to-the-ground athlete with excellent acceleration and a very strong ability to get up to top pace and cover space in behind. Good top-end pace, solid agility, and very good straight-line power. A solid jumper who is solid in the air.\nTechnically sound, with good left-footed technique and good shape and texture to his passing and crossing. Has excellent passing range, with the ability to find long diagonal switches or balls in behind. Good press-resistance and an ability to break pressure out of the back with his passing. Average off the dribble and mostly pass-first. Can be overly ambitious and go long too often out of the back. Right foot is poor. Average ability to project forward in the final third and provide service, but does provide quality service when he arrives. Good ability to hit a variety of crosses and pick someone out in the box.\nDefensively very solid, with the ability to absorb contact in duels and run wingers off the ball. Good timing and sturdiness in duels, with an athletic floor that projects to the next level.","class":"Sophomore","country":"France","team":"UCF","status":null,"file":"manual entry"}],"class":"Sophomore","position":"LB","positions":["LB"],"position_full":"Left Back","foot":"Left","country":"France","intl":true,"school":"UCF","team":"UCF","status":null,"dob":null,"grade":"B/B+","grade_present":"B","grade_future":"B+","grade_val":8,"grade_val_present":7,"years":[2026],"year":2026,"n_reports":1},{"key":"alejandro velazquezlopez","name":"Alejandro Velazquez-Lopez","reports":[{"year":2026,"grade":"C/B","grade_present":"C","grade_future":"B","position":"CMF","position_full":"Central Mid","foot":"Right","dates":["08/31/2026"],"match":"Clemson","source":"Video","role_code":"8-CMF-8 2","role_name":"Box-to-Box Shuttler","jersey":8,"body":"6'0\", thick stocky build. Below-average athlete overall, a bit stiff, has a good engine to cover ground for 90 minutes but average pace, acceleration, power and physicality. Not going to out-duel people in midfield but has good balance in duels. Interesting technical and tactical player that doesnt really have a clear role. Has excellent technical quality and composure on the ball with the ability to find a wide array of unique progressive and final passes in the middle and final thirds. Is not very strong dictating the game and operating in the pocket. Has good ability to join the final third where he apply his technique and good vision for the game to deliver high quality service/a final pass. Good between the lines in terms of retaining and circulating possession. Would be a good USL midfielder in general, but nothing more.","class":"Junior","country":"USA","team":"South Carolina","status":null,"file":"manual entry"}],"class":"Junior","position":"CMF","positions":["CMF"],"position_full":"Central Mid","foot":"Right","country":"USA","intl":false,"school":"South Carolina","team":"South Carolina","status":null,"dob":null,"grade":"C/B","grade_present":"C","grade_future":"B","grade_val":7,"grade_val_present":4,"years":[2026],"year":2026,"n_reports":1},{"key":"aiden bengard","name":"Aiden Bengard","reports":[{"year":2026,"grade":"D/C","grade_present":"D","grade_future":"C","position":"LCB","position_full":"Left Center Back","foot":"Left","dates":["08/31/2026"],"match":"Oral Roberts and Oregon St","source":"Video","role_code":"4-CB2","role_name":"Big Athletic Presence","jersey":4,"body":"6'1\", lean build. Good physicality overall. Strong and has good lower body power. Poor agility and lateral movement. Stiff, straight line power type athlete. Aggressive and very front-footed, overly front footed. Dives in duels all the time and oversteps. Uses his body, reach, and aggression in duels instead of technique. Decent on the ball, has average technique on longer passes, just doesnt process it out the back fast enough, slow in terms of circulation and passing. Can find progressive entries when he needs to and is given time and space on the ball. Shades of Reid Roberts in a bad way for me, just oversteps all the time in duels and has poor lateral agility.","class":"Sophomore","country":"USA","team":"Cal. State Fullerton","status":"26 Draft MNUFC","file":"manual entry"}],"class":"Sophomore","position":"LCB","positions":["LCB"],"position_full":"Left Center Back","foot":"Left","country":"USA","intl":false,"school":"Cal. State Fullerton","team":"Cal. State Fullerton","status":"26 Draft MNUFC","dob":null,"grade":"D/C","grade_present":"D","grade_future":"C","grade_val":4,"grade_val_present":1,"years":[2026],"year":2026,"n_reports":1},{"key":"bardia hormozi","name":"Bardia Hormozi","reports":[{"year":2026,"grade":"C/B","grade_present":"C","grade_future":"B","position":"RW","position_full":"Right Wing","foot":"Both","dates":["08/31/2026"],"match":"Villanova","source":"Video","role_code":"11-W3","role_name":"Inverted Winger","jersey":11,"body":"5'10\", stocky build, with a good lower half. Interesting player and athlete. Good pace and initial burst, has average top-end pace and average agility for a FWD. Wont stretch defenses in-behind. Versatile player who can play all across the front and has a very defined skillset. Excellent at 1-2s and drifting into pockets to receive and dribble into space or combine quickly. Has very good feel for the game and movement off defenders and into space. Is poor off the dribble and far too frantic with the ball to be an MLS player. Lacks finesse and often plays too fast for his technical quality. Has one gear and is very predictable with it. Has very good left footed ball striking and is very two footed. Just okay 1v1 and benefits a lot from Princeton's strength of schedule, where he does get the extra yard of space which he takes full advantage of. Not sold that hes anything beyond a good USL forward.","class":"Senior","country":"USA","team":"Princeton","status":"26 <script type="module">
"use strict";
const EMBEDDED = JSON.parse(document.getElementById('db').textContent);
// Live data.json (updated by Admin saves) is the source of truth; the embedded
// copy is the offline fallback (e.g. opening the file directly).
let DB = null;
try{ const _r = await fetch('data.json?t='+Date.now(), {cache:'no-store'}); if(_r.ok) DB = await _r.json(); }catch(e){}
if(!DB) DB = EMBEDDED;
let baseRev = DB.rev||0;   // the revision this tab loaded — used to block stale overwrites
const players = DB.players;
const byKey = Object.fromEntries(players.map(p=>[p.key,p]));

/* ---------- grades ---------- */
const SCALE=['D-','D','D+','C-','C','C+','B-','B','B+','A-','A','A+','A++','A+++'];
function gradeColor(v){ if(v==null||v<0) return 'var(--U)'; if(v>=9)return 'var(--A)'; if(v>=6)return 'var(--B)'; if(v>=3)return 'var(--C)'; return 'var(--D)'; }
function gradeVal(g){ const i=g?SCALE.indexOf(''+g):-1; return i<0?null:i; }

/* ---------- trait/role names (mirrors _roles.py) ---------- */
const ROLE_MAP={GK1:'Big Shot Stopper',GK2:'Sweeper Keeper',FB1:'Wing Back',FB2:'Inverted Fullback',
 FB3:'Defensive Fullback',CB1:'Leader of the Line',CB2:'Big Athletic Presence',CB3:'Ball-Playing CB',
 'CMF-6 1':'True #6 (Double Pivot)','CMF-6 2':'Single Pivot Holder','CMF-6 3':'Athletic Destroyer',
 'CMF-8 1':'Box-to-Box Grinder','CMF-8 2':'Box-to-Box Shuttler','CMF-8 3':'Jack of All Trades',
 'AMF-10 1':'Enganche (Playmaker #10)','AMF-10 2':'Modern 3-4-2-1 #10',W1:'Chalk-on-Boots Winger',
 W2:'Vertical Grinder',W3:'Inverted Winger',FWD1:'True #9 (Target)',FWD2:'Poacher / Finisher',FWD3:'False 9 / 2nd Striker'};
const ROLE_RX=[[/FWD\s*-?\s*([123])/,m=>'FWD'+m[1]],[/AMF[\s-]*10[\s-]*([12])/,m=>'AMF-10 '+m[1]],
 [/CMF[\s-]*8[\s-]*([123])/,m=>'CMF-8 '+m[1]],[/CMF[\s-]*6[\s-]*([123])/,m=>'CMF-6 '+m[1]],
 [/W\s*-?\s*([123])/,m=>'W'+m[1]],[/CB\s*-?\s*([123])/,m=>'CB'+m[1]],
 [/(?:FB|LB|RB)\s*-?\s*([123])/,m=>'FB'+m[1]],[/GK\s*-?\s*([12])/,m=>'GK'+m[1]]];
function traitCode(code){ if(!code)return null; let s=(''+code).toUpperCase().trim().replace(/^\s*\d+\s*-?\s*/,'');
  for(const [rx,fn] of ROLE_RX){ const m=s.match(rx); if(m) return fn(m); } return null; }
function roleName(code){ const tc=traitCode(code); return tc?ROLE_MAP[tc]||null:null; }

/* ---------- tiers ---------- */
const TIERS=[
 {id:'elite',name:'Elite',sub:'A- and up',color:'var(--A)',min:9,max:99},
 {id:'high', name:'High', sub:'B / B+',   color:'var(--B)',min:7,max:8},
 {id:'solid',name:'Solid',sub:'B- / C+',  color:'#7dd3fc', min:5,max:6},
 {id:'watch',name:'Watch',sub:'C / C-',   color:'var(--C)',min:3,max:4},
 {id:'pass', name:'Pass', sub:'D+ & below',color:'var(--D)',min:-1,max:2},
 {id:'unrated',name:'Unrated',sub:'no grade',color:'var(--U)',min:null,max:null},
];
function tierForGrade(v){ if(v==null)return 'unrated'; for(const t of TIERS){ if(t.min!=null&&v>=t.min&&v<=t.max)return t.id;} return 'unrated'; }

/* ---------- positions (formation) ---------- */
const POSITIONS=[
 {id:'p9', num:9, name:'CF / ST', area:'cf', color:'var(--D)'},
 {id:'p11',num:11,name:'LW / LMF',area:'lw', color:'#f472b6'},
 {id:'p7', num:7, name:'RW / RMF',area:'rw', color:'#f472b6'},
 {id:'p10',num:10,name:'AMF',     area:'am', color:'var(--C)'},
 {id:'p8', num:8, name:'CMF',     area:'cm', color:'var(--C)'},
 {id:'p6', num:6, name:'CDM',     area:'cdm',color:'#a78bfa'},
 {id:'p5', num:5, name:'LB / LWB',area:'lb', color:'var(--B)'},
 {id:'p4', num:4, name:'LCB',     area:'lcb',color:'var(--A)'},
 {id:'p3', num:3, name:'RCB',     area:'rcb',color:'var(--A)'},
 {id:'p2', num:2, name:'RB / RWB',area:'rb', color:'var(--B)'},
];  // GK section removed
const POS_BY_NUM=Object.fromEntries(POSITIONS.map(p=>[p.num,p.id]));
const POSNUM_MAP={ST:9,CF:9,FWD:9,FW:9,LW:11,LWF:11,LM:11,LMF:11,RW:7,RWF:7,RM:7,RMF:7,
 CAM:10,AMF:10,AM:10,CM:8,CMF:8,MF:8,CDM:6,DMF:6,DM:6,LB:5,LWB:5,RB:2,RWB:2,LCB:4,RCB:3,GK:1,SW:3};
function boardBucket(p){ const id=POS_BY_NUM[bucketNum(p)]; return id||null; }  // null = GK / no lane
function bucketNum(p){
  if(p.rolenum && p.rolenum>=1 && p.rolenum<=11) return p.rolenum;
  const pos=(p.position||'').toUpperCase();
  for(const part of pos.split('/')){ if(POSNUM_MAP[part]!=null) return POSNUM_MAP[part]; }
  const foot=p.foot;
  if(pos.includes('CB')) return foot==='Left'?4:3;
  if(pos.includes('FB')||pos.includes('WB')) return foot==='Left'?5:2;
  if(pos.includes('W')||pos.includes('M')) return foot==='Left'?7:11;
  return 8;
}

/* ---------- tabs (by college season / match year) ---------- */
let YEARS=(DB.years||['2026','2025','2024']).slice();
let view='pos';             // positional-only app
DB.boards=DB.boards||{};
function posTabs(){ return YEARS.filter(y=>y!=='2023'); }
function boardCount(y){ const b=DB.boards[y]; return b?Object.values(b).flat().length:0; }
// open to the most recent season that actually has players (avoid a blank tab)
let curTab=posTabs().find(y=>boardCount(y)>0)||posTabs()[0]||YEARS[0];

// membership by match year = has a report that season OR is placed on that board
function playersForCat(year){
  const board=DB.boards[year]; const onBoard=board?new Set(Object.values(board).flat()):null;
  return players.filter(p=> (p.reports||[]).some(r=>String(r.year)===String(year))
    || (onBoard&&onBoard.has(p.key)) );
}
function gradeSort(a,b){ return (b.grade_val??-1)-(a.grade_val??-1) || (b.grade_val_present??-1)-(a.grade_val_present??-1) || a.name.localeCompare(b.name); }

/* ---------- admin state ---------- */
let ADMIN=false, DIRTY=false;
let selectMode=false; const selected=new Set();   // players picked for PDF export
function markDirty(){ DIRTY=true; const f=document.getElementById('dirtyFlag'); if(f) f.textContent='● unsaved changes'; }
function clearDirty(){ DIRTY=false; const f=document.getElementById('dirtyFlag'); if(f) f.textContent=''; }

/* ---------- persistence (viewer's personal overlay only) ---------- */
const LS='scoutBoards_v5';
let store=load();
function load(){ let s; try{s=JSON.parse(localStorage.getItem(LS))||{};}catch(e){s={};}
  s.pos=s.pos||{};
  if(s.rev!==DB.rev){ s.pos={}; s.rev=DB.rev; }   // drop stale overlays when owner publishes
  return s; }
function save(){ localStorage.setItem(LS, JSON.stringify(store)); }

/* ---------- positional board ----------
   Canonical board lives in DB.boards[year] (owner-managed, shared to everyone).
   Viewers get a personal localStorage overlay seeded from it. */
function autoSeed(year){                   // used only when a year has no canonical board yet
  const b={}; POSITIONS.forEach(p=>b[p.id]=[]); const seen=new Set();
  const seed=DB.pos_seeds&&DB.pos_seeds[year];
  if(seed){ for(const num in seed){ const id=POS_BY_NUM[num];
    if(id) seed[num].forEach(k=>{ if(byKey[k]&&!seen.has(k)){ b[id].push(k); seen.add(k);} }); } }
  playersForCat(year).filter(p=>p.n_reports>0&&!seen.has(p.key)).slice().sort(gradeSort)
    .forEach(p=>{ const id=boardBucket(p); if(id){ b[id].push(p.key); seen.add(p.key);} });
  return b;
}
function normalizeBoard(b){ POSITIONS.forEach(p=>{ b[p.id]=(b[p.id]||[]).filter(k=>byKey[k]); }); return b; }
function canonicalBoard(year){
  if(!DB.boards[year]) DB.boards[year]=autoSeed(year);
  return normalizeBoard(DB.boards[year]);
}
function getPos(year){
  if(ADMIN) return canonicalBoard(year);           // edit the shared board directly
  // viewer: personal overlay seeded from the canonical board
  if(!store.pos[year]){ store.pos[year]=JSON.parse(JSON.stringify(canonicalBoard(year))); save(); }
  else normalizeBoard(store.pos[year]);
  return store.pos[year];
}

/* ---------- filters ---------- */
const POS_GROUPS={'Forwards':['ST','CF','FWD','FW'],'Wingers':['LW','RW','W','LM','RM','LMF','RMF','LWF','RWF'],
 'Attacking Mid':['CAM','AMF','AM'],'Central Mid':['CM','CMF','MF'],'Defensive Mid':['CDM','DMF','DM'],
 'Fullbacks':['LB','RB','LWB','RWB','FB','WB'],'Center Backs':['CB','LCB','RCB','SW'],'Goalkeepers':['GK']};
function posGroup(pos){ if(!pos)return null; const ps=(''+pos).toUpperCase().split('/');
  for(const[g,c]of Object.entries(POS_GROUPS)) if(ps.some(x=>c.includes(x)))return g; return 'Other'; }
let f={q:'',pos:'',cls:''};
function matchesFilter(p){
  if(f.pos && posGroup(p.position)!==f.pos && !(p.positions||[]).some(x=>posGroup(x)===f.pos)) return false;
  if(f.cls && classForYear(p,curTab)!==f.cls) return false;
  if(f.q){ const q=f.q.toLowerCase();
    const hay=[p.name,p.team,p.school,p.country,p.position,p.class,p.status,
      ...(p.reports||[]).map(r=>r.body),...(p.reports||[]).map(r=>r.match)].filter(Boolean).join(' ').toLowerCase();
    if(!hay.includes(q)) return false; }
  return true;
}

/* ---------- class advancement (season-aware) ----------
   A player's academic class advances each college season. Show the class
   as-of the board's year: use the report from that season if it exists,
   otherwise advance the most-recent earlier class by the year gap. */
const CLASS_LADDER=['Freshman','Sophomore','Junior','Senior','Grad Student'];
const RS_LADDER=['R-Freshman','R-Sophomore','R-Junior','R-Senior'];
function advanceClass(cls, steps){
  if(!cls||steps<=0) return cls;
  for(const L of [CLASS_LADDER,RS_LADDER]){ const i=L.indexOf(cls);
    if(i>=0) return L[Math.min(i+steps, L.length-1)]; }
  return cls;  // 5th Year / unknown — leave as-is
}
function classRank(c){ let i=CLASS_LADDER.indexOf(c); if(i>=0) return i; i=RS_LADDER.indexOf(c); return i>=0?i:-1; }
function classForYear(p, year){
  year=+year;
  // A report from this exact season → use its class (senior-most if several).
  // In the player's own latest-scouting year, use the consolidated class so
  // display matches the carryover logic (which also uses p.class / p.year).
  const exact=(p.reports||[]).filter(r=>r.class && +r.year===year);
  if(exact.length){
    if(year===+p.year && p.class) return p.class;
    return exact.slice().sort((a,b)=>classRank(b.class)-classRank(a.class))[0].class;
  }
  // otherwise advance the consolidated class from the latest scouting year
  return advanceClass(p.class, Math.max(0, year-(+p.year||year)));
}

/* ---------- class color ---------- */
function classTint(cls){ if(!cls)return ''; if(/Fresh/i.test(cls))return 'var(--frbg)';
  if(/(Senior|Grad|5th)/i.test(cls))return ''; return 'var(--nonsrbg)'; }
function classBorder(cls){ if(!cls)return 'var(--line)'; if(/Fresh/i.test(cls))return 'var(--fr)';
  if(/(Senior|Grad|5th)/i.test(cls))return 'var(--line)'; return 'var(--nonsr)'; }

function renderPos(){
  boardEl.className='pos';
  const lg=document.getElementById('legendNew'); if(lg) lg.textContent="'"+String(curTab).slice(-2);
  const b=getPos(curTab);
  const onBoard=Object.values(b).flat();

  boardEl.innerHTML=POSITIONS.map(pos=>{
    const keys=b[pos.id]||[]; let rank=0;
    const cards=keys.map(k=>{const p=byKey[k]; if(!p)return ''; rank++; const h=!vis.has(k); if(!h)n++; return posCardHTML(p,rank,h);}).join('');
    const shown=keys.filter(k=>vis.has(k)).length;
    return laneHTML(pos.id,pos.color,pos.name,'#'+pos.num,shown,cards,true,pos.area);
  }).join('');
  document.getElementById('visCount').textContent=`${n} shown`;
  wireDnD('.pcard');
}
function laneHTML(id,color,title,sub,count,cards,add,area){

function esc(s){return (''+(s==null?'':s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- drag & drop (shared) ---------- */
function wireDnD(sel){
  boardEl.querySelectorAll(sel).forEach(card=>{
    card.addEventListener('dragstart',e=>{card.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    card.addEventListener('dragend',()=>{card.classList.remove('dragging');saveFromDOM();});
    card.addEventListener('click',e=>{ if(e.target.classList.contains('premove'))return;
      if(selectMode){ toggleSelect(card.dataset.key); return; } openPlayer(card.dataset.key); });
    const rm=card.querySelector('.premove');
    if(rm) rm.addEventListener('click',e=>{e.stopPropagation();removeFromBoard(card.dataset.key);});
  });
  boardEl.querySelectorAll('.lane-body').forEach(lane=>{
    lane.addEventListener('dragover',e=>{e.preventDefault();lane.classList.add('drag-over');
      const d=boardEl.querySelector('.dragging'); if(!d)return; const a=afterEl(lane,e.clientY,sel);
      if(a==null)lane.appendChild(d); else lane.insertBefore(d,a);});
    lane.addEventListener('dragleave',e=>{if(!lane.contains(e.relatedTarget))lane.classList.remove('drag-over');});
    lane.addEventListener('drop',e=>{e.preventDefault();lane.classList.remove('drag-over');});
  });
  boardEl.querySelectorAll('.lane-add').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();openPicker(btn.dataset.lane);}));
}
function afterEl(lane,y,sel){ const els=[...lane.querySelectorAll(sel+':not(.dragging)')]; let best={o:-Infinity,el:null};
  for(const el of els){const b=el.getBoundingClientRect();const off=y-b.top-b.height/2; if(off<0&&off>best.o)best={o:off,el};} return best.el; }
function curBoard(){ return getPos(curTab); }
function persistBoard(){ if(ADMIN) markDirty(); else save(); }
function saveFromDOM(){ const b=curBoard(); if(!b)return;
  boardEl.querySelectorAll('.lane-body').forEach(lane=>{ b[lane.dataset.lane]=[...lane.querySelectorAll('.card,.pcard')].map(c=>c.dataset.key); });
  persistBoard(); render();
}
function removeFromBoard(key){
  const b=getPos(curTab);
  for(const id in b) b[id]=b[id].filter(k=>k!==key);
  persistBoard(); render();
}

function hl(t,q){ if(!q)return t; try{const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return t.replace(re,'<mark>$1</mark>');}catch(e){return t;} }
