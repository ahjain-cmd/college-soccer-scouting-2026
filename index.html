<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahan Jain College Soccer Scouting Database</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c232d; --line:#2b333d;
    --txt:#e6edf3; --dim:#9aa7b4; --dim2:#6e7b8a; --accent:#3b82f6;
    --A:#22c55e; --B:#38bdf8; --C:#f5a623; --D:#ef5350; --U:#8b95a1;
    --fr:#c9a227; --frbg:rgba(214,178,45,.20); --nonsr:#3f9142; --nonsrbg:rgba(63,145,66,.20);
    --shadow:0 6px 24px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#111722,#0d1117);border-bottom:1px solid var(--line);padding:10px 18px}
  .brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .brand h1{font-size:18px;margin:0;letter-spacing:.3px}
  .brand .sub{color:var(--dim);font-size:12px}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .seg{display:flex;gap:3px;background:var(--panel);padding:3px;border-radius:9px;border:1px solid var(--line)}
  .seg button{background:transparent;border:0;color:var(--dim);padding:6px 13px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px}
  .seg button.on{background:var(--accent);color:#fff}
  .seg button:hover:not(.on){color:var(--txt)}
  .seg.view button.on{background:#8957e5}
  input,select{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:13px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  #search{min-width:210px;flex:1;max-width:320px}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600}
  .btn:hover{border-color:var(--accent)}
  .btn.ghost{color:var(--dim)}
  .spacer{flex:1}
  .count-pill{color:var(--dim);font-size:12px;padding:6px 4px}
  .subbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:6px 18px 0}
  .hint{color:var(--dim2);font-size:11.5px}
  .legend{display:flex;gap:12px;align-items:center;font-size:11.5px;color:var(--dim)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--line)}

  /* ---- tier board (horizontal lanes) ---- */
  #board.tier{display:flex;gap:14px;padding:16px;align-items:flex-start;overflow-x:auto;min-height:calc(100vh - 150px)}
  #board.tier .lane{flex:0 0 300px;max-height:calc(100vh - 168px)}
  /* ---- positional board (formation grid) ---- */
  #board.pos{display:grid;gap:12px;padding:16px;grid-template-columns:repeat(4,minmax(210px,1fr));
    grid-template-areas:"lw cf cf rw" "lw am cm rw" "lw cdm cdm rw" "lb lcb rcb rb";}
  #board.pos .lane{max-height:none}
  .lane{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
  .lane-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);border-radius:12px 12px 0 0;z-index:1}
  .lane-dot{width:10px;height:10px;border-radius:50%}
  .lane-title{font-weight:700;font-size:13px;letter-spacing:.3px}
  .lane-sub{color:var(--dim2);font-size:11px}
  .lane-count{margin-left:auto;background:var(--panel2);color:var(--dim);border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600}
  .lane-add{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:6px;width:22px;height:22px;cursor:pointer;font-size:14px;line-height:1;padding:0}
  .lane-add:hover{border-color:var(--accent);color:var(--txt)}
  .lane-body{padding:9px;overflow-y:auto;flex:1;min-height:56px}
  .lane-body.drag-over{background:rgba(59,130,246,.06);outline:2px dashed var(--accent);outline-offset:-4px;border-radius:9px}
  .empty{color:var(--dim2);text-align:center;font-size:12px;padding:16px 6px;font-style:italic}

  /* ---- tier card ---- */
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;cursor:grab;position:relative;transition:border-color .12s}
  .card:hover{border-color:#3d4855}
  .card.dragging{opacity:.4}
  .card.hidden{display:none}
  .card .rank{position:absolute;top:8px;right:9px;color:var(--dim2);font-size:11px;font-weight:700}
  .card .nm{font-weight:700;font-size:14px;padding-right:22px;line-height:1.25}
  .card .meta{color:var(--dim);font-size:12px;margin-top:3px;display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center}
  .grade{display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;padding:1px 7px;border-radius:6px;color:#08121f}
  .chip{background:#232c37;border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:600}
  .card .foot-team{color:var(--dim2);font-size:11.5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .reps-badge{color:var(--accent);font-weight:700}
  .stat-badge{color:#c9a227;font-weight:700}

  /* ---- positional card (row style, class-colored) ---- */
  .pcard{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:6px 8px;margin-bottom:6px;cursor:grab;position:relative;font-size:13px}
  .pcard:hover{border-color:#3d4855}
  .pcard.dragging{opacity:.4}
  .pcard.hidden{display:none}
  .pcard .prank{color:var(--dim2);font-weight:700;font-size:11px;min-width:15px;text-align:right}
  .pcard .pname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard .pmeta{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .pcard .pgrade{font-weight:800;font-size:11px;padding:1px 6px;border-radius:5px;color:#08121f}
  .newtag{font-weight:800;font-size:10px;letter-spacing:.3px;padding:1px 5px;border-radius:4px;background:rgba(137,87,229,.22);border:1px solid #8957e5;color:#c9b6f5}
  .pcard .newtag{flex:0 0 auto}
  /* select mode */
  .select-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;padding:8px 10px;background:rgba(59,130,246,.10);border:1px solid var(--accent);border-radius:10px}
  .select-badge{font-size:11px;font-weight:800;letter-spacing:.5px;color:#bcd2f7;background:rgba(59,130,246,.2);border:1px solid var(--accent);border-radius:6px;padding:3px 8px}
  .select-bar #exportPdfBtn{background:var(--accent);border-color:var(--accent);color:#fff}
  body.selecting .pcard{cursor:pointer}
  body.selecting .pcard .premove{display:none}
  .pcard .selcheck{flex:0 0 auto;width:18px;height:18px;border:1.5px solid var(--dim2);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
  .pcard.selected{outline:2px solid var(--accent);outline-offset:-1px;background:rgba(59,130,246,.10)!important}
  .pcard.selected .selcheck{background:var(--accent);border-color:var(--accent)}
  .pcard .premove{background:transparent;border:1px solid var(--line);border-radius:5px;color:var(--dim2);cursor:pointer;font-size:14px;line-height:1;width:20px;height:20px;padding:0;opacity:.55;flex:0 0 auto}
  .pcard:hover .premove{opacity:1}
  .pcard .premove:hover{color:#fff;background:var(--D);border-color:var(--D)}
  .intl-dot{color:#8957e5;font-weight:800}

  /* ---- modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(3,6,10,.7);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:820px;width:100%;box-shadow:var(--shadow);animation:pop .16s ease}
  @keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
  .m-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-start}
  .m-head .big-grade{font-size:26px;font-weight:900;padding:6px 12px;border-radius:10px;color:#08121f;flex:0 0 auto}
  .m-title h2{margin:0;font-size:22px}
  .m-bio{color:var(--dim);font-size:13px;margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 14px}
  .m-bio b{color:var(--txt);font-weight:600}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:#232c37;border:1px solid var(--line);color:var(--dim)}
  .badge.cat{background:rgba(137,87,229,.18);border-color:#8957e5;color:#c9b6f5}
  .badge.status{background:rgba(34,197,94,.15);border-color:var(--A);color:#8ee7a8}
  .m-close{margin-left:auto;background:transparent;border:0;color:var(--dim);font-size:24px;cursor:pointer;line-height:1;padding:2px 6px}
  .m-close:hover{color:var(--txt)}
  .m-body{padding:8px 24px 22px}
  .rep{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px;background:var(--panel2)}
  .rep-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px;color:var(--dim);margin-bottom:8px}
  .rep-head .rg{font-weight:800;color:#08121f;padding:1px 8px;border-radius:6px}
  .rep-head .src{background:#232c37;border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:1px 7px;font-weight:600}
  .rep-head .role{background:rgba(56,189,248,.14);border:1px solid #38bdf8;color:#bfe8fb;border-radius:6px;padding:1px 8px;font-weight:700}
  .rep-match{color:var(--txt);font-weight:600}
  .rep-body{font-size:14px;line-height:1.62;color:#d7dee6;white-space:pre-wrap}
  .rep-file{color:var(--dim2);font-size:11px;margin-top:9px}
  .noreport{color:var(--dim2);font-style:italic;padding:18px 0 6px}
  mark{background:rgba(245,166,35,.32);color:inherit;border-radius:2px;padding:0 1px}

  /* ---- add-player picker ---- */
  #picker .modal{max-width:520px}
  .pk-head{padding:16px 20px 10px;border-bottom:1px solid var(--line)}
  .pk-head h3{margin:0 0 8px;font-size:16px}
  .pk-list{max-height:52vh;overflow-y:auto;padding:8px}
  .pk-item{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer}
  .pk-item:hover{background:var(--panel2)}
  .pk-item .pg{font-weight:800;font-size:11px;padding:1px 6px;border-radius:5px;color:#08121f}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#2b333d;border-radius:6px}
  ::-webkit-scrollbar-thumb:hover{background:#3a444f}
  /* ---- admin ---- */
  .admin-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;padding:8px 10px;background:rgba(137,87,229,.10);border:1px solid #8957e5;border-radius:10px}
  .admin-badge{font-size:11px;font-weight:800;letter-spacing:.5px;color:#c9b6f5;background:rgba(137,87,229,.2);border:1px solid #8957e5;border-radius:6px;padding:3px 8px}
  .admin-toolbar .btn{background:#8957e5;border-color:#8957e5;color:#fff}
  .admin-toolbar .btn.ghost{background:transparent;color:var(--dim)}
  .admin-toolbar #saveBtn{background:var(--A);border-color:var(--A);color:#08121f}
  .dirty{color:var(--C);font-size:12px;font-weight:600}
  body.admin .pcard{cursor:grab}
  body.admin .pcard .premove{opacity:.8}
  .adm-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .adm-actions .btn{font-size:12px;padding:5px 10px}
  .btn.danger{border-color:var(--D);color:var(--D)}
  .btn.danger:hover{background:var(--D);color:#fff}
  .rep .rep-edit{float:right;display:flex;gap:6px}
  .rep .rep-edit button{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:5px;cursor:pointer;font-size:11px;padding:2px 7px}
  .rep .rep-edit button:hover{border-color:var(--accent);color:var(--txt)}
  /* forms */
  #formModal{max-width:620px}
  .form-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
  .form-head h3{margin:0;font-size:17px}
  .form-body{padding:16px 20px;max-height:70vh;overflow-y:auto}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field.full{grid-column:1/-1}
  .field label{font-size:12px;color:var(--dim);font-weight:600}
  .field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
  .field textarea{min-height:150px;resize:vertical;line-height:1.55}
  .field .hint{font-size:11px;color:var(--dim2)}
  .form-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
  .form-foot .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1c232d;border:1px solid var(--line);color:var(--txt);padding:11px 18px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  #toast.err{border-color:var(--D);color:#ffb4b0}
  #toast.ok{border-color:var(--A)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>⚽ Ahan Jain College Soccer Scouting Database</h1>
    <span class="sub" id="hdr-sub"></span>
  </div>
  <div class="toolbar">
    <div class="seg" id="tabs"></div>
    <input id="search" type="search" placeholder="Search name, team, country, report text…" autocomplete="off">
    <select id="posFilter" title="Position"></select>
    <select id="classFilter" title="Class"></select>
    <span class="spacer"></span>
    <span class="count-pill" id="visCount"></span>
    <button class="btn ghost" id="selectBtn" title="Select players to export their reports as a PDF">☑ Select</button>
    <button class="btn ghost" id="resetBtn" title="Re-seed this board and clear your custom arrangement">↺ Reset</button>
    <button class="btn ghost" id="exportBtn" title="Download this board as JSON">⭳ Export</button>
    <button class="btn ghost" id="adminBtn" title="Manage the database (owner only)">✎ Edit</button>
  </div>
  <div class="select-bar" id="selectBar" style="display:none">
    <span class="select-badge">SELECT</span>
    <span id="selCount">0 selected</span>
    <button class="btn ghost" id="selVisibleBtn" title="Select every player shown on this board">+ All shown</button>
    <button class="btn ghost" id="selClearBtn">Clear</button>
    <span class="spacer"></span>
    <button class="btn" id="exportPdfBtn">⭳ Export PDF</button>
    <button class="btn ghost" id="selDoneBtn">Done</button>
  </div>
  <div class="admin-toolbar" id="adminToolbar" style="display:none">
    <span class="admin-badge">EDIT MODE</span>
    <button class="btn" id="addPlayerBtn">+ Player</button>
    <button class="btn" id="addSeasonBtn">+ Season</button>
    <span class="spacer"></span>
    <span class="dirty" id="dirtyFlag"></span>
    <button class="btn" id="saveBtn" title="Commit changes to GitHub — live in ~1 min">💾 Save &amp; Publish</button>
    <button class="btn ghost" id="tokenBtn" title="Set / change your GitHub token">🔑</button>
    <button class="btn ghost" id="exitEditBtn">Done</button>
  </div>
  <div class="subbar">
    <span class="hint" id="modeHint"></span>
    <span class="legend" id="legend" style="display:none">
      <span><span class="sw" style="background:var(--frbg);border-color:var(--fr)"></span>Freshman</span>
      <span><span class="sw" style="background:var(--nonsrbg);border-color:var(--nonsr)"></span>Underclassman (So/Jr)</span>
      <span><span class="sw" style="background:var(--panel2)"></span>Senior / Grad (draft-eligible)</span>
      <span><span class="intl-dot">◆</span> International</span>
      <span><span class="newtag" id="legendNew">'26</span> scouted this season</span>
    </span>
  </div>
</header>
<div id="board" class="tier"></div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="overlay" id="picker"><div class="modal">
  <div class="pk-head"><h3 id="pk-title">Add player</h3>
    <input id="pk-search" type="search" placeholder="Search players to add…" autocomplete="off" style="width:100%">
  </div>
  <div class="pk-list" id="pk-list"></div>
</div></div>

<div class="overlay" id="formOverlay"><div class="modal" id="formModal"></div></div>
<div id="toast"></div>

creative ability when dropping in, but can play faster, occasionally takes too many touches, and can be loose with the ball. Babalai shows very high-level soccer IQ. He sees the game, is constantly scanning, processes the game fast and at a high-level. His computer goes faster and is two steps ahead of everyone else on the field. He sees events unfolding before they do. He combines the Wayne Rooney like deep-lying link-up and hold-up play with elite final third product, with the pass, dribble and shot. Babalai can pick a final ball, pick a lock, be a creative presence, and has vision and execution for the final pass. He has the creativity and lock-picking of a true number 10. He can play at different tempos, different rhythms, use changes of pace and speed to draw defenders in and pop a ball in-behind. He also has ruthless clinical ability in-front of goal. He can score goals with his head, from set-pieces, be an aerial threat using his 6’3” frame. He can score with both feet, as he has fantastic technique and clinical ball-striking with both feet. He can be a poacher in-front of goal, and drill second and third balls into the back of the net or get on the end of service. He is a triple threat, can take you off the shot, dribble, or pass. In sum, Babalai is a dynamic and pacey goal-minded winger with elite 1v1 ability and dribbling, creative number 10 with final ball execution and vision, a false 9 with elite link-up and hold-up play, and a clinical poacher/finisher with both feet and head, all wrapped into one player. He is a special and unique profile and is someone who I believe should be at-least top ten on the draft board. (AJ)","category":null,"status":"Graduated","role_name":"False 9 / 2nd Striker"}]},{"key":"teddy baker","name":"Teddy Baker","class":"Junior","position":"LM/CM","positions":["LM/CM"],"position_full":"Left Mid / Central Mid","foot":null,"country":"England","dob":null,"team":null,"school":"Hofstra Pride","intl":true,"grade":"A+","grade_val":11,"grade_val_present":11,"grade_present":"A+","grade_future":"A+","years":[2023],"year":2023,"category":null,"status":"USL L1","rolenum":8,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"A+","grade_present":"A+","grade_future":"A+","role_code":"8-CMF-8 3","jersey":8,"position":"LM/CM","position_full":"Left Mid / Central Mid","foot":null,"class":"Junior","country":"England","year":2023,"file":"match-year: 2023 report","body":"6’2”, lean build. Good athlete with above average size. Baker has excellent technical quality and excellent technique with his right foot. He has excellent vision and passing range, and can pick any pass on the field. He possesses a deep understanding of the game, and his off-ball movement is very sound. Tactically and soccer IQ wise, he is fantastic. Extremely smart soccer player, who processes the game at a very high level, and is consistently playing 1-2 steps ahead of everyone else on the field. He possesses fantastic combination and link up play, understands how to play with and off the players around him. Truly dynamic on and off the ball. Baker has the right ideas in the final third but can lack execution. He is prone to turnovers and struggles when a defender is on his back. He can be more consistent with his final ball. His final product can be more clinical as well. Those are my only knocks on him. Otherwise, he has flair and 1v1 trickiness to his game. Slalomy and smooth dribbler. Gets the little detail rights, like checking his shoulder, weight on his passes, etc. Can play at multiple speeds and shows a willingness to speed up his decision-making/pace of play in tighter areas or final third, but also has the understanding when to slow things down. Very smooth operator anywhere on the field. Fantastic feel. Has the athletic ability and lung capacity to grind, win aerial and ground duels for stretches of the game. Technically, tactically, physically, and psychologically shows above average to excellent attributes and upside. Overall, is a special and rare profile: creativity, problem-solving ability, can play under pressure, composure, and confidence with the ball. I would easily project him as a top 3 CM in the college class, with European potential. Struggled to make an impact against better teams, such as #16 New Hampshire and Virginia but that’s likely due to Hofstra’s defensive style of play and the lack of quality around him. He projects best as an attack-minded 8, who could use a 10 and a smart winger to combine with. (AJ)","category":null,"status":"USL L1","role_name":"Jack of All Trades"}]},{"key":"alexis ledoux","name":"Alexis Ledoux","class":"Junior","position":"AMF","positions":["AMF"],"position_full":"Attacking Mid","foot":null,"country":"France","dob":null,"team":"UC Santa Barbara Guachos","school":"UC Santa Barbara Guachos","intl":true,"grade":"A/A","grade_val":10,"grade_val_present":10,"grade_present":"A","grade_future":"A","years":[2023],"year":2023,"category":null,"status":null,"rolenum":11,"n_reports":1,"reports":[{"dates":["08/25/2023"],"match":"UC Santa Barbara Guachos vs Oral Roberts Golden Eagles","team":"UC Santa Barbara Guachos","source":null,"grade":"A/A","grade_present":"A","grade_future":"A","role_code":"11-W3-7 1","jersey":11,"position":"AMF","position_full":"Attacking Mid","foot":null,"class":"Junior","country":"France","year":2023,"file":"match-year: 2023 report","body":"Amazing feel for the game. Phenomenal off-ball movement, tactical understanding, and processing of the game. Just always know where to be to receive in space. Plays very fast and can throw quick 1-2s and combinations to get out of pressure. Great technique with both feet. Very good vision and creativity. Is their biggest threat by far. Just very dynamic players in tight and open space. High level technical quality, great ball control, passing, touch – all of it. Only knock is that he is undersized and not super physical, but he uses it to his advantage. Joy to watch. Was a transfer from a D2 school.","category":null,"status":null,"role_name":"Inverted Winger"}]},{"key":"joseph melto quiah","name":"Joseph Melto Quiah","class":"Senior","position":"W","positions":["W","LW"],"position_full":"Left Wing","foot":null,"country":"Liberia","dob":null,"team":"Dayton","school":"Dayton","intl":true,"grade":"A/A","grade_val":10,"grade_val_present":10,"grade_present":"A","grade_future":"A","years":[2023,2024],"year":2024,"category":null,"status":"25 Dr Toronto","rolenum":11,"n_reports":2,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"C","grade_present":"C","grade_future":"C","role_code":"11-W2","jersey":11,"position":"W","position_full":"Winger","foot":null,"class":"Sophomore","country":"Liberia","year":2023,"file":"match-year: 2023 report","body":"5’10, lean build. Great athlete, fluid, good pace, agility, and power. Covers a lot of ground both sides of the ball throughout each game. Has defensive upside as a winger, but needs refinement on his pressing technique, angles and how he curve his runs. Has good technical quality. Enjoys receiving to feet with chalk on his boots. Technique on long range passing is poor. Understands how to pass out of tight spaces and situations. Has some solid 1v1 ability. Can struggle to create unless completely isolated versus fullback. Combination play is also a work in progress but has shown some good moments there. Given his athletic abilities, can be more dynamic off the ball, and look to cut inside and stretch the field more, instead of always drifting wide and receiving to feet. Final product is below-average - crossing can use more polish, especially left-footed crossing. Left foot crossing is poor. Good technique and ball striking on shots, but only on his right foot. Strong and smooth dribbler. Has some good attributes to be a good winger at the college level, but needs tactical, final product and technical polish. Very one footed. (AJ)","category":null,"status":null,"role_name":"Vertical Grinder"},{"dates":["11/09/2024","10/27/2024"],"match":"Dayton vs Davidson","team":"Dayton","source":"Video","grade":"A/A","grade_present":"A","grade_future":"A","role_code":"11-W1","jersey":11,"position":"LW","position_full":"Left Wing","foot":null,"class":"Senior","country":"Liberia","year":2024,"file":"match-year: 2024 report","body":"5’10”, lean build. Fantastic player. Has made a big jump from last year. Technically sound. Two-footed but is weaker on his left. Left foot is solid, nothing special. Right foot is special. Extremely dangerous cutting inside onto his right where he can float back-post balls or go for goal. Excellent feel for the game and movement, can cut inside or stretch the field wide. Excellent pace. Great feet and agility. Has production, goals, assists and a polished final product. Can also start more centrally as a 9 and run off the shoulder. Doesn’t do the defensive work, however, is content staying high and wide. Has all the tools and projects nicely. Final-ball, in terms of slipping players and breaking open low-blocks with his passing, is his only big weakness. When we and Fordham bunkered, denied space in-behind for him to exploit, he struggled. We also played 5 backs. There is a reason every team that played a 4-back vs Dayton got shredded. Small knock, probably not a concern at the next level but FYI. MLS starter/MLS bench. (AJ)","category":null,"status":"25 Dr Toronto","role_name":"Chalk-on-Boots Winger"}]},{"key":"liam ogara","name":"Liam O'Gara","class":"Sophomore","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"USA","dob":null,"team":null,"school":"Wake Forest WyScout Video Report","intl":false,"grade":"A/A","grade_val":10,"grade_val_present":10,"grade_present":"A","grade_future":"A","years":[2024],"year":2024,"category":null,"status":"25 Dr RSL","rolenum":6,"n_reports":1,"reports":[{"dates":["11/30/2024"],"match":null,"team":null,"source":"Wyscout","grade":"A/A","grade_present":"A","grade_future":"A","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Sophomore","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6'3\", lean build. Good strength. Okay pace. Excellent, lovely, quick, soft feet for his size. Excellent technical quality. Good vision for the pass and sees the entite field. Excellent technique and clean ball-striking. Good passing range. Patient 1v1 defender, moves his feet and doesnt dive in. High soccer IQ and great feel for the game. Good bite and tackling. Can be slightly loose with his passing in the middle of the park. Good in tight spaces and plays with excellent tempo and rythym. Can break lines with his passing more often. Polished in all three departments with unqiue attributes. Has the feet and agility, along with the soccer IQ and technical quality to play CDM, CM, CB and RB at a high level.","category":null,"status":"25 Dr RSL","role_name":"True #6 (Double Pivot)"}]},{"key":"ransford gyan","name":"Ransford Gyan","class":"Sophomore","position":"CAM","positions":["CAM"],"position_full":"Attacking Mid","foot":null,"country":"Ghana","dob":null,"team":"Clemson Tigers","school":"Clemson Tigers","intl":true,"grade":"A/A","grade_val":10,"grade_val_present":10,"grade_present":"A","grade_future":"A","years":[2024],"year":2024,"category":null,"status":null,"rolenum":10,"n_reports":1,"reports":[{"year":2024,"grade":"A/A","grade_present":"A","grade_future":"A","position":"CAM","position_full":"Attacking Mid","foot":null,"dates":["08/30/2024"],"match":"Clemson Tigers vs South Carolina Gamecocks","source":"Live","role_code":"10-AMF-10 1","role_name":"Enganche (Playmaker #10)","jersey":10,"body":"5’4”, lean, thick build. Fantastic traits and unique attributes. Has superb technical quality. Ball sticks like a magnet and has fantastic close ball control. Slalomed through 4 defenders to win a penalty in the first half. Tactically, he is so advanced. His understanding and feel for the game are off the charts. Loves to roam, float, drift into pockets, play 1-2s out of pressure, pick up the ball in the half-space to turn and drive, run the channel to provide a cut-back, just all over the field. Has a unique ability to solve problems with his movement and provide an attacking threat from anywhere on the field. Processes it so fast. His final product, especially final ball is excellent. He sees the final ball and can kill you with one pass at any moment. Has great vision and sees the game. Plays with a fantastic tempo. Has an ability to play at multiple speeds. Smooth on the ball, smooth on the turn, makes good decisions on the ball. Does the defensive work as well, presses hard and can cover ground. The full package. Unique profile with global standard attributes at the 10. Could be good as an 8 as well. Played almost a false 9/attacking midfield position. Gatorade national player of the year. (AJ)","class":"Sophomore","country":"Ghana","team":"Clemson Tigers","status":null,"file":"manual entry"}]},{"key":"tate johnson","name":"Tate Johnson","class":"Freshman","position":"LB","positions":["LB"],"position_full":"Left Back","foot":null,"country":"USA","dob":null,"team":"UNC Tar Heels","school":"UNC Tar Heels","intl":false,"grade":"A/A","grade_val":10,"grade_val_present":10,"grade_present":"A","grade_future":"A","years":[2024],"year":2024,"category":null,"status":"25 Dr Vancouver","rolenum":5,"n_reports":1,"reports":[{"dates":["09/20/2024"],"match":"UNC Tar Heels vs NC State Wolfpack","team":"UNC Tar Heels","source":"Video","grade":"A/A","grade_present":"A","grade_future":"A","role_code":"5-FB1","jersey":5,"position":"LB","position_full":"Left Back","foot":null,"class":"Freshman","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5’8”, lean build. Energetic and with high work rate. Excellent pace, quickness, agility and first-step. Low center of gravity and difficult to disposses. Okay in the air. Excellent technique quality. Smooth and composed. Poise on the ball. Can wiggle and get out things. Combination and link up play with midfield. Can pick a forward pass. Vision for the forward pass and movement into space. Excellent ability to project forward. Sharp into the challenge and reads the game. Times his challenges superbly. Rarely dives in and loses control. Steps strong and is committed. Final product is the only thing that’s lacking. Makes good decisions and doesn’t give it away cheaply. Understands when to project forward and gets the timing of his movement right. Can beat you off the dribble and has a bit of pop 1v1. Has potential to be a top 5 pick and the best LB in the country if he develops a final product. But as a freshman, he’s already close. European talent. Defensively tough, technically sound, energy going forward, sees the game, high soccer IQ and good build. I believe Charlotte has rights as he made 10 app. For Crown Legacy. Tampa Bay Rowdies academy. (AJ)","category":null,"status":"25 Dr Vancouver","role_name":"Wing Back"}]},{"key":"tyger smalls","name":"Tyger Smalls","class":"Junior","position":"RW","positions":["RW"],"position_full":"Right Wing","foot":null,"country":"England","dob":null,"team":null,"school":"LMU Lions","intl":true,"grade":"A","grade_val":10,"grade_val_present":10,"grade_present":"A","grade_future":"A","years":[2023],"year":2023,"category":null,"status":"24 Dr Charlotte","rolenum":7,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"A","grade_present":"A","grade_future":"A","role_code":"7-W1","jersey":7,"position":"RW","position_full":"Right Wing","foot":null,"class":"Junior","country":"England","year":2023,"file":"match-year: 2023 report","body":"6’1”, skinny build. Fluid athlete, loose, good pace, good power. Technically sound. Great technique with both feet. Kid is electric. Has flair, confidence, and flavor to his game. Very explosive, has pop, is tricky and dynamic in tight spaces. Looks to take defenders on 1v1, can beat you in a variety of ways, has unique and dynamic 1v1 ability. The back to goal play is a special attribute with him, he loves to post-up defenders and then uses a variety of tricks, flicks, and moves to get out tricky spots on the sideline. He spins defenders for fun with his repertoire of moves, and once he is in open space, there is no catching him. He eliminates you. Extremely fluid and smooth dribbler. He glides by defenders and is so dynamic off the dribble. He made the West Virginia defenders and midfielders, who were running with him or at him at full speed look like they weren’t even there. His passing is very good as well. Likes hitting the diagonal switch, can break a line, can play forward, and has excellent technique with both feet. Provides solid service but should have more assists given his ability. Final product just needs a bit of polish. Has shown flashes and moments of playing 1-2s and using combination play as well, which can add another dimension to his game. My only knock on him is he can be un-disciplined and loose with his positioning. There are times where is all-over the field and is just doing too much. Decision-making as well, just doing too much in less-than-ideal spots on the field, instead of just playing two-touch and being patient. Can force things a-bit, especially in the middle parts of the field, but it’s what you want to see given his ability. Just needs a touch more discipline and control. Overall, unique, and special profile however, smooth as butter on the ball and has flair, flavor, confidence, and is a match-winning talent. Massive potential. Played some ST for LMU, but projects best as a right winger. (AJ)","category":null,"status":"24 Dr Charlotte","role_name":"Chalk-on-Boots Winger"}]},{"key":"xavier oneil","name":"Xavier O’Neil","class":"Freshman","position":"RW","positions":["RW"],"position_full":"Right Wing","foot":null,"country":"USA","dob":null,"team":"Boston College","school":"Boston College","intl":false,"grade":"A/A","grade_val":10,"grade_val_present":10,"grade_present":"A","grade_future":"A","years":[2023],"year":2023,"category":null,"status":null,"rolenum":11,"n_reports":1,"reports":[{"dates":["08/28/2023"],"match":"Boston College vs Quinnipiac Bobcats","team":"Boston College","source":null,"grade":"A/A","grade_present":"A","grade_future":"A","role_code":"11-W1-7","jersey":11,"position":"RW","position_full":"Right Wing","foot":null,"class":"Freshman","country":"USA","year":2023,"file":"match-year: 2023 report","body":"Classic, traditional, chalk on the boots, receive to feet, drive 1v1 winger. Great frame, physical traits and athletic ability. Oozes confidence and comfort on the ball. Really good and dynamic 1v1. Has a variety of moves, feints, tricks, and skills when driving at the defender. Has good soccer IQ and will recycle and play simple when it is not on. Just super dynamic and lively 1v1. Has good pace. Final product does need some polish and needs to show he can use both feet consistently and be dangerous cutting onto both. But for a freshman, his profile, dynamic 1v1 ability, decision-making and technical quality is outstanding. DC United academy product.","category":null,"status":null,"role_name":"Chalk-on-Boots Winger"}]},{"key":"colton swan","name":"Colton Swan","class":"Freshman","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"USA","dob":null,"team":"Indiana University","school":"Indiana University","intl":false,"grade":"B/A","grade_val":10,"grade_val_present":7,"grade_present":"B","grade_future":"A","years":[2025],"year":2025,"category":null,"status":null,"rolenum":9,"n_reports":1,"reports":[{"dates":["08/21/2025"],"match":"Indiana University vs Clemson Tigers","team":"Indiana University","source":"Stream","grade":"B/A","grade_present":"B","grade_future":"A","role_code":"9-FWD1","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Freshman","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6’2”, lean, thick solid build. Unique hold up and target CF profile. Fantastic ability to check deep between the lines and cushion any type of entry and lay-off to the CAM/CM. Lovely, soft, quick, excellent feet for his size. Can use his chest, head and feet, to provide hold-up play, cushion and stick entries. Okay power and lower body power. Solid in the air, not great. Tracks the ball well. Speed of play and processing can improve. Decision-making is slow and hesitant in transition and open space. Has flashed the ability to spin and turn defenders to drive at backlines. Decision-making when to turn and when to lay-off first time is inconsistent and developing. Needs to provide a bigger threat in-behind and vary his movement more. But just has a unique ability to cushion any type of entry with different body parts, can use the bottom of his boot, chest, head, can kill a bouncing ball first-time, entries stick beautifully. Okay pace and power. Provides a target in the 18-yard box for clipped entry balls. If he develops a final pass and product with consistent decision-making and more movement in-behind, could be a special player.","category":null,"status":null,"role_name":"True #9 (Target)"}]},{"key":"efetobo aror","name":"Efetobo Aror","class":"Junior","position":"CDM","positions":["CDM"],"position_full":"Defensive Mid","foot":null,"country":"USA","dob":null,"team":"Portland","school":"Portland","intl":false,"grade":"B/A","grade_val":10,"grade_val_present":7,"grade_present":"B","grade_future":"A","years":[2025],"year":2025,"category":null,"status":null,"rolenum":6,"n_reports":1,"reports":[{"dates":["10/10/2025"],"match":"Portland vs San Diego","team":"Portland","source":"Video","grade":"B/A","grade_present":"B","grade_future":"A","role_code":"6-CMF-6 1","jersey":6,"position":"CDM","position_full":"Defensive Mid","foot":null,"class":"Junior","country":"USA","year":2025,"file":"match-year: 2025 report","body":"5’8”, skinny build. Exceptional, bright, sharp feet. Fluid mover on the ball with excellent manipulation. Composed and calm in the middle of the park; doesn’t waste a pass. Strong defensively with superior timing and balance into tackles. High IQ and doesn’t vacate the pocket or space unnecessarily. Great weight and timing on his passing—simple connector with the ability to play forward. Good pace and acceleration. Can show for the ball more and make himself more available in the pocket. Can dictate rhythm and tempo more; has all the tools to do so. Clean ball-striker with good technique. Feet, balance, body control, and fluidity are exceptional for the college level. Just needs to assert himself on the game more. Drafted by Colorado 12th last year. (AJ)","category":null,"status":null,"role_name":"True #6 (Double Pivot)"}]},{"key":"harvey sarajian","name":"Harvey Sarajian","class":"Sophomore","position":"LW","positions":["LW","ST"],"position_full":"Left Wing","foot":null,"country":"USA","dob":null,"team":"Wake Forest","school":"Georgia Southern","intl":false,"grade":"B/A","grade_val":10,"grade_val_present":7,"grade_present":"B","grade_future":"A","years":[2024,2025],"year":2025,"category":null,"status":null,"rolenum":11,"n_reports":2,"reports":[{"dates":["11/10/2024"],"match":"Georgia Southern vs West Virginia","team":"Georgia Southern","source":"Video","grade":"B/A","grade_present":"B","grade_future":"A","role_code":"11-W1","jersey":11,"position":"LW","position_full":"Left Wing","foot":null,"class":"Sophomore","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6'2\", lean, solid build. Strong and solid lower body. Excellent feet. Lovely feet in tight spaces and quarters. Soft feet. Excellent pace and uses good, long, strong strides. Smooth runner and easy acceleration/getaway speed. Balance is just okay. Slalomly and dynamic dribbler with good close ball control. Great 1v1 ability and strong change of pace and dip of the shoulder. Can cut onto both feet but is mainly left footed. Mainly uses a change of pace or dip of the shoulder or a few feints when going 1v1. Excellent technique and technically sound. Has conviction and texture with his ball striking. Final product is there. Has the technique to provide high quality service but potency/consistency is still developing. Aggressive 1v1 player and willing to take defenders on and drive at backlines. Excellent motor and engine. Constantly looking to drive forward and take defenders on. Does the defensive work as well and presses aggressively. Good soccer IQ and strong feel for the movement into the channel. Plays off the shoulder solidly but prefers to check deep to receive to feet and go 1v1. Can go 1v1 a bit too often and not recognize when its on/when to recycle and reset. Lacks a few more 1v1 tricks besides a change of pace. Has all the tools and is young, if he makes the jump to the ACC and Wake Forest his sophomore year, he is likely a first round pick.","category":null,"status":null,"role_name":"Chalk-on-Boots Winger"},{"dates":["08/24/2025"],"match":"Wake Forest vs UCF","team":"Wake Forest","source":"Stream","grade":"C/A","grade_present":"C","grade_future":"A","role_code":"11-W1","jersey":11,"position":"ST","position_full":"Striker","foot":null,"class":"Sophomore","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6’3”, lean solid build. Has been just okay in his first two games to start his Wake Forest career. Mobility, movement in-behind, timing of forward runs, have all been good. Flashed today some of his quality and aggressiveness in 1v1 scenarios but failed to get a shot off or provide quality product. His transitional and direct nature is sometimes at odds with Wake Forest’s heavy possession style, as he is not a inverted winger or false 9 who can play between the lines with nifty, incisive passes, flicks, touches etc., but wants to be direct in transition, in-behind and in-space. Still brings consistent pressing and defensive bite, along with movement in-behind from deeper build phases for balls into the channels and direct play. Continue to monitor. (AJ)","category":null,"status":null,"role_name":"Chalk-on-Boots Winger"}]},{"key":"josh maher","name":"Josh Maher","class":"Sophomore","position":"LCB","positions":["LCB"],"position_full":"Left Center Back","foot":null,"country":"USA","dob":null,"team":"Indiana","school":"Indiana","intl":false,"grade":"B/A","grade_val":10,"grade_val_present":7,"grade_present":"B","grade_future":"A","years":[2025],"year":2025,"category":null,"status":null,"rolenum":3,"n_reports":1,"reports":[{"dates":["10/25/2025","10/15/2025"],"match":"Indiana vs Maryland","team":"Indiana","source":"Video","grade":"B/A","grade_present":"B","grade_future":"A","role_code":"3-CB2","jersey":3,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"Sophomore","country":"USA","year":2025,"file":"match-year: 2025 report","body":"6'3\" with a lean, wiry build. Excellent feet for his size, very flexible with good body control. Shows good pace and burst, and is strong and sturdy with excellent balance, able to withstand contact. Good in the air with strong jump and reach. Defensively, he’s an excellent ball-playing defender. Steps in decisively to intercept and tackle, engaging early when FWDs receive to feet and not allowing them to turn, using his feet and body shape to control the duel. Excellent footwork/change of direction and tackling with good timing, balance, and force in 1v1s isolated defending. Shows good balance, strength, and body angles when stepping, and is strong in the air. Reads the game well with good positioning, rarely gets isolated 1v1 in the channel, and doesn’t allow FWDs to get forward-facing and drive at him once they receive. Strong anticipation. On the ball, he is clean out the back with good technical quality. Soft feet, great circulation, and good speed of play. Can find more line-splitting entries, and overall passing range and technique are just okay, also limited by playing as a RF at LCB. Very good short passing over 5–20 yards and can slip forward entries into the 6 and 8’s feet. Good composure under pressure to find smaller switches or speed up his circulation. Best CB in the country for me. MLS starter. Unique blend of intelligent defending, good feet and lateral movement for size, balance, clean footwork, strength, and technical quality out the back. (AJ)","category":null,"status":null,"role_name":"Big Athletic Presence"}]},{"key":"kamran acito","name":"Kamran Acito","class":"Senior","position":"RCB","positions":["RCB"],"position_full":"Right Center Back","foot":null,"country":"USA","dob":null,"team":"Duke","school":"Duke","intl":false,"grade":"B/A","grade_val":10,"grade_val_present":7,"grade_present":"B","grade_future":"A","years":[2024],"year":2024,"category":null,"status":null,"rolenum":4,"n_reports":2,"reports":[{"dates":["11/24/2024"],"match":"Duke vs San Diego","team":"Duke","source":"Video","grade":"B/A","grade_present":"B","grade_future":"A","role_code":"4-CB3","jersey":4,"position":"RCB","position_full":"Right Center Back","foot":null,"class":"Junior","country":null,"year":2024,"file":"match-year: 2024 report","body":"6'3\", lean build. Smooth and fluid athlete. Clean and composed out the back. Slightly above average vision. Can play the 5-10 yd forward pass. Clean technique and good right foot. Smooth dribbler and carries/drives into space assertively. Shows strong ability to drive and slip passes between the lines vs mid/low blocks. Struggles firing entries out of GK build and deeper build scenarios. Won’t pick locks between the lines vs low blocks. Average passing range and okay technique on 20+ yd passes. Excellent stand-up defender. Low center of gravity and strong balance, quick and soft feet allow him to use excellent technique and timing when defending 1v1. Doesn’t dive in and uses proper body positioning and shape to play the ball. Good first step and fluid hips. Hard to beat off the shoulder. Excellent positioning and reading of the game. Anticipates and doesn’t ball-watch. Good first step and good pace. Can struggle and get spun by physical and big 9s between the lines during 9 back to goal moments. Might struggle at the next level with bigger 9s who have better feet and can initiate contact and overpower him but the feet make up for a below average and slightly light frame. Below-average in the air and can struggle to track the ball and time his jump. Wont over-power bigger framed and physical 9s. Ball-playing CB who has USMNT U19 caps for good reason. NYCFC Academy. (AJ)","category":null,"status":null,"role_name":"Ball-Playing CB"},{"dates":["11/24/2024"],"match":"Duke vs San Diego","team":"Duke","source":"Video","grade":"B/A","grade_present":"B","grade_future":"A","role_code":"3-CB3","jersey":3,"position":"RCB","position_full":"Right Center Back","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6'3\", Tall, lean center back with smooth, fluid movement and strong balance. Composed in possession with clean right-foot technique, able to play accurate 5–10 yd forward passes and slip balls between the lines against mid/low blocks. Comfortable carrying into space and driving play forward. Passing range is average with only okay execution on 20+ yd balls, and can struggle to hit precise entries from GK or deep build positions. Excellent 1v1 stand-up defender with quick, soft feet, fluid hips, and strong timing in challenges. Uses proper body shape and positioning to win the ball without diving in. Reads the game well, anticipates play, and closes space quickly; difficult to beat off the shoulder. Below-average in aerial duels—struggles tracking flight, timing jumps, and over-powering bigger framed 9s. Can get turned when defending strong, technical target forwards with back to goal. Feet and anticipation compensate for lighter frame at this level, but physical matchups could be more challenging higher up. Projects as a composed, ball-playing CB whose defensive technique and mobility stand out, with room to grow in aerial dominance and long-range distribution","category":null,"status":null,"role_name":"Ball-Playing CB"}]},{"key":"lasse kelp","name":"Lasse Kelp","class":"Senior","position":"LCB","positions":["LCB"],"position_full":"Left Center Back","foot":null,"country":"Germany","dob":null,"team":"Maryland","school":"Maryland","intl":true,"grade":"B/A","grade_val":10,"grade_val_present":7,"grade_present":"B","grade_future":"A","years":[2025],"year":2025,"category":null,"status":null,"rolenum":4,"n_reports":2,"reports":[{"dates":["11/13/2025","11/08/2025"],"match":"Maryland vs UCLA","team":"Maryland","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"4-CB2","jersey":4,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"Senior","country":"Germany","year":2025,"file":"match-year: 2025 report","body":"6’3” with a solid, lean, slightly thicker build, especially through the lower body. Excellent lower-body explosion and sturdiness give him strong recovery pace with above-average stride length and good stability in duels. Reads the game well with strong positioning and anticipation, and has the physical tools to step in, sweep, arrive first to the ball, and tackle with timing, force, and balance when needed. Just okay in the air. Moves laterally well with a good turning radius, adjusts his feet when defending 1v1 against dribblers, and is sharp and assertive into the tackle. On the ball, shows good left-footed technique playing out from the back, a crisp passing tempo, and reliable circulation. Long-ball technique is average, and overall passing range is below average; lacks a consistent diagonal and balls in behind are generally wayward. Does struggle under pressure at times: often receives with a closed body shape and can be rushed into turnovers. Shows occasional ability to slip forward entries into the 6 and 8’s feet and offers some forward ball progression, but not consistently or at high volume. (AJ)","category":null,"status":null,"role_name":"Big Athletic Presence"},{"dates":["11/13/2025","11/08/2025"],"match":"Maryland vs UCLA","team":"Maryland","source":"Video","grade":"B/A","grade_present":"B","grade_future":"A","role_code":"4-CB2","jersey":4,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"Senior","country":null,"year":2025,"file":"match-year: 2025 report","body":"6’3” with a solid, lean, slightly thicker build, especially through the lower body. Excellent lower-body explosion and sturdiness give him excellent pace with above-average stride length and good stability in duels. Reads the game well with strong positioning and anticipation, and has the physical tools to step in, sweep, arrive first to the ball, and tackle with timing, force, and balance when needed. Good in the air. Moves laterally well with a good turning radius, adjusts his feet when defending 1v1 against dribblers, and is sharp and assertive into the tackle. On the ball, shows good left-footed technique playing out from the back, a crisp passing tempo, and reliable circulation. Long-ball technique is above average, and overall passing range is good. Does struggle under pressure at times: often receives with a closed body shape and can be rushed into turnovers. Shows occasional ability to slip forward entries into the 6 and 8’s feet and offers some forward ball progression, but not consistently or at high volume. Physical tools project to MLS, technically and tactically above-average. (AJ)","category":null,"status":null,"role_name":"Big Athletic Presence"}]},{"key":"nico quanbeck","name":"Nico Quanbeck","class":"Sophomore","position":"CM","positions":["CM"],"position_full":"Central Mid","foot":null,"country":"USA","dob":null,"team":"Davidson","school":"Davidson","intl":false,"grade":"B/A","grade_val":10,"grade_val_present":7,"grade_present":"B","grade_future":"A","years":[2023,2024],"year":2024,"category":null,"status":null,"rolenum":6,"n_reports":2,"reports":[{"dates":["09/03/2023"],"match":"Davidson Wildcats vs Virginia Tech","team":"Davidson Wildcats","source":null,"grade":"B/A","grade_present":"B","grade_future":"A","role_code":"6-CMF-6 1","jersey":6,"position":"CM","position_full":"Central Mid","foot":null,"class":"Freshman","country":null,"year":2023,"file":"match-year: 2023 report","body":"Okay game from him. Probably needs to play deeper in a double pivot, so he can get on the ball more, face the field and break lines. Has so much composure on the ball though, just zero panic to his game. Easily can get out of tight areas and sticky spots. Needs more from the players around him who struggle to combine and play with him at times. Still a bit green. Keep an eye on him though.","category":null,"status":null,"role_name":"True #6 (Double Pivot)"},{"dates":["10/12/2024","10/09/2024"],"match":"Davidson vs UMass","team":"Davidson","source":"Live","grade":"C/B","grade_present":"C","grade_future":"B","role_code":"8-CMF-8 3","jersey":8,"position":"CM","position_full":"Central Mid","foot":null,"class":"Sophomore","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6’1”, lean build. Smooth. High level technical quality. Sees the forward pass. Excellent in tight spaces. Smooth passer and dribbler. Moves off the ball but needs to check to the ball more. Plays with such good rhythm and timing. Has good feel for the game. Defensively strong and covers ground. Can break up play, tackle and has bulked up from his freshman year. High potential, keep an eye on for next year. (AJ)","category":null,"status":null,"role_name":"Jack of All Trades"}]},{"key":"rafa rios","name":"Rafa Rios","class":"Sophomore","position":"LCB","positions":["LCB"],"position_full":"Left Center Back","foot":null,"country":"Spain","dob":null,"team":"NCAA Tournament 1st Round North Florida","school":"NCAA Tournament 1st Round North Florida","intl":true,"grade":"B/A","grade_val":10,"grade_val_present":7,"grade_present":"B","grade_future":"A","years":[2024],"year":2024,"category":null,"status":null,"rolenum":4,"n_reports":1,"reports":[{"dates":["11/21/2024"],"match":"NCAA Tournament 1st Round North Florida vs West Virginia","team":"NCAA Tournament 1st Round North Florida","source":"Video","grade":"B/A","grade_present":"B","grade_future":"A","role_code":"4-CB3","jersey":4,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"Sophomore","country":"Spain","year":2024,"file":"match-year: 2024 report","body":"6’1’, lean build. Good athlete. Solid pace and strength. Agility and feet are okay. Reads the game excellently. Fantastic left foot. Two-footed. Sees the entry and a variety of different entry balls. Disguises his entries, can look off the midfielder and then slip it to the vacant space. Unique progressive passing ability. Fantastic technique and ball-playing ability. Tackles with excellent timing. Dealt with Ors Navarro multiple times in 1v1 situations and won every one of them with his timing and ball-playing ability. Got into a bit of trouble when he stepped too high into midfield and was spun by Ors Navarro and other attackers. But as WVU sat-off in the second half, he was North Florida’s best weapon at picking a lock and breaking their low-block. Has some serious potential. (AJ)","category":null,"status":null,"role_name":"Ball-Playing CB"}]},{"key":"roberto ordonez","name":"Roberto Ordonez","class":"Junior","position":"CF","positions":["CF"],"position_full":"Center Forward","foot":null,"country":"USA","dob":null,"team":"Cal St. Fullerton Titans","school":"Cal St. Fullerton Titans","intl":false,"grade":"B/A","grade_val":10,"grade_val_present":7,"grade_present":"B","grade_future":"A","years":[2023],"year":2023,"category":null,"status":"Graduated","rolenum":9,"n_reports":1,"reports":[{"dates":["10/08/2023"],"match":"Cal St. Fullerton Titans vs CSU Bakersfield Roadrunners","team":"Cal St. Fullerton Titans","source":"Video","grade":"B/A","grade_present":"B","grade_future":"A","role_code":"9-FWD3","jersey":9,"position":"CF","position_full":"Center Forward","foot":null,"class":"Junior","country":"USA","year":2023,"file":"match-year: 2023 report","body":"5’11”. Big frame. Unique profile at the forward or center forward position. Loves to drift into wide areas and provide service. Has good composure and feel in the final third. Really good link up play, combination play, and hold up play. Smooth operator and easy on the eye. Great technique. Does an excellent job dropping into positions between the lines or pockets to link the midfield with the front players. Second most assists in NCAA. Great off-ball movement. Has fantastic feel for the game and tactical understanding. Good technical quality. High soccer IQ. Just a unique profile for a forward. Comfortable in tight spaces and between the lines. Good vision for the pass, when he receives, is always looking to get his head up and find a forward in-behind or slip a wing-back. Top player, MLS potential and beyond.","category":null,"status":"Graduated","role_name":"False 9 / 2nd Striker"}]},{"key":"luis flores","name":"Luis Flores","class":"Senior","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"USA","dob":null,"team":"Oral Roberts","school":"Oral Roberts","intl":false,"grade":"A-","grade_val":9,"grade_val_present":9,"grade_present":"A-","grade_future":"A-","years":[2023,2024],"year":2024,"category":null,"status":"Graduated","rolenum":9,"n_reports":2,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"A-","grade_present":"A-","grade_future":"A-","role_code":"9-FWD3","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Junior","country":"USA","year":2023,"file":"match-year: 2023 report","body":"5’10”, lean build. Really good off-ball movement. Aggressive runner in-behind. Close ball control stands out. Comfortable and great ability in close quarters, tight spaces, and between the lines. Great technical quality, ball-striking and technique. High level tactical understanding and soccer IQ. Hold up play, link-up play, combination play, in-between the lines are all really good. Good presser, but technique needs refinement and attention to detail. Works well with a second striker who he can play with, open space for with his running in-behind and look to slip when he checks deep to receive. Adept at holding off bigger and stronger CBs when receiving to feet and spinning them. Comfortable checking deep to receive or running in-behind. When he checks deeps and receives, he has good vision and feel to find the right pass, slip a player, or just play simple. His repertoire of false 9 play is excellent. Movement as a poacher in and around the box can be better. Very smart player who has a bit of flair and flavor to his game. Well-rounded, has the attributes when facing goal, but also has the attributes with his back to goal. Has shown a bit of 1v1 ability when he can face up CBs and fullbacks as well. Top player with a unique profile. (AJ)","category":null,"status":"Graduated","role_name":"False 9 / 2nd Striker"},{"dates":["11/03/2024","10/31/2024"],"match":"Oral Roberts vs Denver","team":"Oral Roberts","source":"Video","grade":"B/B","grade_present":"B","grade_future":"B","role_code":"10-AMF-10 2","jersey":10,"position":"ST","position_full":"Striker","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5’11”, medium, stocky build. Strong and solid. Good pace. Goals haven’t been near the same as last year, but the profile is still there. Is a true false 9/10 who plays between the lines and threatens backlines with his dribbling, passing and shot. Adept at holding off bigger and stronger CBs when receiving to feet and spinning them. Just fantastic between the lines. Good technique. Technically sound. Can operate in the smallest of spaces and rarely turns it over. Fantastic close ball control. Excellent feel and processing. High level tactical understanding and quality. Plays fast and with tempo in the final third. Wants to spin you and drive at backlines to find final balls and shots on goal. Sees and executes the final ball, excellent passing range and vision. Just always seems to find the right pass in the final third. Willing to take risks 1v1 but lacks a few tricks and feints, is still a bit one-dimensional 1v1. Also is one-footed, weaker right-foot isn’t there. Can be a bit reckless and lose control. Excellent final product and finishing technique. Strong mentality and aggressiveness. Presses hard and does the defensive work. Isn’t afraid of a challenge and wants to get stuck in. Lack of goals this year is concerning. I think he is a 10 at the next level or a 2nd striker in a 2-striker system. Certainly, plays underneath but has shown the ability to make runs in-behind as well. Would fit USL well especially with the USL C teams who play 352/343 and would be an excellent complement to an athletic 9 who will stretch teams vertically. Just lacks a touch of polish and 1v1 ability to really project in MLS. (AJ)","category":null,"status":"Graduated","role_name":"Modern 3-4-2-1 #10"}]},{"key":"gaku nishimura","name":"Gaku Nishimura","class":"Sophomore","position":"LB/CDM","positions":["LB/CDM"],"position_full":"Left Back / Defensive Mid","foot":null,"country":"Japan","dob":null,"team":null,"school":"San Jose State Spartans","intl":true,"grade":"B+/A-","grade_val":9,"grade_val_present":8,"grade_present":"B+","grade_future":"A-","years":[2023],"year":2023,"category":null,"status":null,"rolenum":6,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"B+/A-","grade_present":"B+","grade_future":"A-","role_code":"6- CMF-6 2","jersey":6,"position":"LB/CDM","position_full":"Left Back / Defensive Mid","foot":null,"class":"Sophomore","country":"Japan","year":2023,"file":"match-year: 2023 report","body":"5’8”, skinny build. Fantastic technical quality. Silky smooth. Fluid, calm, and comfortable on the ball. Great technique. Good range of passing, vision, and progressive passing ability. High soccer IQ, understands the game, really good off the ball and feel for the game. Speed of play is fantastic, has a nose for tempo-setting in the buildup, rarely takes three touches. Always looking to swing, play simple, just keeps the ball moving constantly and efficiently. Knows how to get out of things. He’s a connector and distributor, but not a playmaker or creator. But his distribution and tempo setting are fantastic. Not a great progressive dribbler or ball carrier, just wants to sit deep and connect. Struggles with his back to goal or when he has a defender on his back, can get spun and easily dispossessed. Didn’t look to be overly two-footed. He will get your playmakers the ball and get them ball in good areas where they can do damage and create. Athletically, below-average. Won’t win many duels, ground, and air. Has shown ability to get a foot into a challenge, when needed. But overall is a minus on the physical, athletic, and defensive front. Shouldn’t discount the massive technical and tactical upside. I like him at the 6 much more than LB, just lacks the final product at LB. Defensively will struggle at LB as well. But if he’s at LB, his biggest upside would be as an inverted fullback, someone who can tuck inside. That’s the only scenario I would play him at LB. San Jose St. made the switch from LB to 6 early in the season and haven’t looked back since. Unique profile with elite attributes and traits. (AJ)","category":null,"status":null,"role_name":"Single Pivot Holder"}]},{"key":"daniel mangarov","name":"Daniel Mangarov","class":"Grad Student","position":"RM","positions":["RM"],"position_full":"Right Mid","foot":null,"country":"USA","dob":null,"team":"Virginia Cavaliers","school":"Virginia Cavaliers","intl":false,"grade":"A/B+","grade_val":8,"grade_val_present":10,"grade_present":"A","grade_future":"B+","years":[2024],"year":2024,"category":null,"status":"Chattanooga MLS NP","rolenum":10,"n_reports":1,"reports":[{"dates":["09/14/2024"],"match":"Virginia Cavaliers vs Wake Forest Deamon Deacons","team":"Virginia Cavaliers","source":"Live","grade":"A/B+","grade_present":"A","grade_future":"B+","role_code":"10-AMF-10 1","jersey":10,"position":"RM","position_full":"Right Mid","foot":null,"class":"Grad Student","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5’7”, skinny build. Unique feel for the game. Soccer IQ is off the charts. Can operate in tight spaces. Slick on and off the ball. Slippery on the ball. Can get out things. Two-footed. Delivered an unreal ball off a corner with his left foot, and provided an excellent cross with his right, 10 minutes later. Has such good technique, ball-striking and texture w/ both feet. Willing to go 1v1 and take risks in the final third. Can combine and use his teammates. Can show a bit more in terms of final ball and product. Has flashes but needs to put up numbers. Willing runner into space. Aggressive and sharp into the challenge. Does the defensive work and is willing to smash someone. Soccer IQ and tactical understanding is unique and special for the college level. Decision-making is so polished. Has the technical profile to go with it. Just athletically short to really project as an 8, 10, or winger at the MLS level. A tweener fit at the MLS level. Technical and tactical attributes project to MLS and beyond. Would destroy USL like Luna and Nick Markanich did. MLS bench/USLC starter. (AJ)","category":null,"status":"Chattanooga MLS NP","role_name":"Enganche (Playmaker #10)"}]},{"key":"nick dang","name":"Nick Dang","class":"Junior","position":"RCB","positions":["RCB"],"position_full":"Right Center Back","foot":null,"country":"USA","dob":null,"team":"Virginia Cavaliers","school":"Virginia Cavaliers","intl":false,"grade":"A/B+","grade_val":8,"grade_val_present":10,"grade_present":"A","grade_future":"B+","years":[2024],"year":2024,"category":null,"status":"25 Dr RSL","rolenum":3,"n_reports":1,"reports":[{"dates":["09/14/2024"],"match":"Virginia Cavaliers vs Wake Forest Deamon Deacons","team":"Virginia Cavaliers","source":"Live","grade":"A/B+","grade_present":"A","grade_future":"B+","role_code":"3-CB1","jersey":3,"position":"RCB","position_full":"Right Center Back","foot":null,"class":"Junior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"6’2, 180lbs. Medium build. Has all the qualities of a top CB. Solid, lean build. Has the recovery speed to cover depth but also the anticipation to cut it out, read the game and play the ball. Deals with everything. Sharp into the challenge. Reads and intercepts through balls. Willing to go with attackers into midfield and knock down entries. Must see more of him laterally and side to side but wouldn’t imagine it’s a big weakness. Excellent in the air. Has the vision and technique for the entry. Willing to drive and step into midfield. Good technique and right foot. Great range of passing. Technical, physical and tactical attributes all project to the MLS level. Could perhaps use one more year in college or MLS NP/USL to really be ready but everything is there. MLS bench/USLC starter. Transfer from Lipscomb. (AJ)","category":null,"status":"25 Dr RSL","role_name":"Leader of the Line"}]},{"key":"marco martinez","name":"Marco Martinez","class":"Sophomore","position":"LCB","positions":["LCB"],"position_full":"Left Center Back","foot":null,"country":"Spain","dob":null,"team":null,"school":"Pacific Tigers","intl":true,"grade":"B+","grade_val":8,"grade_val_present":8,"grade_present":"B+","grade_future":"B+","years":[2023],"year":2023,"category":null,"status":null,"rolenum":4,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"B+","grade_present":"B+","grade_future":"B+","role_code":"4-CB3","jersey":4,"position":"LCB","position_full":"Left Center Back","foot":null,"class":"Sophomore","country":"Spain","year":2023,"file":"match-year: 2023 report","body":"6’4”, lean build. Smooth passer. Really good technique, sees the pass well, can play forward, can break a line, can hit a long ball. Two-footed. Reads the game well and looks to step into the midfield with attackers to break up entry balls. Very good at finding a variety of entry balls and line-breaking passes. Can struggle when pressed, not overly press-resistant but does well-enough for it not to be a weakness. Likes to step out to attackers but can step too far out and get caught. Doesn’t have top end athletic ability and pace to make up for it. 1v1 technique is good though when he stays home, shows attackers to one-side, and cuts them off. Has sound defending technique, understands how to defend with positioning, body angle, and reads the game well with good ball-playing and entry ball ability. (AJ)","category":null,"status":null,"role_name":"Ball-Playing CB"}]},{"key":"yeider zuluaga","name":"Yeider Zuluaga","class":"Sophomore","position":"W","positions":["W"],"position_full":"Winger","foot":null,"country":"USA","dob":null,"team":null,"school":"Seattle Redhawks","intl":false,"grade":"B+","grade_val":8,"grade_val_present":8,"grade_present":"B+","grade_future":"B+","years":[2023],"year":2023,"category":null,"status":null,"rolenum":11,"n_reports":1,"reports":[{"dates":[],"match":null,"team":null,"source":"Wyscout","grade":"B+","grade_present":"B+","grade_future":"B+","role_code":"11-W1","jersey":11,"position":"W","position_full":"Winger","foot":null,"class":"Sophomore","country":"USA","year":2023,"file":"match-year: 2023 report","body":"5’11”, lean build. Good athlete, good pace. Great technical quality. Understands the game, good soccer IQ, great tactical understanding. Two footed. Can take defenders inside on his right foot and can take them to the by-line for a cutback. 1v1 ability is good, he is brave, he wants to take risk, he wants to get at defenders. He has a solid variety of feints, step-overs, and 1v1 moves. Struggled to create when teams would double and triple team him, but in isolated moments he was dynamic. Has shown some ability to create with his passing off the dribble as well. Good composure in the final third. Tricky and comfortable in tight spaces. Has missed some chances you’d expect him to put away. Final product can use some work, but the profile is unique and interesting. He can develop into a top winger with some polish. (AJ)","category":null,"status":null,"role_name":"Chalk-on-Boots Winger"}]},{"key":"brigham larsen","name":"Brigham Larsen","class":"Senior","position":"ST","positions":["ST"],"position_full":"Striker","foot":null,"country":"Norway","dob":null,"team":"Charlotte 49ers","school":"Charlotte 49ers","intl":true,"grade":"B/B+","grade_val":8,"grade_val_present":7,"grade_present":"B","grade_future":"B+","years":[2024],"year":2024,"category":null,"status":"Pitt Riverhounds","rolenum":9,"n_reports":3,"reports":[{"dates":["08/24/2024"],"match":"Charlotte 49ers vs Davidson Wildcats","team":"Charlotte 49ers","source":"Stream","grade":"B/B+","grade_present":"B","grade_future":"B+","role_code":"9-FWD1","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Senior","country":"Norway","year":2024,"file":"match-year: 2024 report","body":"6’4”, 189lbs. Solid frame and lean build. Does the dirty work and has improved technical quality to where the entries stick better than they used to. Digs out balls in the corner. Provides an outlet for transition. At his best when he plays one-touch and spins off defenders. Has an eye for the occasional spectacular. Poacher inside the box. Willing to run near-post and far. Dangerous on set-pieces. Does the work off the ball with his movement. Pressing can improve but we also played a back 3 which it made more difficult for him. A constant threat even if he’s not scoring or if he’s not providing hold-up play. He can always make something happen in-and-around the 18 or help your team win a throw in the opposition half to get you out of pressure. Edge of B/A, B+ projection. (AJ)","category":null,"status":"Pitt Riverhounds","role_name":"True #9 (Target)"},{"dates":["08/24/2024"],"match":"Charlotte 49ers vs Davidson Wildcats","team":"Charlotte 49ers","source":"Stream","grade":"B/B+","grade_present":"B","grade_future":"B+","role_code":"9-FWD1","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Senior","country":"Norway","year":2024,"file":"match-year: 2024 report","body":"6’4”, lean, muscular build. Didn’t have his best game. Struggled to get Charlotte out their end and didn’t impact the game as much as he could. Just lacking a bit of finesse and creativity in terms of solving problems and figuring out how to get by Heffess whose excellent at dealing with 9s between the lines. Still think he is one of the better strikers in the country but didn’t have a great showing today. (AJ)","category":null,"status":"Pitt Riverhounds","role_name":"True #9 (Target)"},{"dates":["08/24/2024"],"match":"Charlotte 49ers vs Davidson Wildcats","team":"Charlotte 49ers","source":"Stream","grade":"B/B+","grade_present":"B","grade_future":"B+","role_code":"9-FWD1","jersey":9,"position":"ST","position_full":"Striker","foot":null,"class":"Senior","country":"Norway","year":2024,"file":"match-year: 2024 report","body":"6’4”. Unique profile. Great athleticism and pace. Extremely strong and physical. But it’s the hold-up and link up play that really stands out. His hold up play is fantastic. He plays two touch, checks into pockets, lays off to the midfielders, and is immediately spinning and running in-behind. He can play one-touch as well. Two footed, and has a rocket shot from both feet. The running into channels is sudden, explosive, and dangerous as well. Can score from all areas of the field. One of the best 9s I have seen in college soccer. Has good soccer IQ and tactical understanding. He can consistently and reliably be an outlet pressure, and provide excellent link up and hold-up play.","category":null,"status":"Pitt Riverhounds","role_name":"True #9 (Target)"}]},{"key":"chris meyers","name":"Chris Meyers","class":"Senior","position":"LWB","positions":["LWB"],"position_full":"Left Wingback","foot":null,"country":"USA","dob":null,"team":"Washington Huskies","school":"Washington Huskies","intl":false,"grade":"B/B+","grade_val":8,"grade_val_present":7,"grade_present":"B","grade_future":"B+","years":[2024],"year":2024,"category":null,"status":"Graduated","rolenum":5,"n_reports":1,"reports":[{"dates":["08/29/2024"],"match":"Washington Huskies vs Denver","team":"Washington Huskies","source":"Stream","grade":"B/B+","grade_present":"B","grade_future":"B+","role_code":"5-FB1","jersey":5,"position":"LWB","position_full":"Left Wingback","foot":null,"class":"Senior","country":"USA","year":2024,"file":"match-year: 2024 report","body":"5’8”, skinny build. Superb technical quality. Ability to receive diagonals with ease. Composure and poise on the ball. Has a bit of flair and plays with an edge. Tricky and nifty in tight spaces. Can tuck inside. Good lung capacity and ability to get up and down. A bit of 1v1 ability. Good left-foot. Decision-making can be spotty and can play faster. Final product needs refinement. Dealt with 1v1 duels and diagonals hit his way well. Project on the verge of B/A. (AJ)","category":null,"status":"Graduated","role_name":"Wing Back"}]},{"key":"jesus barea","name":"Jesus Barea","class":"Senior","position":"CAM","positions":["CAM","ST"],"position_full":"Striker","foot":null,"country":"Spain","dob":null,"team":"Missouri State Bears","school":"Missouri State Bears","intl":true,"grade":"B/B+","grade_val":8,"grade_val_present":7,"grade_present":"B","grade_future":"B+","years":[2023,2024],"year":2024,"category":null,"status":"25 Dr RSL","rolenum":10,"n_reports":2,"reports":[{"dates":["10/08/2023"],"match":"Missouri State Bears vs University of Illinois-Chicago Flames","
